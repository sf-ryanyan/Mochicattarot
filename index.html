<style>
/* Layout: midnight sky stage, cream mochi-cat cards float on it; one centered column, roomy bands */
:root{--night:#1E1A3C;--night2:#28234E;--night3:#342E62;--ink:#F7F2FF;--muted:#BDB4DD;--gold:#F5CF86;--gold-ink:#3A2A10;--pink:#FFB8C9;--mint:#A8E6CF;--line:rgba(247,242,255,.13);
--display:'Fredoka','ZCOOL KuaiLe','PingFang SC',system-ui,sans-serif;--body:'Nunito','PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans SC',system-ui,sans-serif;color-scheme:dark}
body[data-lang="zh"]{--display:'ZCOOL KuaiLe','Fredoka','PingFang SC',system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0}img{max-width:100%}
[hidden]{display:none!important}
body{background:var(--night);color:var(--ink);font:400 16px/1.7 var(--body);-webkit-font-smoothing:antialiased}
body.lock{overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--night)}
#sky{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
#sky i{position:absolute;border-radius:50%;background:#fff;opacity:.55;animation:tw 4s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.15}50%{opacity:.8}}
header,main,footer{position:relative;z-index:1}
.display{font-family:var(--display);font-weight:500;letter-spacing:.005em}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.2}
p{margin:0}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.pad{padding-block:40px 80px}
.center{text-align:center}
.muted{color:var(--muted)}.small{font-size:14px}
.eyebrow{font-size:13px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--gold)}
.lede{color:var(--muted);font-size:18px;max-width:46ch;margin-top:12px}
.h1{font-size:clamp(2rem,4.6vw,3.2rem)}.h2{font-size:clamp(1.5rem,3vw,2.1rem)}
.kw{color:var(--gold);font-size:14px;font-weight:600;letter-spacing:.04em}
.tip{display:block;background:rgba(245,207,134,.12);border-radius:14px;padding:12px 16px}
.tip b{display:block;color:var(--gold);font-size:13px;letter-spacing:.06em;margin-bottom:2px}
header{position:sticky;z-index:20;top:env(safe-area-inset-top,0px);background:rgba(30,26,60,.88);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.hwrap{display:flex;align-items:center;gap:16px;padding-block:10px}
#brand{display:flex;align-items:center;gap:10px;color:var(--ink);text-decoration:none}
#logo{width:40px;height:40px;display:block}#logo svg{width:100%;height:100%}
.brand{font-size:21px;white-space:nowrap}
.nav{display:flex;gap:4px;margin-left:auto}
@media (min-width:721px){header .hwrap{padding-right:max(160px,env(safe-area-inset-right,0px))}}
.nav a{color:var(--muted);text-decoration:none;padding:7px 14px;border-radius:999px;font-weight:600;font-size:15px;white-space:nowrap}
@media (hover:hover){.nav a:hover{color:var(--ink)}}.nav a.on{background:var(--night3);color:var(--ink)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{border:0;background:transparent;color:var(--muted);padding:5px 12px;border-radius:999px;font:600 14px var(--body);cursor:pointer}
.seg button.on{background:var(--gold);color:var(--gold-ink)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 24px;border-radius:999px;font:700 15px var(--body);border:0;cursor:pointer;transition:transform .15s,background .2s}
@media (hover:hover){.btn:hover{transform:translateY(-2px)}.btn.ghost:hover{border-color:var(--gold)}.spread:hover,.topic:hover{transform:translateY(-3px)}.lc:hover{transform:translateY(-6px) rotate(-1deg)}.pile:hover .stack{transform:translateY(-8px)}.wc:hover{transform:rotate(var(--a)) translateY(calc(var(--r) - 10px))}}
.btn.gold{background:var(--gold);color:var(--gold-ink)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.big{padding:15px 32px;font-size:17px}
.btn:disabled{opacity:.35;cursor:not-allowed;transform:none}
button:focus-visible,a:focus-visible,textarea:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.row{display:flex;flex-wrap:wrap;gap:12px;margin-top:28px}
.hero{display:grid;grid-template-columns:1.1fr .9fr;align-items:center;gap:32px;padding-block:56px 32px}
.hero-title{font-size:clamp(2.5rem,6.2vw,4.5rem);line-height:1.12;margin-top:14px}
#hero-art svg{width:100%;max-width:440px;display:block;margin:0 auto}
.daily{display:grid;grid-template-columns:minmax(150px,230px) 1fr;gap:clamp(24px,5vw,56px);align-items:center;background:var(--night2);border:1px solid var(--line);border-radius:32px;padding:clamp(24px,4vw,48px)}
#daily-text{display:grid;gap:12px;justify-items:start;min-width:0}
#daily-text h3{font-size:clamp(1.6rem,3vw,2.2rem)}
.feats{display:grid;grid-template-columns:repeat(3,1fr);gap:28px;padding-block:56px 80px}
.feat{border-top:1px solid var(--line);padding-top:20px;display:grid;gap:8px}
.feat h3{font-size:20px;display:flex;align-items:center;gap:10px}
.feat h3::before{content:"";width:12px;height:12px;background:var(--gold);clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%)}
.feat p{color:var(--muted)}
.flip{display:block;width:100%;aspect-ratio:2/3;background:none;border:0;padding:0;cursor:pointer;perspective:1200px}
.flip .inner{position:relative;display:block;width:100%;height:100%;transition:transform .8s cubic-bezier(.3,.7,.25,1);transform-style:preserve-3d}
.flip.flipped .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.face svg{width:100%;height:100%;display:block;filter:drop-shadow(0 12px 22px rgba(5,3,20,.45))}
.front{transform:rotateY(180deg)}
.flip.rev .front svg{transform:rotate(180deg)}
.steps{list-style:none;display:flex;flex-wrap:wrap;gap:8px;padding:0;margin:0 0 28px}
.steps li{display:flex;align-items:center;gap:8px;padding:5px 14px 5px 5px;border-radius:999px;background:var(--night2);color:var(--muted);font-size:14px;font-weight:600}
.steps li span{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--night3);font-size:13px}
.steps li.on{color:var(--ink)}.steps li.on span{background:var(--gold);color:var(--gold-ink)}
.steps li.done span{background:var(--mint);color:#1C3A30}
.spreads{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin:32px 0}
.spread{display:grid;gap:6px;text-align:left;background:var(--night2);border:1.5px solid var(--line);border-radius:22px;padding:22px;color:var(--ink);font:inherit;cursor:pointer;transition:border-color .2s,transform .15s}
.spread.on{border-color:var(--gold);background:var(--night3)}
.spread b{font-size:20px;font-weight:500}.spread span{color:var(--muted)}.spread small{color:var(--gold);font-size:13px;font-weight:600}
.mini{display:flex;gap:5px;margin-bottom:6px}.mini i{width:16px;height:24px;border:1.5px solid var(--gold);border-radius:4px}
.spread.on .mini i{background:rgba(245,207,134,.25)}
.qlabel{display:block;font-weight:700;margin-bottom:8px}
textarea{width:100%;max-width:720px;background:var(--night2);border:1px solid var(--line);border-radius:16px;padding:14px 16px;color:var(--ink);font:inherit;resize:vertical;display:block}
textarea::placeholder{color:#8C83B0}
#go-shuffle{margin-top:28px}
.deck{position:relative;width:150px;aspect-ratio:2/3;margin:40px auto 32px}
.dk{position:absolute;inset:0}.dk svg{width:100%;height:100%;filter:drop-shadow(0 10px 18px rgba(5,3,20,.5))}
.dk0,.dk2{animation:rl 1.05s ease-in-out 2}.dk1,.dk3{animation:rr 1.05s ease-in-out 2}.dk4{animation:bob 1.05s ease-in-out 2}
.dk1{animation-delay:.08s}.dk2{animation-delay:.16s}.dk3{animation-delay:.24s}
@keyframes rl{0%,100%{transform:none}35%{transform:translateX(-82px) rotate(-10deg)}65%{transform:translateX(-30px) rotate(-3deg)}}
@keyframes rr{0%,100%{transform:none}35%{transform:translateX(82px) rotate(10deg)}65%{transform:translateX(30px) rotate(3deg)}}
@keyframes bob{0%,100%{transform:none}50%{transform:translateY(-14px)}}
.count{display:inline-block;margin-left:6px;padding:2px 12px;border-radius:999px;background:var(--night3);color:var(--ink);font-size:15px}
.count b{color:var(--gold)}
.slots{display:flex;justify-content:center;gap:clamp(12px,3vw,28px);margin:28px 0 12px}
.slot{width:clamp(72px,16vw,104px);display:grid;gap:8px;text-align:center;color:var(--muted);font-size:14px;font-weight:600}
.slot-card{aspect-ratio:2/3;border:1.5px dashed rgba(245,207,134,.45);border-radius:12px}
.slot.filled .slot-card{border:0;animation:pop .35s ease}.slot.filled{color:var(--gold)}
.slot-card svg{width:100%;height:100%;display:block}
@keyframes pop{0%{transform:scale(.85);opacity:0}100%{transform:none;opacity:1}}
.fan{position:relative;margin:28px 0 8px}
.fc{position:absolute;background:none;border:0;padding:0;cursor:pointer;transform:rotate(var(--r));transform-origin:50% 130%;transition:transform .22s ease,opacity .35s ease}
.fc svg{width:100%;height:100%;display:block;filter:drop-shadow(0 6px 10px rgba(5,3,20,.45))}
.fc.taken{opacity:0;pointer-events:none;transform:translateY(-50px) rotate(var(--r))}
.qbox{background:var(--night2);border:1px solid var(--line);border-radius:22px;padding:22px 28px;display:grid;gap:6px}
.qbox p{font-size:clamp(1.25rem,2.6vw,1.6rem)}
.result-cards{display:flex;justify-content:center;flex-wrap:wrap;gap:clamp(14px,3vw,36px);margin:36px 0}
.rc{width:clamp(96px,26vw,210px);display:flex;flex-direction:column;align-items:center;gap:10px}
.badge{display:inline-block;padding:2px 12px;border-radius:999px;background:rgba(168,230,207,.16);color:var(--mint);font:700 13px var(--body);vertical-align:middle;letter-spacing:.02em}
.badge.r{background:rgba(255,184,201,.16);color:var(--pink)}
.details{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.det{background:var(--night2);border:1px solid var(--line);border-radius:22px;padding:22px;display:grid;gap:8px;align-content:start;min-width:0}
.det h3{font-size:22px}
.summary{margin-top:24px;border:1.5px solid rgba(245,207,134,.5);border-radius:26px;padding:clamp(22px,4vw,36px);display:grid;gap:12px}
.disc{color:var(--muted);border:1px solid var(--line);border-radius:14px;padding:12px 16px;margin-top:8px}
.actions{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin:32px 0 12px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:28px 0}
.chip{border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:999px;padding:8px 16px;font:600 15px var(--body);cursor:pointer}
.chip small{opacity:.7;margin-left:2px}
.chip.on{background:var(--gold);color:var(--gold-ink);border-color:var(--gold)}
.lib{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:22px}
.lc{background:none;border:0;padding:0;cursor:pointer;transition:transform .2s}
.lc svg{width:100%;display:block;filter:drop-shadow(0 10px 16px rgba(5,3,20,.4))}
.soon{display:flex;flex-wrap:wrap;gap:32px;align-items:center;background:var(--night2);border:1px solid var(--line);border-radius:28px;padding:clamp(24px,4vw,44px)}
.soon>div:last-child{flex:1;min-width:220px;display:grid;gap:10px}
.soon-card{width:150px}.soon-card svg{width:100%;display:block}
.narrowcol{max-width:800px}
.gs{display:grid;grid-template-columns:56px 1fr;gap:16px;border-top:1px solid var(--line);padding-block:26px}
.gs:first-of-type{margin-top:28px}
.gn{font-family:var(--display);color:var(--gold);font-size:22px}
.gs h2{font-size:23px;margin-bottom:8px}.gs p{color:var(--muted);max-width:62ch}
.narrowcol .btn.big{margin-top:28px}
footer{border-top:1px solid var(--line);padding-block:28px 36px;text-align:center;color:var(--muted);font-size:14px}
footer .wrap{display:grid;gap:8px;justify-items:center}
footer p:first-child{max-width:70ch}
#modal{position:fixed;inset:0;z-index:50;background:rgba(10,8,26,.74);display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.m-box{position:relative;background:var(--night2);border:1px solid var(--line);border-radius:28px;max-width:880px;width:100%;max-height:100%;overflow:auto;padding:clamp(20px,4vw,36px)}
#m-close{position:absolute;top:14px;right:14px;padding:6px 16px;font-size:14px;z-index:2}
#m-body{display:grid;grid-template-columns:250px 1fr;gap:32px;align-items:start}
.m-card svg{width:100%;display:block;filter:drop-shadow(0 12px 22px rgba(5,3,20,.45))}
.m-text{display:grid;gap:10px;min-width:0;padding-top:8px}
dl{margin:6px 0 4px}dl div{border-top:1px solid var(--line);padding:10px 0}
dt{color:var(--gold);font-size:13px;font-weight:700;letter-spacing:.06em}dd{margin:2px 0 0}
.spread,.topic{display:grid;gap:6px;text-align:left;background:var(--night2);border:1.5px solid var(--line);border-radius:22px;padding:20px 22px;color:var(--ink);font:inherit;cursor:pointer;transition:border-color .2s,transform .15s}
.topic.on,.spread.on{border-color:var(--gold);background:var(--night3)}
.topics{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin:28px 0 8px}
.topic b{font-size:20px;font-weight:500}.topic span:last-child{color:var(--muted)}
.ti{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:50%;margin-bottom:4px}
.ti svg{width:22px;height:22px}
.ti-general{color:var(--gold);background:rgba(245,207,134,.14)}.ti-love{color:var(--pink);background:rgba(255,184,201,.14)}.ti-career{color:var(--mint);background:rgba(168,230,207,.14)}.ti-money{color:#FFD98A;background:rgba(255,217,138,.14)}
.h3{font-size:clamp(1.3rem,2.4vw,1.6rem);margin-top:36px}
.lede.mid{margin-left:auto;margin-right:auto}
.piles{display:flex;justify-content:center;flex-wrap:wrap;gap:clamp(20px,6vw,64px);margin:48px 0 16px}
.pile{background:none;border:0;padding:0;cursor:pointer;display:grid;gap:14px;justify-items:center;color:var(--ink);font:700 16px var(--body);transition:opacity .4s,transform .4s}
.stack{position:relative;display:block;width:clamp(84px,22vw,120px);aspect-ratio:2/3;transition:transform .3s}

<script>
const CARDS=[];
function C(n,z,e){const f=a=>({name:a[0],kw:a[1],advice:a[2],scene:a[3],up:a[4],rev:a[5],love:[a[6],a[7]],career:[a[8],a[9]],money:[a[10],a[11]],act:[a[12].split('/'),a[13].split('/')]});CARDS.push({n,zh:f(z),en:f(e)});}

C('0',[`愚者`,`新的开始・冒险・自由`,`相信自己，勇敢出发。`,
`团子猫背着小包袱，开心地走到悬崖边，阳光正好。它不怕前方未知，只带着好奇心出发。`,
`一段新的旅程正在开始。你不需要把一切都准备好，最重要的是迈出第一步。保持开放和好奇，会遇到意想不到的惊喜。`,
`你可能太冲动，没想清楚就往前冲；也可能因为害怕而一直不敢开始。出发前先看清方向，但别让担心把你困在原地。`,
`新的缘分正在靠近，或者你们的关系进入轻松有趣的新阶段。不要想太多，用真诚和好玩的心去相处。`,
`对感情可能不够认真，或者害怕投入。想清楚自己要的是什么，再决定要不要前进。`,
`适合尝试新工作、新项目或新领域。即使经验不多，你的热情和新鲜视角就是优势。`,
`计划还不成熟，或者太急着换跑道。先做好基本功课，再大胆行动。`,
`可能出现新的赚钱机会，可以小额尝试。保持灵活，但记得给自己留一点安全垫。`,
`小心冲动消费和“看起来很好赚”的投资。花钱前多问自己一句：真的需要吗？`,
`列出一件一直想做的新事情，这周就开始/给自己留一点即兴的空间/主动认识一位新朋友`,
`做决定前先停下来想 10 分钟/把计划写下来，检查有没有漏洞/找信任的人听听意见`],
[`The Fool`,`New beginnings · Adventure · Freedom`,`Trust yourself and begin.`,
`The mochi cat carries a small bundle and walks happily to a cliff edge in the sun. It does not fear the unknown and sets off with curiosity.`,
`A new journey is starting. You don't need everything ready; the first step matters most. Stay open and curious, and you will find happy surprises.`,
`You may rush ahead without thinking, or fear may keep you from starting at all. Check your direction first, but don't let worry keep you stuck.`,
`New love is coming close, or your relationship enters a fun, fresh stage. Don't overthink it. Be sincere and playful.`,
`You may not take love seriously, or you fear committing. Know what you want before you move forward.`,
`A good time to try a new job, project, or field. Even with little experience, your energy and fresh view are strengths.`,
`Your plan isn't ready yet, or you are rushing to switch paths. Do your homework first, then act boldly.`,
`A new way to earn may appear. Try it in small amounts. Stay flexible, but keep a safety cushion.`,
`Watch out for impulse buys and "easy money" deals. Before you spend, ask: do I really need this?`,
`Pick one new thing you've wanted to try and start this week/Leave some room for spontaneity/Say hello to someone new`,
`Pause 10 minutes before deciding/Write your plan down and check for gaps/Ask someone you trust for advice`]);

C('I',[`魔术师`,`行动・创造・技能`,`把想法变成行动。`,
`团子猫举起魔法棒，头顶有无限符号，身边放着杯子和金币。它手上已经有了需要的一切。`,
`你已经拥有实现目标需要的能力和资源，现在缺的只是行动。把想法说出来、做出来，你会发现自己比想象中更有影响力。`,
`你的才能没有被好好使用，或者计划一直停在脑子里。也要小心有人用好听的话误导你，看行动，不要只听说法。`,
`主动表达会带来好的回应。你的魅力正旺，真诚说出心意，比一直等待更有效。`,
`对方可能说得多、做得少，或者你在感情里不够真诚。看对方怎么做，比听他怎么说更重要。`,
`很适合提案、谈判、创业或展示作品。你的能力会被看见，抓住机会表现自己。`,
`有好点子但执行力不足，或者沟通出了问题。把大目标拆成小步骤，先完成一件。`,
`你可以靠技能和创意赚钱，副业或新的收入来源值得尝试。`,
`小心话术和看起来太好的机会。签约或付款前，先把细节看清楚。`,
`今天就为一个想法做出第一步/盘点你已经拥有的技能和资源/主动联系一个能帮你的人`,
`把大计划拆成 3 个小步骤/遇到推销先等 24 小时再决定/多看行动，少听承诺`],
[`The Magician`,`Action · Creation · Skill`,`Turn ideas into action.`,
`The mochi cat raises a magic wand under an infinity sign, with a cup and a coin nearby. It already has everything it needs.`,
`You already have the skills and resources to reach your goal. All that's missing is action. Speak up and act, and you will find you have more power than you think.`,
`Your talents are unused, or your plans stay in your head. Also watch for people who use nice words to mislead you. Judge actions, not talk.`,
`Making the first move brings a good response. Your charm is strong, and saying how you feel works better than waiting.`,
`Someone may talk more than they act, or you may not be fully honest. Watch what they do, not just what they say.`,
`Great for pitches, negotiations, starting a business, or showing your work. Your skills will be seen, so step up.`,
`Good ideas but weak follow-through, or poor communication. Break big goals into small steps and finish one.`,
`Your skills and ideas can earn money. A side hustle or new income source is worth a try.`,
`Beware of sales talk and deals that sound too good. Read every detail before you sign or pay.`,
`Take the first step on one idea today/List the skills and resources you already have/Reach out to someone who can help`,
`Split your big plan into 3 small steps/Wait 24 hours before saying yes to a pitch/Trust actions more than promises`]);

C('II',[`女祭司`,`直觉・智慧・秘密`,`相信直觉。`,
`团子猫安静地坐在黑白两根柱子中间，手捧卷轴，头顶有一颗星。它不急着说话，只用心感受。`,
`现在不是急着行动的时候，而是安静观察、倾听直觉的时候。答案其实已经在你心里，只是需要一点安静才能听见。`,
`你可能忽略了内心的声音，或者有些信息还没浮出水面。先别急着下结论，也别被别人的意见带着走。`,
`关系里有很多没说出口的感受。对方可能比较含蓄，需要你用心感受，而不是急着要答案。`,
`可能有秘密或误会，或者你压抑了自己的感受。找个合适的时机，温和地把话说开。`,
`适合学习、研究和观察，先别公开所有计划。你的直觉对判断人和机会特别准。`,
`信息不完整，或者有人没把话说清楚。重要决定前多确认一次。`,
`谨慎是好事。投资或签约前仔细研究，相信那种“好像哪里怪怪的”感觉。`,
`可能有隐藏费用或没注意到的细节。检查账单和合约里的小字。`,
`每天留 10 分钟安静独处/写下你的第一直觉/多听少说`,
`重要的事情再确认一次/把心里的话先写下来再沟通/暂时不要做重大决定`],
[`The High Priestess`,`Intuition · Wisdom · Secrets`,`Trust your intuition.`,
`The mochi cat sits quietly between a dark and a light pillar, holding a scroll under a star. It doesn't rush to speak; it listens with its heart.`,
`This is a time to observe and listen to your intuition, not to rush. The answer is already inside you; you just need some quiet to hear it.`,
`You may be ignoring your inner voice, or some facts are still hidden. Don't jump to conclusions or let others' opinions lead you.`,
`There are unspoken feelings. The other person may be quiet about them. Feel it out instead of pushing for answers.`,
`There may be secrets or misunderstandings, or you are holding back your feelings. Find a good moment to talk it through gently.`,
`Good for learning, research, and observing. Keep some plans private. Your gut feeling about people and chances is sharp now.`,
`Information is incomplete, or someone isn't being clear. Double-check before big decisions.`,
`Caution is good. Research before investing or signing, and trust that "something feels off" feeling.`,
`There may be hidden fees or missed details. Check your bills and the fine print.`,
`Spend 10 quiet minutes alone each day/Write down your first gut feeling/Listen more than you speak`,
`Double-check important facts/Write down your feelings before you talk/Hold off on big decisions for now`]);

C('III',[`女皇`,`丰盛・温柔・创造力`,`好好照顾自己，享受当下。`,
`团子猫戴着星星皇冠，身边是金色麦穗和小花，胸前抱着一颗爱心。它被丰收和温暖包围着。`,
`生活进入丰盛、舒服的阶段。你的付出开始有收获，也适合好好享受生活、照顾自己，并把这份温暖分享给身边的人。`,
`你可能一直在照顾别人而忘了自己，或者过度依赖别人的照顾，创意也可能卡住了。先把自己的需要放回第一位。`,
`感情温暖甜蜜，关系稳定成长。单身的人魅力很足，容易吸引到温柔的人。`,
`付出不平衡，一方给得太多；或者太黏、太想控制。给彼此一点空间。`,
`创意和合作都很顺，特别适合设计、内容、照顾人相关的工作。团队气氛很好。`,
`工作太累或创意枯竭。休息一下，换个环境找灵感。`,
`财务状况良好，有收获的机会，可以适度犒赏自己。`,
`小心为了让自己开心而花太多钱。享受可以，但要在预算之内。`,
`为自己安排一件享受的小事/去大自然走走/对身边的人表达关心`,
`学会说“不”，留时间给自己/好好睡一觉/检查最近的花费`],
[`The Empress`,`Abundance · Nurturing · Creativity`,`Nurture yourself and enjoy the moment.`,
`The mochi cat wears a crown of stars, surrounded by golden wheat and flowers, hugging a heart. It is wrapped in harvest and warmth.`,
`Life enters a rich, comfortable season. Your efforts begin to pay off. Enjoy life, care for yourself, and share the warmth with others.`,
`You may care for everyone but yourself, or lean too much on others. Your creativity may also feel stuck. Put your own needs first again.`,
`Love is warm and sweet and grows steadily. If you are single, your charm is strong and you attract kind people.`,
`The giving is unequal, or someone is too clingy or controlling. Give each other some space.`,
`Creativity and teamwork flow well, especially in design, content, or caring roles. Team spirit is good.`,
`You are overworked or out of ideas. Rest and look for inspiration somewhere new.`,
`Finances are healthy and rewards are coming. It's fine to treat yourself a little.`,
`Careful not to overspend just to feel good. Enjoy yourself within your budget.`,
`Plan one small treat for yourself/Spend some time in nature/Show care to people close to you`,
`Learn to say no and keep time for yourself/Get a good night's sleep/Review your recent spending`]);

C('IV',[`皇帝`,`稳定・规则・领导力`,`定好目标，坚持执行。`,
`团子猫戴着金色皇冠坐在宝座前，手拿权杖，神情认真。它在守护自己的王国。`,
`现在需要清晰的规划、纪律和责任感。你有能力掌控局面，定下规则并坚持执行，会让一切稳定下来。`,
`可能太固执、太想控制一切，让身边的人有压力；也可能缺少规划，事情一团乱。试着在坚定和弹性之间找到平衡。`,
`关系需要承诺和责任感。对方可能是可靠、成熟的人，能给你安全感。`,
`一方太强势或控制欲强，另一方感到压力。好的关系需要平等。`,
`适合担任领导角色，建立制度和流程。上司或有权威的人可能会支持你。`,
`和上司或制度有冲突，或者管理方式太僵硬。多听听团队的声音。`,
`做好预算和长期规划，稳健理财胜过冒险。`,
`财务没有计划，或者太过保守而错失机会。重新整理一下收支。`,
`写下本月的 3 个目标/制定一个固定的作息/把分工说清楚`,
`试着放下一件你想控制的事/问问别人的想法/为财务做一个简单预算`],
[`The Emperor`,`Stability · Structure · Leadership`,`Set goals and follow through.`,
`The mochi cat wears a golden crown in front of a throne, holding a scepter with a serious look. It is guarding its kingdom.`,
`Clear plans, discipline, and responsibility are needed now. You can take charge. Set rules and stick to them, and things will become stable.`,
`You may be too stubborn or controlling, which stresses others. Or there is no plan and things are messy. Find a balance between firm and flexible.`,
`The relationship needs commitment and responsibility. The other person may be reliable and mature, giving you a sense of safety.`,
`One person is too dominant or controlling, and the other feels pressure. Good love needs equality.`,
`Good for leading and building systems. A boss or authority figure may support you.`,
`Conflict with a boss or with the rules, or your management is too rigid. Listen to your team more.`,
`Make a budget and a long-term plan. Steady saving beats risky bets.`,
`There is no money plan, or you are so cautious that you miss chances. Review your income and spending.`,
`Write 3 goals for this month/Set a regular routine/Make clear who does what`,
`Let go of one thing you try to control/Ask others for their ideas/Make a simple money budget`]);

C('V',[`教皇`,`传统・学习・指引`,`虚心求教。`,
`团子猫戴着高高的帽子，捧着一本书，背后是拱门，脚下有两把钥匙。它像一位温和的老师。`,
`向有经验的人学习，遵循成熟可靠的方法，会让事情更顺利。这也是适合学习、上课、寻找导师的时候。`,
`你可能想打破传统、走自己的路，也可能盲目跟从别人定下的规则。问问自己：这条规则真的适合我吗？`,
`重视承诺和共同的价值观，可能考虑见家长、订婚或更长期的关系。`,
`双方观念不同，或者被家庭、社会的期待压着。找到属于你们自己的相处方式。`,
`适合进修、考证书、加入组织，或请教前辈。按照规矩来会有好结果。`,
`公司制度让你感到受限，或者方法太老旧。可以提出改进，但要讲方法。`,
`选择稳健、正规的理财方式，可以咨询专业人士。`,
`不要因为“大家都这样做”就跟风投资，先做自己的功课。`,
`报名一门想学的课/请教一位前辈/采用已经验证过的方法`,
`想想哪些规则已经不适合你/用自己的方式试一次/投资前自己研究清楚`],
[`The Hierophant`,`Tradition · Learning · Guidance`,`Ask for guidance.`,
`The mochi cat wears a tall hat and holds a book in front of an arch, with two keys at its feet. It is like a kind teacher.`,
`Learn from experienced people and use proven methods, and things will go more smoothly. It's also a good time to study, take a class, or find a mentor.`,
`You may want to break tradition and go your own way, or you may follow others' rules blindly. Ask yourself: does this rule really fit me?`,
`Commitment and shared values matter. You may think about meeting the family, getting engaged, or a long-term step.`,
`You see things differently, or family and social expectations weigh on you. Find a way that works for the two of you.`,
`Good for further study, certifications, joining groups, or asking seniors for advice. Following the rules pays off.`,
`Company rules feel limiting, or the methods are outdated. Suggest improvements, but do it wisely.`,
`Choose safe, traditional money options. Consider asking a professional.`,
`Don't invest just because everyone else is. Do your own research first.`,
`Sign up for a class you want to take/Ask a senior or mentor for advice/Use a proven method`,
`Think about which rules no longer fit you/Try it your own way once/Research before you invest`]);

C('VI',[`恋人`,`爱・选择・连结`,`做选择时听从内心。`,
`两只团子猫开心地伸出小手，头顶有一颗大大的爱心。它们彼此吸引，心意相通。`,
`一段重要的关系或一个重要的选择出现了。这张牌提醒你跟随真心，选择和你的价值观一致的路。`,
`关系出现失衡，或者你在两个选择之间犹豫不决。也可能你的行动和你真正重视的东西不一致。`,
`很好的感情牌！彼此吸引、心意相通。单身的人可能遇到很有感觉的对象。`,
`沟通不顺、价值观不合，或者有外来的诱惑。坦诚聊聊彼此真正想要的是什么。`,
`遇到合拍的合作伙伴，或面临重要的职业选择。选你真心热爱的方向。`,
`合作出现分歧，或者在两份工作之间难以抉择。列出你最重视的三件事来帮助判断。`,
`和伴侣或合伙人一起规划财务，会有好结果。`,
`因为钱和伴侣或合伙人产生分歧。大的花费先商量。`,
`对重要的人说出你的心意/做选择时问自己“我真正想要什么”/安排一次两个人的约会`,
`列出你最重视的 3 件事/找时间好好沟通/不要为了讨好别人而做选择`],
[`The Lovers`,`Love · Choices · Connection`,`Choose with your heart.`,
`Two mochi cats reach out happily under a big heart. They are drawn to each other and share the same feelings.`,
`An important relationship or choice appears. This card reminds you to follow your heart and choose the path that matches your values.`,
`A relationship is out of balance, or you are torn between two choices. Your actions may not match what you truly value.`,
`A great love card. Strong attraction and understanding. If you are single, you may meet someone special.`,
`Poor communication, different values, or outside temptation. Talk honestly about what you each really want.`,
`You meet a great partner, or face a key career choice. Choose the path you truly love.`,
`A partnership has disagreements, or you can't choose between two jobs. List your top three values to help you decide.`,
`Planning money together with a partner brings good results.`,
`Money causes disagreement with a partner. Talk before big spending.`,
`Tell someone important how you feel/When choosing, ask "what do I truly want?"/Plan a date for two`,
`List the 3 things you value most/Make time for an honest talk/Don't choose just to please others`]);

C('VII',[`战车`,`意志・前进・胜利`,`专注目标，全速前进。`,
`团子猫坐在星星战车上，双手高举欢呼，头顶有星星拱门。它正全速向前冲。`,
`凭着决心和行动力，你能克服阻碍、一路向前。目标清楚、专注前进，胜利就在前方。`,
`方向不明或失去控制，力气用错了地方。先停下来确定目标，再出发。`,
`主动争取会有进展，关系往前推进。但记得照顾对方的节奏，不要太强势。`,
`关系中有拉扯或争执，两个人往不同方向走。先确认你们要去的是同一个地方。`,
`目标明确，项目快速推进，有望拿下成果。适合冲刺和竞争。`,
`工作节奏乱、压力大，或者同时做太多事。先集中火力做最重要的一件。`,
`积极行动会带来收入增加，但要控制节奏，不要冲过头。`,
`花钱失控或投资太冲动。先踩刹车，重新规划。`,
`定下一个明确的目标和期限/每天推进一小步/专注，不分心`,
`停下来重新确认方向/一次只做一件事/冷静下来再做决定`],
[`The Chariot`,`Willpower · Progress · Victory`,`Focus and go for it.`,
`The mochi cat rides a star chariot, cheering with both paws up under an arch of stars. It is charging forward at full speed.`,
`With determination and action, you can overcome obstacles and keep moving. Stay clear and focused, and victory is ahead.`,
`There is no clear direction, or you are losing control and wasting energy. Stop, set your goal, then go again.`,
`Taking action moves things forward. But respect their pace and don't be too pushy.`,
`There is push and pull, or arguing, and you are heading different ways. Make sure you want the same thing.`,
`Clear goals and fast progress; success is within reach. Great for sprints and competition.`,
`Work feels chaotic and stressful, or you are doing too much at once. Focus on the most important task first.`,
`Action brings more income. Keep a steady pace and don't overdo it.`,
`Spending is out of control or investing is too rash. Hit the brakes and replan.`,
`Set one clear goal and deadline/Move forward a little every day/Stay focused and avoid distractions`,
`Pause and confirm your direction/Do one thing at a time/Calm down before deciding`]);

C('VIII',[`力量`,`勇气・温柔・耐心`,`温柔地坚持。`,
`团子猫温柔地伸手摸摸小狮子的头，小狮子也开心地笑了。真正的力量不是凶，而是温柔。`,
`真正的力量来自温柔、耐心和内心的勇气。用平静和善意面对困难，你能化解看起来很难的局面。`,
`你可能在怀疑自己，或者情绪容易失控。别对自己太严格，先照顾好自己的情绪，信心会慢慢回来。`,
`用包容和耐心经营感情，关系会更稳固。温柔就是你最大的魅力。`,
`可能有情绪化的争吵，或者在关系中缺乏自信。先冷静，再沟通。`,
`面对压力能保持冷静，你的坚持和耐心会被看见。适合处理难缠的人和事。`,
`压力太大、信心不足。把目标拆小，一点点建立成就感。`,
`控制冲动、长期坚持，财务会慢慢变好。`,
`容易因为情绪而花钱。心情不好的时候先别购物。`,
`用温和的方式处理一件难事/每天给自己一句鼓励/对别人多一点耐心`,
`情绪激动时先深呼吸 10 次/记录每天完成的小事/和信任的人聊聊`],
[`Strength`,`Courage · Gentleness · Patience`,`Be gently persistent.`,
`The mochi cat gently pats a little lion, and the lion smiles too. True strength is not fierce; it is gentle.`,
`Real strength comes from gentleness, patience, and inner courage. Face problems calmly and kindly, and you can solve what seems hard.`,
`You may doubt yourself, or your emotions run high. Don't be too hard on yourself. Care for your feelings first, and your confidence will return.`,
`Patience and kindness make love stronger. Gentleness is your greatest charm.`,
`There may be emotional fights, or you lack confidence in love. Calm down first, then talk.`,
`You stay calm under pressure, and your patience will be noticed. Good for handling difficult people and tasks.`,
`Too much stress and low confidence. Break goals down and build small wins.`,
`Control impulses and stay patient, and your finances will slowly improve.`,
`You may spend because of emotions. Avoid shopping when you feel down.`,
`Handle one hard thing in a gentle way/Give yourself one kind word each day/Be a bit more patient with others`,
`Take 10 deep breaths when you are upset/Write down your small wins each day/Talk to someone you trust`]);

C('IX',[`隐者`,`独处・反思・寻找`,`慢下来，听听自己。`,
`团子猫站在山顶，提着一盏小星星灯，安静地照亮前方的路。夜空很静，它在寻找内心的答案。`,
`这是适合独处、反思和沉淀的时期。暂时远离喧闹，向内寻找答案，你会更清楚自己真正想要什么。`,
`你可能把自己封闭得太久，变得孤单；也可能一直在逃避需要面对的事。适当和外界连结，寻求帮助也没关系。`,
`需要一些时间想清楚自己真正想要什么。单身也很好，是认识自己的好机会。`,
`关系中有距离感，或者你太封闭，不让对方靠近。试着敞开一点心。`,
`适合深入研究、学习专业，或独立完成一件需要专注的事。不必急着表现。`,
`太孤立、缺少交流，或者迷失了方向。找一位前辈或导师聊聊。`,
`简单生活，减少不必要的开支，财务会更稳定。`,
`对钱的问题一直在逃避。是时候面对账单，好好整理了。`,
`安排一段不被打扰的独处时间/写日记整理思绪/少滑手机，多散步`,
`主动联系一位好久不见的朋友/列出你在逃避的事，先处理一件/寻求专业意见`],
[`The Hermit`,`Solitude · Reflection · Inner search`,`Slow down and listen to yourself.`,
`The mochi cat stands on a hilltop holding a little star lantern, lighting the path ahead. The night is quiet; it is searching for answers inside.`,
`This is a time for solitude and reflection. Step away from the noise and look inside, and you will see what you truly want.`,
`You may have shut yourself away too long and feel lonely, or you are avoiding something you need to face. Reconnect with others; asking for help is okay.`,
`You need time to know what you truly want. Being single is fine and a good chance to know yourself.`,
`There is distance in the relationship, or you keep the other person out. Try to open up a little.`,
`Good for deep study, building expertise, or focused solo work. No need to rush to show off.`,
`You are too isolated, or you feel lost. Talk to a mentor or someone more experienced.`,
`Live simply and cut extra spending, and your finances will be steadier.`,
`You have been avoiding money matters. It's time to face the bills and sort them out.`,
`Plan some quiet alone time/Journal to sort your thoughts/Scroll less and walk more`,
`Reach out to a friend you miss/List what you are avoiding and handle one thing/Get expert advice`]);

C('X',[`命运之轮`,`转变・机遇・循环`,`顺势而为。`,
`团子猫坐在巨大的命运之轮前开心地举手，轮子正在转动，四周闪着金色的星星。`,
`命运的齿轮正在转动，好运和新机会即将到来。顺着变化走，准备好在机会出现时抓住它。`,
`遇到暂时的低潮，或者计划被打乱。记住，轮子会继续转，坏时机也会过去。先把握你能控制的部分。`,
`缘分到来！可能有意外的相遇，或者关系出现好的转机。`,
`关系起伏不定，时好时坏。不要急着下结论，给时间一点空间。`,
`突然出现好机会，可能是升职、新工作或好项目。准备好就去抓住。`,
`计划受外在因素影响而延迟。保持弹性，准备好备用方案。`,
`财运上升，可能有意外收入。好时机要把握，也记得存下一部分。`,
`财务起伏较大，避免高风险投资，留好应急金。`,
`对新机会说“好”/更新你的简历或作品集/留意身边的小巧合`,
`准备一个备用方案/专注在你能控制的事情上/存一笔应急金`],
[`Wheel of Fortune`,`Change · Luck · Cycles`,`Go with the flow.`,
`The mochi cat sits in front of a giant wheel and cheers as it turns, with golden stars all around.`,
`The wheel of fate is turning. Good luck and new chances are coming. Go with the change and be ready to catch the chance when it comes.`,
`A temporary low, or your plans get disrupted. Remember, the wheel keeps turning and bad times pass. Focus on what you can control.`,
`Fate brings love. An unexpected meeting or a happy turning point may come.`,
`The relationship has ups and downs. Don't rush to judge; give it some time.`,
`A sudden opportunity appears: a promotion, a new job, or a good project. Be ready to grab it.`,
`Plans are delayed by outside factors. Stay flexible and have a backup plan.`,
`Money luck rises, maybe with unexpected income. Use the good timing, and save some of it.`,
`Finances swing up and down. Avoid high risk and keep an emergency fund.`,
`Say yes to a new chance/Update your resume or portfolio/Notice the small coincidences around you`,
`Prepare a backup plan/Focus on what you can control/Build an emergency fund`]);

C('XI',[`正义`,`公平・真相・因果`,`诚实，公平。`,
`团子猫一手举着金色天平，表情认真又公正。两边的柱子代表秩序和平衡。`,
`公平、诚实和理性会带来好结果。你过去的付出会得到相应的回报。做决定时要客观，对自己和别人都诚实。`,
`可能遇到不公平的对待，或者你在逃避该负的责任。诚实面对，事情才会回到正轨。`,
`关系需要平等和坦诚。付出与回报平衡的时候，感情最稳定。`,
`关系里有不平等或不诚实的地方。把问题摊开来说清楚。`,
`合同、法律、谈判类的事务对你有利。用事实和数据说话。`,
`可能遇到不公平的评价或纠纷。保留好记录，冷静处理。`,
`收支平衡，账目清楚。适合处理税务、合约等事务。`,
`账目不清或有纠纷。仔细核对每一笔。`,
`做决定前列出利弊/整理一下文件和账目/对自己诚实`,
`保留重要的书面记录/承认一个自己的错误/听听公正第三方的意见`],
[`Justice`,`Fairness · Truth · Cause and effect`,`Be honest and fair.`,
`The mochi cat holds up golden scales with a fair, serious face. The pillars stand for order and balance.`,
`Fairness, honesty, and clear thinking bring good results. Your past efforts will be rewarded. Decide objectively and be honest with yourself and others.`,
`You may face unfair treatment, or you are avoiding responsibility. Be honest, and things will get back on track.`,
`Love needs equality and honesty. When giving and receiving are balanced, love is most stable.`,
`There is unfairness or dishonesty in the relationship. Bring the issues out and talk clearly.`,
`Contracts, legal matters, and negotiations favor you. Let facts and data speak.`,
`You may face an unfair review or a dispute. Keep records and stay calm.`,
`Balanced income and spending, with clear records. Good for taxes and contracts.`,
`Unclear records or a dispute. Check every item carefully.`,
`List pros and cons before deciding/Organize your papers and accounts/Be honest with yourself`,
`Keep important written records/Own one of your mistakes/Ask a fair third party for their view`]);

C('XII',[`倒吊人`,`暂停・换角度・放下`,`换个角度看看。`,
`团子猫倒挂在树枝上，表情却很平静，周围有一圈柔和的光。换个角度，世界看起来完全不同。`,
`事情暂时卡住，但这是一个停下来、换个角度思考的好机会。放下“一定要这样”的执着，你会看到新的答案。`,
`你可能拖延太久，或者一直在为别人做无谓的牺牲。等待已经够了，是时候做出决定。`,
`不要强求，给关系一点时间和空间。换位思考，你会更理解对方。`,
`在一段关系里付出很多却没有回应，或者一直原地踏步。想想你还要等多久。`,
`进展比较慢，适合重新规划、学习新技能。暂停也是一种准备。`,
`拖延和犹豫让机会溜走。给自己设定期限，做出决定。`,
`暂时不要做重大的财务决定，先观察一段时间。`,
`资金卡住，或者一直在等回报。重新评估，必要时及时止损。`,
`从对方的角度想一次/给自己一段暂停的时间/试一种完全不同的方法`,
`给悬而未决的事定一个期限/停止一件不值得的付出/今天就做一个决定`],
[`The Hanged Man`,`Pause · New view · Letting go`,`Try a different view.`,
`The mochi cat hangs upside down from a branch, yet looks calm, with a soft glow around it. From a new angle, the world looks different.`,
`Things are stuck for now, but it's a good chance to pause and see from a new angle. Let go of "it must be this way," and new answers appear.`,
`You may have waited too long, or you keep making needless sacrifices. Enough waiting; it's time to decide.`,
`Don't force it. Give the relationship time and space. Seeing their side will help you understand.`,
`You give a lot without getting anything back, or the relationship isn't moving. Think about how long you will wait.`,
`Progress is slow. A good time to replan and learn new skills. A pause is also preparation.`,
`Delay and doubt are costing you chances. Set a deadline and decide.`,
`Hold off on big money decisions and watch for a while.`,
`Money is stuck, or you keep waiting for returns. Reassess, and cut losses if needed.`,
`Think from the other person's side once/Give yourself a pause/Try a totally different approach`,
`Set a deadline for an open issue/Stop one sacrifice that isn't worth it/Make one decision today`]);

C('XIII',[`死神`,`结束・转变・新生`,`放下，才能重新开始。`,
`团子猫挥手送走飘落的秋叶，旁边的小芽正冒出新叶。这张牌在说：结束之后，就是新的开始。`,
`一个阶段正在结束，也许是一段关系、一份工作或一个旧习惯。放下旧的，才有空间迎接新的。这张牌代表转变，不代表真正的死亡。`,
`你害怕改变，紧抓着已经不适合的东西不放。改变总会来，越早接受，就越早轻松。`,
`关系进入新阶段，或者是时候放下过去的感情，让心重新出发。`,
`舍不得放手一段已经结束的感情，或者害怕关系改变。诚实面对自己的感受。`,
`工作上有大变化，可能是转职、转型或结束一个项目。这是成长的机会。`,
`明知道需要改变却一直拖着。想想继续下去的代价是什么。`,
`改掉旧的消费习惯，重新规划财务，会有新的开始。`,
`不愿意面对财务问题，问题只会越来越大。现在就开始整理。`,
`清理一样不再需要的东西/写下一个你想告别的旧习惯/为新开始做一个小计划`,
`问问自己“我在害怕什么”/朝改变迈出一小步/和信任的人聊聊你的不安`],
[`Death`,`Endings · Change · Renewal`,`Let go to begin again.`,
`The mochi cat waves goodbye to falling autumn leaves while a little sprout grows nearby. The card says: after an ending comes a new beginning.`,
`A chapter is ending, maybe a relationship, a job, or an old habit. Letting go makes room for the new. This card means change, not real death.`,
`You fear change and hold on to what no longer fits. Change will come; the sooner you accept it, the sooner you feel lighter.`,
`The relationship enters a new stage, or it's time to let go of a past love and start fresh.`,
`You can't let go of a love that has ended, or you fear change. Be honest about your feelings.`,
`Big changes at work: a new role, a new direction, or the end of a project. It's a chance to grow.`,
`You know you need to change but keep delaying. Think about the cost of staying where you are.`,
`Drop old spending habits and replan your finances for a fresh start.`,
`Avoiding money problems makes them grow. Start sorting them out now.`,
`Clear out one thing you no longer need/Write down an old habit to say goodbye to/Make a small plan for a new start`,
`Ask yourself "what am I afraid of?"/Take one small step toward change/Share your worries with someone you trust`]);

C('XIV',[`节制`,`平衡・调和・耐心`,`凡事适度。`,
`团子猫一手一个杯子，把水从一个杯子倒进另一个，一滴都没洒出来。它在调和与平衡。`,
`保持平衡和适度是现在的关键。慢慢来，不走极端，把不同的东西调和在一起，一切会刚刚好。`,
`生活失去平衡，可能工作太多、休息太少，或者做事太急、太过头。先找回自己的节奏。`,
`关系和谐，彼此互相配合、互相包容。慢慢经营就很好。`,
`两人节奏不一致，或者一方付出过多。试着找到中间点。`,
`团队协作顺利，适合整合资源、协调不同的意见。`,
`工作和生活失衡，或者团队意见冲突。先调整工作量。`,
`收支平衡，以稳定为主，不需要冒险。`,
`花钱太多或太省都会出问题。找到适合自己的平衡点。`,
`今天好好吃一顿健康的饭/把工作和休息安排得刚刚好/遇到分歧时找中间方案`,
`减少一件让你过度忙碌的事/早点睡觉/做事放慢一点`],
[`Temperance`,`Balance · Harmony · Patience`,`Everything in moderation.`,
`The mochi cat holds a cup in each paw and pours water from one to the other without spilling a drop. It is blending and balancing.`,
`Balance and moderation are key now. Go slowly, avoid extremes, and blend things together, and everything will turn out just right.`,
`Life is out of balance: too much work, too little rest, or rushing and overdoing it. Find your rhythm again.`,
`Harmony in love. You support and accept each other. Taking it slow is perfect.`,
`You move at different speeds, or one person gives too much. Try to meet in the middle.`,
`Teamwork goes smoothly. Good for combining resources and bringing different views together.`,
`Your work-life balance is off, or the team disagrees. Adjust your workload first.`,
`Balanced finances. Stay steady; there is no need for risk.`,
`Spending too much or too little both cause problems. Find your balance point.`,
`Eat one healthy meal today/Balance your work and rest/Look for a middle ground in disagreements`,
`Drop one thing that makes you too busy/Go to bed earlier/Slow down a little`]);

C('XV',[`恶魔`,`欲望・诱惑・束缚`,`看清束缚你的是什么。`,
`团子猫头上长出一对小角，旁边有一条松松的锁链。仔细看，锁链其实没有锁住它，它随时可以离开。`,
`留意那些让你上瘾、依赖或被束缚的事物，例如坏习惯、不健康的关系或对物质的执着。好消息是：锁链是松的，你其实可以挣脱。`,
`你开始意识到问题所在，正在一步步摆脱束缚。继续坚持，你会越来越自由。`,
`强烈的吸引力，但要留意控制、占有欲或不健康的依赖。爱应该让人自由。`,
`正在走出一段消耗你的关系，或者学会在关系里保持自我。`,
`被薪水或压力绑住，做着不喜欢的事。想想有没有其他选择。`,
`开始找回工作的主导权，摆脱不健康的环境。`,
`小心冲动消费、借贷和投机，不要被“快速致富”诱惑。`,
`正在戒掉坏的消费习惯，开始还债或存钱。`,
`找出一个让你上瘾的习惯/买东西前设一个“冷静期”/远离让你消耗的人`,
`庆祝摆脱坏习惯的每一天/记录每一笔花费/找人一起互相监督`],
[`The Devil`,`Desire · Temptation · Attachment`,`See what holds you back.`,
`The mochi cat has little horns, with a loose chain nearby. Look closely: the chain isn't locked. It can walk away anytime.`,
`Notice what hooks or binds you: bad habits, unhealthy relationships, or chasing things. Good news: the chain is loose. You can break free.`,
`You see the problem and are breaking free step by step. Keep going, and you will feel freer and freer.`,
`Strong attraction, but watch for control, jealousy, or unhealthy dependence. Love should set you free.`,
`You are leaving a draining relationship, or learning to stay yourself in love.`,
`You feel tied to money or pressure in a job you dislike. Think about your other options.`,
`You are taking back control and leaving an unhealthy work situation.`,
`Beware of impulse buys, debt, and gambling. Don't fall for "get rich quick."`,
`You are breaking bad spending habits and starting to pay off debt or save.`,
`Name one habit that hooks you/Set a cool-down period before buying/Step away from draining people`,
`Celebrate each day free of a bad habit/Track every expense/Find a buddy to keep each other on track`]);

C('XVI',[`高塔`,`突变・觉醒・重建`,`打破旧的，重建更好的。`,
`一道闪电打中高塔，砖块掉了下来，团子猫吓得张大嘴巴、双手举高。虽然突然，但旧的塔倒了，才能盖更好的。`,
`突然的变化打破了原来的计划，可能让你措手不及。但这些变化会让你看清真相，拆掉不稳的基础，重新建立更坚固的生活。`,
`变化正在酝酿，你可能感觉到了，却一直在逃避。主动面对，比被迫接受更轻松。`,
`关系受到冲击，隐藏的问题浮出水面。虽然难受，但这是认清彼此的机会。`,
`关系里的问题一直被压着，迟早要处理。早点沟通比较好。`,
`计划突然改变，可能是组织调整或项目取消。准备好应变方案。`,
`你察觉到工作有风险，但还没行动。提前准备会让你更安心。`,
`可能有意外支出。预留应急资金，避免高风险投资。`,
`财务隐患还没爆发，现在调整还来得及。`,
`准备一个 B 计划/遇到变化先深呼吸，再行动/想想这次变化能教会你什么`,
`主动处理一个你一直担心的问题/检查你的应急资金/提前和相关的人沟通`],
[`The Tower`,`Sudden change · Awakening · Rebuild`,`Rebuild stronger.`,
`Lightning strikes a tower and bricks fall. The mochi cat is shocked, paws up and mouth open. It's sudden, but when the old tower falls, a better one can be built.`,
`A sudden change breaks old plans and may surprise you. But it shows you the truth, clears away a weak base, and lets you build something stronger.`,
`Change is brewing. You may sense it but avoid it. Facing it yourself is easier than being forced.`,
`A shock in love brings hidden problems to the surface. It hurts, but it's a chance to see each other clearly.`,
`Problems are being held down and will need handling sooner or later. Talk earlier rather than later.`,
`Plans change suddenly, like a reorganization or a cancelled project. Have a backup ready.`,
`You sense risk at work but haven't acted. Preparing early will give you peace of mind.`,
`Unexpected expenses may come. Keep emergency savings and avoid high risk.`,
`A money problem hasn't blown up yet. You can still fix it now.`,
`Prepare a plan B/When change hits, breathe first, then act/Ask what this change can teach you`,
`Handle one problem you have been worried about/Check your emergency fund/Talk with the people involved early`]);

C('XVII',[`星星`,`希望・疗愈・灵感`,`保持希望。`,
`夜空中一颗大星星闪闪发光，团子猫开心地把水倒进小池塘，滋润身边的草地。`,
`风雨过后，希望和疗愈正在到来。你可以放心地相信未来，你的梦想值得被认真对待。保持乐观，好事会慢慢发生。`,
`暂时失去信心，觉得看不到希望。这只是暂时的，给自己一点温柔，光会再回来。`,
`温柔美好的感情，旧的伤口正在愈合。适合真诚地敞开心扉。`,
`对感情感到失望或不抱期待。先好好爱自己，好的感情会被你吸引过来。`,
`灵感涌现，适合规划长远目标和梦想项目。你的才华会被看见。`,
`对工作失去热情或方向。回想一下你最初的动力是什么。`,
`财务情况逐渐好转，可以开始为未来的梦想存钱。`,
`对财务感到焦虑。从一个小目标开始，慢慢重建信心。`,
`写下一个你的梦想/做一件滋养自己的事/帮助身边的人一次`,
`列出三件值得感恩的事/给自己一点休息/找回一件让你开心的小事`],
[`The Star`,`Hope · Healing · Inspiration`,`Keep hoping.`,
`A big star shines in the night sky. The mochi cat happily pours water into a little pond, nourishing the grass around it.`,
`After the storm, hope and healing are coming. You can trust the future; your dreams deserve to be taken seriously. Stay positive and good things will unfold.`,
`You have lost faith for now and can't see hope. It's only for now. Be gentle with yourself, and the light will return.`,
`Gentle, hopeful love. Old wounds are healing. A good time to open your heart.`,
`You feel let down by love. Love yourself first, and good love will come to you.`,
`Ideas flow. Great for planning long-term goals and dream projects. Your talent will be seen.`,
`You have lost passion or direction at work. Remember what first inspired you.`,
`Your finances are slowly improving. Start saving for a dream.`,
`You feel anxious about money. Start with one small goal to rebuild your confidence.`,
`Write down one dream/Do something that nourishes you/Help someone around you`,
`List three things you are grateful for/Give yourself some rest/Bring back one small joy`]);

C('XVIII',[`月亮`,`不安・幻想・潜意识`,`别让担心带着你走。`,
`大大的月亮在夜空中半眯着眼，团子猫抬头望着它，两边的小塔若隐若现。夜晚有点神秘，也有点看不清。`,
`事情还不明朗，你可能有些不安或胡思乱想。别让担心吓到自己，慢慢等待，真相会逐渐清楚。相信直觉，但也要确认事实。`,
`迷雾正在散去，误会和困惑渐渐解开。你会越来越清楚该怎么做。`,
`可能有误会、不安全感或说不清的感觉。多沟通，不要自己乱猜。`,
`误会解开，彼此更清楚对方的想法。`,
`信息还不完整，有些事情可能不像表面那样。先别做重大决定。`,
`真相逐渐浮现，方向越来越清楚。`,
`小心骗局和看不懂的投资。不懂的东西不要碰。`,
`之前不清楚的财务问题慢慢明朗，可以开始处理了。`,
`把担心写下来，分清事实和想象/不懂的事先问清楚/好好休息，留意你的梦`,
`趁现在把误会说清楚/整理思绪，定下下一步/相信越来越清晰的感觉`],
[`The Moon`,`Uncertainty · Illusion · Dreams`,`Don't let worry lead you.`,
`A big moon half-closes its eyes in the night sky. The mochi cat looks up at it, with two little towers fading into the dark. The night is mysterious and a bit unclear.`,
`Things are unclear, and you may feel uneasy or imagine the worst. Don't let fear fool you. Wait, and the truth will become clear. Trust your gut, but check the facts.`,
`The fog is lifting. Misunderstandings and confusion are clearing, and you will see what to do.`,
`There may be misunderstandings, insecurity, or mixed feelings. Talk more and don't guess.`,
`Misunderstandings clear up, and you understand each other better.`,
`Information is incomplete, and things may not be what they seem. Wait on big decisions.`,
`The truth is coming out and your direction is getting clearer.`,
`Beware of scams and investments you don't understand. Don't touch what you don't know.`,
`Unclear money issues are becoming clear, and you can start dealing with them.`,
`Write down your worries and separate facts from fears/Ask before you assume/Rest well and notice your dreams`,
`Clear up misunderstandings now/Sort your thoughts and plan the next step/Trust the clearer feeling`]);

C('XIX',[`太阳`,`快乐・成功・活力`,`尽情发光吧。`,
`团子猫在大太阳下张开双手大笑，周围开满向日葵。一切都闪闪发光、温暖明亮。`,
`一切都明亮起来！快乐、成功和好能量正在发生。你可以自信地做自己，好事会接连到来。这是塔罗中最好的牌之一。`,
`好事稍微延迟，或者你有点过于乐观而忽略了细节。整体仍然很正面，只是需要多一点耐心。`,
`感情幸福快乐，关系坦诚又阳光。很适合约会、表白，甚至更进一步。`,
`关系有一点小乌云，但不严重。多一点沟通和玩乐，阳光就会回来。`,
`你的努力被认可，成果显著。适合展示自己、争取机会。`,
`成功有点延迟，或者团队沟通不够。保持信心，继续努力。`,
`财运很好，收获满满，可以小小庆祝一下。`,
`财务还不错，但不要因为心情好就乱花钱。`,
`去晒晒太阳、动一动身体/大方分享你的好消息/自信地展示你的成果`,
`检查一下被你忽略的细节/放下一点期待，享受过程/和朋友一起做件开心的事`],
[`The Sun`,`Joy · Success · Vitality`,`Shine bright.`,
`The mochi cat laughs with open arms under a big sun, surrounded by sunflowers. Everything shines, warm and bright.`,
`Everything is bright. Joy, success, and good energy are here. Be yourself with confidence, and good things will keep coming. One of the best cards in tarot.`,
`Good things are a little delayed, or you are over-confident and missing details. Overall it's still positive; just be a little patient.`,
`Love is happy, open, and sunny. A great time for dates, confessions, or a bigger step.`,
`A small cloud over love, nothing serious. More talking and more fun will bring the sun back.`,
`Your work is recognized with great results. Show yourself and go for opportunities.`,
`Success is a little delayed, or team communication is weak. Stay confident and keep going.`,
`Money luck is strong, with rich rewards. Time for a small celebration.`,
`Your finances are fine, but don't overspend just because you feel good.`,
`Get some sun and move your body/Share your good news/Show your results with confidence`,
`Check the details you skipped/Let go of some expectations and enjoy the process/Do something fun with friends`]);

C('XX',[`审判`,`觉醒・重生・召唤`,`回应内心的声音。`,
`天上的云朵里吹响了号角，团子猫听到召唤，开心地举手醒来。这是重新出发的时刻。`,
`是时候回顾过去、整理经验，做出重要的决定。你听到了内心的召唤，准备好迎接一个全新的自己。`,
`你可能对自己太苛刻，一直被过去的错误困住；或者害怕回应内心的声音。原谅自己，才能往前走。`,
`旧的关系可能出现转机，或者你们重新认识彼此，关系升级。`,
`一直放不下过去的感情，或者对自己的感情选择太自责。`,
`新的使命出现，适合转型、升级或做出重要的职业决定。`,
`犹豫不决，错过了召唤。认真问自己真正想做的是什么。`,
`回顾财务状况并做出调整，会有明显的改善。`,
`总是重复同样的财务错误。找出原因，打破循环。`,
`回顾过去一年学到的事/做一个拖延已久的决定/行动起来，去做你一直想做的事`,
`写一封原谅自己的信/找出一个反复出现的问题/问问自己“我真正想要的是什么”`],
[`Judgement`,`Awakening · Rebirth · Calling`,`Answer your calling.`,
`A trumpet sounds from the clouds. The mochi cat hears the call and wakes up happily with its paws in the air. It's time to begin again.`,
`It's time to look back, learn from the past, and make an important decision. You hear your inner calling and are ready to meet a new you.`,
`You may be too hard on yourself and stuck on past mistakes, or afraid to answer your calling. Forgive yourself so you can move on.`,
`An old relationship may get a second chance, or you see each other in a new way and grow closer.`,
`You can't let go of a past love, or you blame yourself too much for your choices.`,
`A new calling appears. Good for a career change, a step up, or a big decision.`,
`Hesitation makes you miss your calling. Ask yourself what you truly want to do.`,
`Review your finances and adjust, and you will see clear improvement.`,
`You keep making the same money mistakes. Find the cause and break the cycle.`,
`Review what you learned this past year/Make a decision you have been putting off/Act on something you have always wanted to do`,
`Write a letter forgiving yourself/Find one problem that keeps repeating/Ask yourself "what do I truly want?"`]);

C('XXI',[`世界`,`完成・圆满・成就`,`庆祝成果，准备下一段旅程。`,
`团子猫在花环中间开心地跳舞，四个角落有星星闪耀，上下各有一颗爱心。一个完整的圆，代表圆满。`,
`一个阶段圆满完成，你收获了努力的成果，好好庆祝一下吧！这也是下一段旅程的起点，世界正向你敞开。`,
`还差最后一步，事情没有完全收尾。别在终点前放弃，把最后的部分完成。`,
`关系圆满稳定，彼此都很满足，可能迈向结婚或新的人生阶段。`,
`关系还有一些没解决的问题。把它们处理好，才能更进一步。`,
`目标达成，项目成功结束，可能迎来更大的舞台或国际机会。`,
`项目快完成了，却卡在最后阶段。再坚持一下。`,
`财务目标实现，状况理想，可以规划下一个目标。`,
`离财务目标还差一点，不要松懈。`,
`好好庆祝一个成就/感谢一路帮助你的人/写下你的下一个大目标`,
`列出还没完成的事/一件一件把它们收尾/先不要急着开始新的事`],
[`The World`,`Completion · Wholeness · Achievement`,`Celebrate, then start the next journey.`,
`The mochi cat dances happily inside a wreath, with stars in each corner and hearts above and below. A full circle means completion.`,
`A chapter is complete and you have earned the rewards. Celebrate! This is also the start of your next journey, and the world is open to you.`,
`One last step remains and things aren't fully finished. Don't quit before the finish line; complete the last part.`,
`Love is complete and stable, and you are both happy. Marriage or a new life stage may come.`,
`Some issues are still unsolved. Resolve them to move forward.`,
`Goals reached and projects completed. A bigger stage or a global chance may open.`,
`A project is almost done but stuck at the end. Hold on a little longer.`,
`Your money goals are reached. Time to plan the next one.`,
`You are close to your money goal. Don't relax yet.`,
`Celebrate one achievement/Thank the people who helped you/Write down your next big goal`,
`List what isn't finished yet/Wrap them up one by one/Don't rush into something new`]);

// Wands (权杖)
C('Ace',[`权杖王牌`,`灵感・热情・新开始`,`点燃你的火花吧。`,
`团子猫骄傲地举起一根冒出新叶、闪着小火花的大权杖，旁边飘着一朵云。这代表一份刚刚被点燃的灵感和热情。`,
`一个新的想法或机会出现了，你心里充满干劲。现在是开始的好时机，把这份热情变成第一步行动吧。`,
`灵感好像卡住了，或者你有想法却迟迟没有动手。别着急，先休息一下，找回让你心动的理由。`,
`感情里出现新的火花，可能是新的心动，也可能是旧关系重新升温。大胆表达你的喜欢吧。`,
`热情有点降温，或者两个人节奏不一样。慢一点，先弄清楚自己真正想要什么。`,
`新项目、新点子正在出现，很适合主动提案或尝试新方向。你的创意会被看见。`,
`想做的事情一直没有开始，或者计划太多太散。先挑一件最想做的，小步启动。`,
`可能出现新的赚钱想法或机会，值得认真研究一下。`,
`赚钱的点子还不成熟，先别急着投入太多，多做一点准备。`,
`把脑中的新想法写下来/今天就迈出一个小步骤/做一件让你兴奋的事`,
`休息一下，给灵感一点空间/回想当初让你心动的原因/只挑一个计划先开始`],
[`Ace of Wands`,`Inspiration · Passion · New start`,`Light your spark.`,
`The mochi cat proudly holds up one big sprouting wand that glows with little sparkles, and a cloud floats nearby. It stands for a new idea and a passion that has just been lit.`,
`A new idea or chance has appeared, and you feel full of energy. This is a good time to begin. Turn this passion into your first step.`,
`Your inspiration feels stuck, or you have ideas but have not started. Don't rush. Rest a little and remember what excites you.`,
`A new spark in love. It may be a new crush, or an old relationship warming up again. Show your feelings bravely.`,
`The passion has cooled a little, or you two move at different speeds. Slow down and find out what you really want.`,
`New projects and ideas are coming. It is a good time to share a plan or try a new direction. Your creativity will be noticed.`,
`You keep putting off what you want to do, or you have too many plans. Pick the one you want most and start small.`,
`A new way to earn money may appear. It is worth looking into.`,
`Your money idea is not ready yet. Don't put in too much too soon. Prepare a bit more.`,
`Write down your new idea/Take one small step today/Do something that excites you`,
`Rest and give your ideas space/Remember why you felt excited/Start with just one plan`]);

C('2',[`权杖二`,`规划・选择・远见`,`看远一点再出发。`,
`团子猫手里捧着一个小地球仪，望向远方，两边各插着一根权杖。这代表站在起点，规划未来、准备迈向更大的世界。`,
`你已经有了基础，现在在想下一步要去哪里。这是做计划、看清方向的时候，你的世界可以比现在更大。`,
`你可能有点害怕走出舒适圈，或者一直计划却没有行动。试着做一个小决定，让事情动起来。`,
`你在思考这段关系的未来，或者在两个选择之间犹豫。诚实地问问自己想要怎样的生活。`,
`对未来想法不同，或者一直停在原地。坐下来聊聊彼此的长远打算吧。`,
`适合制定长期计划，考虑新市场、新方向或进修。你已经准备好看得更远。`,
`计划很多但不敢执行，或者方向还不清楚。先确定一个目标，再一步步来。`,
`适合做长期的理财规划，想清楚钱要用在哪里。`,
`对花钱或投资有些犹豫，可以先多了解，或请教专业的人。`,
`写下一年后想达成的目标/研究一个你感兴趣的新方向/列出两个选择的优缺点`,
`为一个小决定定下期限/走出舒适圈做一件新事/找朋友聊聊你的犹豫`],
[`Two of Wands`,`Planning · Choice · Vision`,`Look far, then go.`,
`The mochi cat holds a small globe and looks into the distance, with one wand planted on each side. It shows standing at the start, planning the future and getting ready for a bigger world.`,
`You have a good base, and now you are thinking about where to go next. It is time to make plans and see your direction. Your world can be bigger than it is now.`,
`You may be afraid to leave your comfort zone, or you keep planning without acting. Make one small decision and get things moving.`,
`You are thinking about the future of this relationship, or you feel torn between two choices. Ask yourself honestly what life you want.`,
`You see the future differently, or things feel stuck. Sit down and talk about your long-term plans.`,
`A good time for long-term plans. Think about new markets, new directions, or more study. You are ready to look further.`,
`You have many plans but are afraid to act, or the direction is unclear. Choose one goal first, then go step by step.`,
`A good time for long-term money planning. Decide where your money should go.`,
`You feel unsure about spending or investing. Learn more first, or ask a professional.`,
`Write your goal for one year from now/Research a new direction you like/List pros and cons of two choices`,
`Set a deadline for one small decision/Try one new thing outside your comfort zone/Talk to a friend about your doubts`]);

C('3',[`权杖三`,`拓展・期待・前进`,`你的船正在启航。`,
`团子猫站在小山坡上眺望大海，海上有几艘小帆船，身边插着三根权杖。这代表努力已经出发，好消息正在路上。`,
`你的计划已经开始推进，成果正在慢慢靠近。继续保持眼光放远，更多机会会从远方到来。`,
`进展比预期慢，或者有些事情没有按计划走。别灰心，调整一下方向，船还是会到港的。`,
`关系在向前发展，可能会一起计划旅行或未来。远距离的感情也有好的进展。`,
`对方的回应比你期待的慢，或者你们的步调不一致。多一点耐心，也多一点沟通。`,
`事业正在扩张，适合和外地或海外的人合作。你的努力开始看到回报。`,
`项目有些延误，或者合作不太顺利。检查一下计划，及时调整就好。`,
`之前的投入开始有回报，财务慢慢向好。`,
`回报来得比预期慢，先保持耐心，不要急着加码。`,
`联系一位外地的朋友或伙伴/看看你计划的进度/为下一个目标做准备`,
`重新检查计划里的时间表/放下一个不太现实的期待/耐心等等，不急着催结果`],
[`Three of Wands`,`Growth · Hope · Moving forward`,`Your ships are sailing.`,
`The mochi cat stands on a hill and looks out at the sea with little sailboats, with three wands planted around it. It means your efforts are on their way, and good news is coming.`,
`Your plan is already moving, and results are slowly coming closer. Keep looking far ahead. More chances will come from far away.`,
`Progress is slower than you hoped, or something did not go as planned. Don't lose heart. Adjust your direction and your ship will still arrive.`,
`The relationship is moving forward. You may plan a trip or a future together. Long-distance love also goes well.`,
`The other person answers more slowly than you hoped, or your speeds are different. Be a little more patient and talk more.`,
`Your work is growing. A good time to work with people from other cities or countries. Your efforts start to pay off.`,
`A project is a little delayed, or teamwork is not smooth. Check your plan and adjust in time.`,
`Past efforts start to bring returns. Your money slowly gets better.`,
`Returns are slower than expected. Be patient and don't rush to add more.`,
`Contact a friend or partner far away/Check how your plan is going/Get ready for your next goal`,
`Review the timeline in your plan/Let go of one unrealistic hope/Wait patiently and don't push for results`]);

C('4',[`权杖四`,`庆祝・和谐・归属`,`好好庆祝一下吧。`,
`两只团子猫在挂着花环的四根权杖下欢呼，像一扇快乐的大门。这代表值得庆祝的成果，以及温暖的家和归属感。`,
`一个阶段顺利完成，是时候庆祝了。家庭、朋友和团队都很和谐，你感到安心又快乐。`,
`庆祝的感觉少了一点，或者家里、团队里有些小摩擦。这只是暂时的，主动表达一点关心，温暖就会回来。`,
`感情稳定又甜蜜，可能会见家人、同居、订婚或一起庆祝重要时刻。`,
`关系里有一点小不安，或者和对方家人相处有压力。多一点体谅，慢慢磨合。`,
`项目顺利完成，团队气氛很好。适合庆祝成果，也为下一步打好基础。`,
`团队配合有点不顺，或者成果还没被认可。先把小成绩记下来，继续往前。`,
`财务稳定，可以为家或重要的时刻花点钱，感觉很值得。`,
`庆祝或家里的开销有点多，事先做好预算会更安心。`,
`和家人或朋友一起吃顿饭/为最近的小成就庆祝一下/把家里布置得温馨一点`,
`主动关心一位家人或同事/化解一个小小的误会/给自己一个安静放松的晚上`],
[`Four of Wands`,`Celebration · Harmony · Belonging`,`Time to celebrate.`,
`Two mochi cats cheer under a flower garland hung between four wands, like a happy gate. It stands for a result worth celebrating, and a warm sense of home and belonging.`,
`One stage is done well, and it is time to celebrate. Family, friends, and team feel close. You feel safe and happy.`,
`The happy feeling is a little weaker, or there is small tension at home or at work. This will pass. Show some care and the warmth will come back.`,
`Love is stable and sweet. You may meet the family, move in together, get engaged, or celebrate a big moment.`,
`There is a little worry in the relationship, or stress with the other family. Be kind and give it time.`,
`A project ends well, and the team feels great. Celebrate the result and build a base for the next step.`,
`Teamwork is not smooth, or your results are not yet noticed. Write down your small wins and keep going.`,
`Money is stable. Spending a little on your home or a special moment feels worth it.`,
`Costs for parties or the home are a bit high. A budget will help you feel calm.`,
`Have a meal with family or friends/Celebrate a recent small win/Make your home a little cozier`,
`Check in on a family member or coworker/Clear up a small misunderstanding/Give yourself a quiet relaxing evening`]);

C('5',[`权杖五`,`竞争・摩擦・切磋`,`把较劲变成成长。`,
`两只团子猫开玩笑似地用权杖互相比划，五根权杖在空中交叉。这代表意见不同和小小的竞争，更像一场切磋而不是打架。`,
`身边有些竞争或意见冲突，大家都想表达自己。把它当成练习和切磋，你会变得更强。`,
`你可能在逃避冲突，或者争吵已经慢慢平息。找一个平和的方式把话说开，事情就会轻松很多。`,
`两个人有些小争执，或者有其他人也在竞争对方的注意。别把小事变大，好好沟通。`,
`你可能为了避免吵架而把话憋在心里。温柔但诚实地说出你的感受吧。`,
`工作中竞争激烈，或者团队意见很多。保持风度，用实力说话。`,
`内耗太多，大家各说各的。试着找出共同目标，让团队重新合作。`,
`赚钱的路上有竞争，需要多花一点心思，也别为了抢机会乱花钱。`,
`和别人在钱的问题上有小摩擦，把账算清楚就好。`,
`用平和的语气表达你的观点/把竞争对手当成学习对象/做一项让你出汗的运动`,
`和一个有矛盾的人好好聊聊/写下大家共同的目标/放下一个不值得争的小事`],
[`Five of Wands`,`Competition · Conflict · Practice`,`Turn rivalry into growth.`,
`Two mochi cats playfully cross wands in a friendly scuffle, with five wands crossing in the air. It stands for different opinions and small competition, more like practice than a real fight.`,
`There is some competition or disagreement around you. Everyone wants to be heard. See it as practice, and you will grow stronger.`,
`You may be avoiding conflict, or the fighting is calming down. Find a peaceful way to talk it out, and things will feel much lighter.`,
`There are small arguments, or someone else wants the same person's attention. Don't make small things big. Talk it through.`,
`You may hold your words inside to avoid a fight. Share your feelings gently and honestly.`,
`Competition at work is strong, or the team has many opinions. Stay kind and let your skills speak.`,
`Too much inner conflict, and everyone talks past each other. Find a shared goal so the team can work together again.`,
`There is competition on the way to money. Put in more thought, and don't overspend to win a chance.`,
`Small money tension with someone. Make the numbers clear and it will be fine.`,
`Share your view in a calm voice/Learn something from a rival/Do a sport that makes you sweat`,
`Have a calm talk with someone you clash with/Write down the team's shared goal/Let go of one small fight`]);

C('6',[`权杖六`,`胜利・认可・自信`,`抬起头，享受掌声。`,
`团子猫戴着绿色的桂冠，高举权杖庆祝胜利，身后的五根权杖像欢呼的人群。这代表努力被看见，获得认可和成功。`,
`你的努力有了成果，身边的人都在为你鼓掌。大方接受赞美，你值得这份自信和荣耀。`,
`你可能觉得自己的付出没有被看见，或者太在意别人的评价。成功不只靠掌声，先肯定你自己。`,
`感情里你感到被欣赏、被骄傲地介绍给别人。两个人一起变得更自信。`,
`你可能太在意别人怎么看这段关系。专注在你们两个人真正的感受上。`,
`有机会升职、得奖或被公开表扬。适合展示成果，带领团队。`,
`成果暂时没被认可，或者功劳被别人拿走。冷静记录你的贡献，适时说出来。`,
`努力带来了回报，可能有奖金或好消息。`,
`别为了面子花太多钱，真正的成功不需要靠消费证明。`,
`大方地分享你的成果/对帮助过你的人说谢谢/接受一句赞美，只说谢谢`,
`写下三件你为自己骄傲的事/少看一点别人的评价/把你的贡献整理成清单`],
[`Six of Wands`,`Victory · Recognition · Confidence`,`Lift your head and shine.`,
`The mochi cat wears a green laurel wreath and raises its wand in victory, with five wands behind like a cheering crowd. It means your hard work is seen, and you earn praise and success.`,
`Your hard work has paid off, and people around you are cheering. Accept the praise. You deserve this confidence and pride.`,
`You may feel your effort is not seen, or you care too much about what others think. Success is not only about applause. Praise yourself first.`,
`In love, you feel valued and proudly shown to others. You both grow more confident together.`,
`You may care too much about how others see this relationship. Focus on what you two really feel.`,
`A chance for a promotion, an award, or public praise. A good time to show your results and lead the team.`,
`Your results are not yet noticed, or someone else takes the credit. Calmly keep a record of your work and speak up at the right time.`,
`Your effort brings rewards. There may be a bonus or good news.`,
`Don't spend too much just to look good. Real success doesn't need shopping to prove it.`,
`Share your results openly/Thank someone who helped you/Accept a compliment with just thank you`,
`Write three things you are proud of/Spend less time on others' opinions/Make a list of your contributions`]);

C('7',[`权杖七`,`坚守・勇气・立场`,`站稳你的位置。`,
`团子猫站在小山丘顶上，紧紧握着权杖，下面有六根权杖往上指。这代表面对压力和挑战，依然勇敢守住自己的立场。`,
`你站在一个好位置，但也面对来自各方的压力。相信自己，坚持你认为对的事，你比想象中更有力量。`,
`你可能有点累了，或者开始怀疑自己。不必每场仗都打，选出最重要的去守护就好。`,
`你需要为这段关系或自己的需要站出来。温柔但坚定地说出你的底线。`,
`一直防备会让人很累。试着放下戒心，看看对方是不是其实站在你这边。`,
`工作中有竞争或质疑，但你有实力。坚持你的专业判断，用结果说话。`,
`压力太大让你想放弃，或者你在小事上耗太多力气。分清轻重，保存能量。`,
`守好你的钱，不要因为别人的压力就答应借钱或消费。`,
`财务压力让你很紧绷，先稳住基本开销，一步一步来。`,
`为一件重要的事说出你的立场/练习礼貌地说「不」/列出你最想守护的三件事`,
`放下一场不重要的争论/找一个支持你的人聊聊/今天早点休息，补充体力`],
[`Seven of Wands`,`Standing firm · Courage · Your ground`,`Hold your ground.`,
`The mochi cat stands on top of a small hill, holding its wand firmly, while six wands point up from below. It means facing pressure and challenges, and still bravely standing up for yourself.`,
`You are in a good place, but you feel pressure from many sides. Believe in yourself and stand by what you think is right. You are stronger than you think.`,
`You may feel tired, or you start to doubt yourself. You don't need to fight every battle. Protect only what matters most.`,
`You need to stand up for this relationship or for your own needs. Share your limits gently but clearly.`,
`Always being on guard is tiring. Try to relax a little and see if the other person is really on your side.`,
`There is competition or doubt at work, but you have real skills. Trust your judgment and let results speak.`,
`Too much pressure makes you want to quit, or you spend too much energy on small things. Know what matters and save your energy.`,
`Protect your money. Don't lend or spend just because others push you.`,
`Money stress makes you tense. Cover the basic costs first and take it step by step.`,
`Speak up about one thing that matters/Practice saying no politely/List three things you want to protect`,
`Drop one argument that does not matter/Talk with someone who supports you/Go to bed early and rest`]);

C('8',[`权杖八`,`迅速・消息・行动`,`顺着速度前进。`,
`八根权杖朝同一个方向在天空中飞快掠过，团子猫兴奋地抬头看。这代表事情快速推进，好消息和变化很快就会到来。`,
`事情开始加速，消息和机会接连到来。趁着这股动力，快速行动，你会走得很远。`,
`事情突然变慢，或者太匆忙出了小差错。别慌，放慢一下，把方向调整好再出发。`,
`感情进展很快，可能会突然收到消息或心动的回应。也可能有一趟说走就走的旅行。`,
`消息迟迟不来，或者节奏太快让你有点不安。给彼此一点时间和空间。`,
`项目快速推进，邮件和消息很多。抓紧时间，及时回复，效率会很高。`,
`进度卡住或计划被打乱。先处理最急的事，其他的慢慢来。`,
`钱的流动变快，可能有快速的收入，也要留意支出。`,
`付款或收入有些延迟，冲动消费也要小心。先等等再做决定。`,
`今天回复一封搁置的消息/马上完成一件拖延的小事/计划一趟短途出行`,
`把待办事项排好优先顺序/做决定前先等一晚/检查一遍刚完成的工作`],
[`Eight of Wands`,`Speed · News · Action`,`Move with the speed.`,
`Eight wands fly fast across the sky in the same direction, and the mochi cat looks up excitedly. It means things are moving quickly, and good news and change are coming soon.`,
`Things are speeding up. News and chances arrive one after another. Use this energy, act fast, and you will go far.`,
`Things suddenly slow down, or rushing causes small mistakes. Don't panic. Slow down, fix your direction, then go again.`,
`Love moves fast. You may suddenly get a message or a sweet reply. A quick, fun trip is also possible.`,
`The message you wait for is slow, or the fast pace makes you uneasy. Give each other some time and space.`,
`Projects move fast, with many emails and messages. Stay on top of things and reply quickly. You will get a lot done.`,
`Progress is stuck, or plans are changed. Handle the most urgent thing first and take the rest slowly.`,
`Money moves faster. Quick income may come, but watch your spending too.`,
`A payment or income is delayed. Be careful with quick buys. Wait before you decide.`,
`Reply to one message you put off/Finish one small task right now/Plan a short trip`,
`Put your to-do list in order/Sleep on it before deciding/Check the work you just finished`]);

C('9',[`权杖九`,`坚持・韧性・最后一步`,`再坚持一下下。`,
`团子猫头上贴着一块小绷带，却依然紧紧握着权杖，站在八根权杖围成的篱笆前。这代表经历过考验，依然有力量坚持到最后。`,
`你已经走了很长的路，也许有点累，但你还站着。终点就在前面，再坚持一下，你一定可以。`,
`你可能太累了，或者一直处在防备状态。坚持很好，但也要允许自己休息，接受别人的帮助。`,
`过去的经历让你在感情里有些小心。慢慢来，给信任一点时间，好的关系值得等待。`,
`防备心太重会把爱挡在门外。试着说出你的担心，让对方有机会靠近你。`,
`工作很辛苦，但你快要突破了。守住你的成果，最后一段路最重要。`,
`你感到疲惫，甚至想放弃。先休息、调整节奏，也可以向同事或上司求助。`,
`财务上有些压力，但你守得住。继续保持节省和谨慎。`,
`长期的钱压力让你很累，可以找专业的人一起做个计划。`,
`列出你已经走过的进步/今天再完成一小步/给自己准备一份小奖励`,
`好好睡一觉，补充能量/向一个信任的人寻求帮助/放下一个不必要的担心`],
[`Nine of Wands`,`Persistence · Resilience · Last stretch`,`Hold on a little longer.`,
`The mochi cat has a small bandage on its head but holds its wand firmly, standing in front of a fence of eight wands. It means you have been through tests and still have the strength to finish.`,
`You have come a long way. You may feel tired, but you are still standing. The finish line is close. Hold on a little longer and you can do it.`,
`You may be too tired, or always on guard. Being strong is good, but let yourself rest and accept help.`,
`Past experiences make you careful in love. Take it slow and give trust some time. A good relationship is worth the wait.`,
`Too much guarding can keep love out. Share your worries and let the other person come closer.`,
`Work is hard, but you are close to a breakthrough. Protect what you have built. The last part matters most.`,
`You feel worn out and may want to give up. Rest, change your pace, and ask coworkers or your boss for help.`,
`There is some money pressure, but you can handle it. Keep saving and stay careful.`,
`Long money stress makes you tired. Make a plan with a professional.`,
`List the progress you have made/Take one more small step today/Plan a small reward for yourself`,
`Get a good night of sleep/Ask someone you trust for help/Let go of one needless worry`]);

C('10',[`权杖十`,`重担・责任・放下`,`试着放下一些。`,
`团子猫抱着一大捆十根权杖，眼睛困困的，还流着一滴小汗。这代表扛了太多责任，提醒你该减轻负担了。`,
`你一个人扛了太多事情，虽然很努力，但已经很累了。终点不远，但也想想哪些事可以分出去。`,
`你开始意识到自己背得太重，准备放下一些了。这是好事，学会说「不」和交给别人吧。`,
`你可能在感情里付出太多，或者把所有压力都自己扛。说出你的需要，让对方一起分担。`,
`关系变得像一份负担。坐下来聊聊，重新分配彼此的责任。`,
`工作量很大，责任很多。列出优先顺序，能委托的就交给别人。`,
`你准备放下一些不属于你的工作了。和团队沟通，调整分工。`,
`开销和财务责任有点重，整理一下哪些支出可以减少。`,
`你开始减轻财务负担，这是很好的开始，继续简化。`,
`列出手上所有的任务/把一件事交给别人帮忙/今天早点下班休息`,
`练习拒绝一个额外的请求/删掉清单上一件不必要的事/告诉别人你需要帮忙`],
[`Ten of Wands`,`Burden · Responsibility · Letting go`,`Try to put some down.`,
`The mochi cat carries a heavy bundle of ten wands, with sleepy, tired eyes and a little sweat drop. It means you are carrying too much, and it is time to lighten the load.`,
`You carry too many things on your own. You work hard, but you are very tired. The end is near, but think about what you can hand to others.`,
`You start to see that you carry too much, and you are ready to put some down. This is good. Learn to say no and to share the work.`,
`You may give too much in love, or hold all the stress alone. Share what you need and let your partner help.`,
`The relationship feels like a heavy load. Sit down together and share the tasks again.`,
`Your workload is big, with many duties. Set priorities and hand off what you can.`,
`You are ready to drop tasks that are not yours. Talk with your team and change who does what.`,
`Costs and money duties feel heavy. Look at which costs you can cut.`,
`You are starting to lighten your money load. A great start. Keep making it simpler.`,
`List all the tasks you carry/Ask someone to help with one task/Leave work early and rest today`,
`Say no to one extra request/Remove one needless task from your list/Tell someone you need help`]);

C('Page',[`权杖侍从`,`好奇・探索・热情`,`保持好奇心。`,
`戴着小红贝雷帽、背着小挎包的团子猫，好奇地抬头看着正在发芽的权杖。这代表一颗充满好奇、想要探索新事物的心。`,
`你对新事物充满好奇和热情，很想试一试。不用等到完美，像小探险家一样，先出发再说。`,
`热情来得快去得也快，或者想法很多却没有坚持。选一件最喜欢的事，认真做下去。`,
`感情里有新鲜、可爱的心动，可能会收到一条让你开心的消息。用轻松好玩的方式相处吧。`,
`热度三分钟，或者有点孩子气。多一点耐心和真心，感情才能长久。`,
`适合学习新技能、尝试新角色或接受新挑战。你的热情会让人印象深刻。`,
`点子很多但执行力不够。把大目标拆成小任务，一项一项完成。`,
`可能出现新的小收入机会，值得试试，但先从小处开始。`,
`对新东西一时冲动想买，先放进购物车等一等。`,
`报名一个你感兴趣的课程/去一个从没去过的地方/问一个你好奇很久的问题`,
`把一个想法坚持做一周/完成一件开了头的事/想买的东西先等三天`],
[`Page of Wands`,`Curiosity · Exploring · Enthusiasm`,`Stay curious.`,
`The mochi cat, in a little red beret with a satchel, looks up curiously at its sprouting wand. It stands for a curious heart that wants to explore new things.`,
`You feel curious and excited about new things, and you want to try. Don't wait for perfect. Be a little explorer and just start.`,
`Your passion comes and goes fast, or you have many ideas but don't stick with them. Pick the one you love most and keep at it.`,
`Love feels fresh and cute. You may get a message that makes you smile. Keep things light and fun.`,
`The excitement fades fast, or someone acts a bit childish. More patience and honesty will help love last.`,
`A good time to learn a new skill, try a new role, or take on a new challenge. Your energy will impress people.`,
`Lots of ideas but not enough action. Break big goals into small tasks and finish them one by one.`,
`A small new way to earn may appear. Give it a try, but start small.`,
`You want to buy something new on impulse. Leave it in the cart and wait.`,
`Sign up for a class you like/Visit a place you have never been/Ask a question you have wondered about`,
`Stick with one idea for a week/Finish one thing you already started/Wait three days before buying`]);

C('Knight',[`权杖骑士`,`冲劲・冒险・行动力`,`勇敢冲吧，但看路。`,
`团子猫骑着木马全速前进，权杖直直地向前举着。这代表满满的冲劲和行动力，想要立刻出发去冒险。`,
`你充满能量，想马上行动、去冒险。这股热情能带你走得很远，只要记得偶尔停下来看看方向。`,
`冲得太快容易冲动、半途而废，或者事情一再被拖延。先深呼吸，想清楚再出发。`,
`感情热烈又刺激，可能会有一段让你心跳加速的关系。享受激情，也要看看对方是否认真。`,
`关系来得快去得也快，或者对方不太稳定。别急着投入全部，先多了解彼此。`,
`适合主动出击、开拓新业务、出差或换跑道。你的行动力是最大的优势。`,
`做事太急躁，或者开始了很多却没完成。放慢一点，把手上的事先做好。`,
`可能有快速赚钱的机会，但也容易冲动花钱。`,
`冲动消费或冒险的决定会带来压力，花钱前多想一想。`,
`马上开始一件你想做很久的事/主动联系一个新机会/去做一次小小的冒险`,
`行动前先写下计划/完成一件之前半途而废的事/大笔花钱前等一天`],
[`Knight of Wands`,`Drive · Adventure · Action`,`Charge ahead, but watch the road.`,
`The mochi cat rides a wooden rocking horse at full speed, holding its wand forward. It stands for strong drive and energy, ready to rush off on an adventure.`,
`You are full of energy and want to act and explore right now. This passion can take you far. Just remember to stop sometimes and check your direction.`,
`Going too fast can make you rash, or make you quit halfway. Things may also keep getting delayed. Take a deep breath and think before you go.`,
`Love is hot and exciting. A relationship may make your heart race. Enjoy the passion, but see if the other person is serious.`,
`Love comes fast and goes fast, or the other person is not steady. Don't give everything yet. Get to know each other more.`,
`A good time to take the lead, open new business, travel for work, or change paths. Your action is your biggest strength.`,
`You act too fast, or you start many things and finish few. Slow down and finish what you have first.`,
`A chance for quick money may appear, but quick spending is also easy.`,
`Impulse buys or risky choices may bring stress. Think twice before you spend.`,
`Start something you have wanted for long/Reach out to a new opportunity/Go on a small adventure`,
`Write a plan before you act/Finish something you left halfway/Wait a day before a big purchase`]);

C('Queen',[`权杖王后`,`自信・温暖・魅力`,`自信地做自己。`,
`团子猫戴着王冠，手握权杖，身旁开着一朵向日葵，脚边还有一只小黑猫。这代表温暖的自信、迷人的魅力，以及相信自己的直觉。`,
`你充满自信和温暖，身边的人都被你的光芒吸引。大方展现你自己，你可以同时照顾好生活和梦想。`,
`你可能有点失去自信，或者因为太忙而忽略了自己。先把能量留给自己，重新找回你的光芒。`,
`你很有魅力，感情温暖又热情。用你的真诚和自信去吸引对的人。`,
`你可能有点没安全感或嫉妒。先好好爱自己，感情自然会更稳定。`,
`你在工作中自信、能干，又能带动大家。适合领导、展示和社交。`,
`压力让你变得急躁，或者太想控制一切。放松一点，相信团队。`,
`财务独立又稳定，你很懂得照顾自己和身边的人。`,
`别为了照顾别人而忽略自己的钱，留一些给自己。`,
`穿上让你自信的衣服出门/主动和一个新朋友打招呼/做一件只为自己开心的事`,
`写下三个你喜欢自己的地方/今天留一段时间给自己/把一件事放心交给别人`],
[`Queen of Wands`,`Confidence · Warmth · Charm`,`Be yourself with confidence.`,
`The mochi cat wears a crown and holds a wand, with a sunflower beside it and a tiny black kitten at its feet. It stands for warm confidence, charm, and trusting your intuition.`,
`You are confident and warm, and people are drawn to your light. Show yourself openly. You can take care of both your life and your dreams.`,
`You may have lost some confidence, or you are too busy to care for yourself. Save some energy for you and find your light again.`,
`You are full of charm, and love feels warm and passionate. Use your honesty and confidence to attract the right person.`,
`You may feel a little unsure or jealous. Love yourself first, and the relationship will feel more stable.`,
`At work you are confident, capable, and you lift others up. A good time to lead, present, and connect with people.`,
`Stress makes you impatient, or you want to control everything. Relax a little and trust your team.`,
`You are independent and stable with money. You know how to care for yourself and others.`,
`Don't forget your own money while caring for others. Keep some for yourself.`,
`Wear clothes that make you feel confident/Say hi to someone new/Do one thing just for your joy`,
`Write three things you like about yourself/Save some time today for yourself/Trust someone else with one task`]);

C('King',[`权杖国王`,`领导・远见・魄力`,`带着热情去领导。`,
`团子猫戴着王冠，坐在温暖的橙色王座前，自信地握着一根高高的权杖。这代表有远见、有魄力的领导者，能把热情变成行动。`,
`你有清楚的愿景，也有带领别人的能力。相信你的判断，勇敢做决定，大家会愿意跟着你。`,
`你可能太急躁、太强势，或者期待太高。放慢一点，多听听别人的意见，领导会更有力量。`,
`你在感情里成熟、可靠，又很有热情。适合主动规划两个人的未来。`,
`太想主导关系会让对方有压力。多一点倾听，给彼此平等的空间。`,
`你适合当领导、带项目或创业。用你的远见和行动力去带动团队。`,
`太专断或太着急会让团队跟不上。分享你的想法，也让别人参与决定。`,
`你能为财务做出明智的大方向决定，适合做长期规划。`,
`别因为自信过头而做冒险的决定，大事先听听专业意见。`,
`写下你一年的大目标/主动带领一个小项目/鼓励一位团队里的伙伴`,
`决定前先听完别人的意见/降低一个过高的期待/把一项权力交给团队成员`],
[`King of Wands`,`Leadership · Vision · Boldness`,`Lead with passion.`,
`The mochi cat wears a crown and sits in front of a warm orange throne, holding a tall wand with confidence. It stands for a bold leader with vision, who turns passion into action.`,
`You have a clear vision and the power to lead others. Trust your judgment and make brave choices. People will want to follow you.`,
`You may be too pushy, too strong, or expect too much. Slow down and listen to others. Your leadership will grow stronger.`,
`In love you are mature, reliable, and full of passion. A good time to take the lead in planning your future together.`,
`Wanting to control the relationship can put pressure on your partner. Listen more and give each other equal space.`,
`You are ready to lead, run a project, or start a business. Use your vision and action to move the team.`,
`Being too bossy or too rushed can leave the team behind. Share your ideas and let others help decide.`,
`You can make wise big-picture money choices. A good time for long-term planning.`,
`Don't let too much confidence lead to risky choices. Ask a professional before big moves.`,
`Write down your big goal for this year/Lead a small project yourself/Encourage one person on your team`,
`Hear others out before deciding/Lower one expectation that is too high/Give one task fully to a teammate`]);

// Ace of Cups
C('Ace',[`圣杯王牌`,`爱・情感・新开始`,`敞开心，让爱流进来。`,
`团子猫开心地抱着一只大大的金杯，杯里闪亮的水像喷泉一样涌出来，上方飘着小爱心。这象征满满的爱和全新的情感开始。`,
`你的心正在被爱和温柔填满。这可能是一段新感情、一份新友谊，或是对自己更多的疼爱。敞开心，好好感受这份美好。`,
`你的心暂时有点关起来，或者情绪没有好好表达。先照顾好自己的感受，爱会慢慢重新流动。`,
`新恋情可能开始，或者现在的关系变得更甜。很适合表达心意、真诚交流。`,
`你可能把感情藏在心里，或者害怕受伤。先学着爱自己，再慢慢打开心门。`,
`你对工作有新的热情，适合做让你开心、有意义的项目。和同事的关系也会更融洽。`,
`工作让你提不起劲，心有点累。想一想什么能让你重新找到热爱。`,
`财务上有温暖的小惊喜，比如礼物或别人的帮助。适合把钱花在让你真正开心的事上。`,
`可能因为情绪而乱花钱。花钱前先问问自己，是不是真的需要。`,
`对重要的人说一句真心话/给自己安排一段放松时光/写下三件让你感恩的事`,
`静下来写写日记，整理心情/对自己温柔一点，不要自责/找信任的朋友聊聊心事`],
[`Ace of Cups`,`Love · Emotion · New start`,`Open your heart to love.`,
`The mochi cat happily hugs a big golden cup. Sparkling water flows out like a fountain, and little hearts float above. It stands for full love and a new emotional start.`,
`Your heart is filling with love and kindness. This could be a new relationship, a new friendship, or more love for yourself. Open your heart and enjoy it.`,
`Your heart feels a little closed right now, or you are holding back your feelings. Take care of your emotions first, and love will flow again.`,
`New love may begin, or your relationship grows sweeter. A good time to share your feelings honestly.`,
`You may be hiding your feelings or afraid of getting hurt. Learn to love yourself first, then slowly open up.`,
`You feel new passion for your work. Choose projects that feel happy and meaningful. Team relationships also get warmer.`,
`Work feels empty and your heart is tired. Think about what could bring back your love for it.`,
`A warm little surprise may come, like a gift or help from someone. Spend money on things that truly make you happy.`,
`You may spend money because of your mood. Before you buy, ask yourself if you really need it.`,
`Say one honest kind word to someone/Plan some quiet time to relax/Write down three things you are grateful for`,
`Write in a journal to sort your feelings/Be gentle with yourself today/Talk to a friend you trust`]);

// Two of Cups
C('2',[`圣杯二`,`连结・伙伴・互相吸引`,`用真心换真心。`,
`两只团子猫面对面，互相递上一只杯子，中间飘着一颗大爱心。这象征彼此心意相通、平等的连结。`,
`你和某个人之间有很美好的连结。无论是爱情、友情还是合作，双方都愿意付出、互相尊重。这是一张很温暖的伙伴牌。`,
`关系里出现一点不平衡或小误会。也许有一方付出太多，或沟通不够。坦诚聊一聊，就能重新找回默契。`,
`你们彼此吸引、心意相通。很适合约会、表白，或让关系更进一步。`,
`两人之间有点距离或小摩擦。放下面子，主动说出你的感受。`,
`适合找伙伴合作，双方能互相支持、一起成长。和同事的默契也会更好。`,
`合作中可能有分工不清或意见不合。把期待说清楚，重新对齐目标。`,
`和别人合作或分享资源会带来好处。财务上的约定也比较顺利。`,
`和别人的金钱往来要说清楚，避免因为钱伤感情。`,
`约重要的人吃顿饭、好好聊聊/对伙伴说声谢谢/主动联系一个想合作的人`,
`坦诚说出你在关系里的感受/检查一下彼此付出是否平衡/把合作的分工写清楚`],
[`Two of Cups`,`Connection · Partnership · Attraction`,`Give your heart, receive a heart.`,
`Two mochi cats face each other and offer each other a cup. A big heart floats between them. It stands for a true, equal bond between two hearts.`,
`You share a beautiful bond with someone. In love, friendship, or work, both sides give and respect each other. This is a very warm partner card.`,
`There is a little imbalance or misunderstanding in a relationship. Maybe one side gives too much, or you are not talking enough. An honest talk can bring you close again.`,
`You are drawn to each other and your hearts match. A great time for dates, confessions, or a next step.`,
`There is some distance or small conflict between you. Let go of pride and share your feelings first.`,
`A good time to work with a partner. You can support each other and grow together.`,
`A partnership may have unclear roles or different ideas. Say your expectations clearly and agree on goals again.`,
`Working together or sharing resources brings good results. Money agreements go smoothly.`,
`Be clear about money with others so it doesn't hurt the relationship.`,
