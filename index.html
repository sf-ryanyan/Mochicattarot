function setLang(l){S.lang=l;store.set('mct-lang',l);document.documentElement.lang=l==='zh'?'zh-CN':'en';document.body.dataset.lang=l;renderAll();}
function go(v){S.view=v;['home','reading','library','guide'].forEach(x=>{$('#v-'+x).hidden=x!==v});document.querySelectorAll('.nav a').forEach(a=>a.classList.toggle('on',a.dataset.v===v));try{history.replaceState(null,'','#'+v)}catch(e){}window.scrollTo({top:0});if(v==='reading'&&S.step===4)layoutWheel();}

function renderChrome(){document.querySelectorAll('[data-t]').forEach(el=>{el.innerHTML=t(el.dataset.t)});$('#lz').classList.toggle('on',LG()==='zh');$('#le').classList.toggle('on',LG()==='en');$('#lz').setAttribute('aria-pressed',LG()==='zh');$('#le').setAttribute('aria-pressed',LG()==='en');document.title=t('brand');}

function today(){const d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();}
function getDaily(){let d=store.get('mct-daily');if(!d||d.date!==today()){d={date:today(),id:rnd(CARDS.length),rev:rnd(100)<30,open:false};store.set('mct-daily',d);}return d;}
function renderDaily(){const d=S.daily||(S.daily=getDaily());const c=CARDS[d.id][LG()];
$('#daily-card').innerHTML=`<button class="flip ${d.open?'flipped':''} ${d.rev?'rev':''}" id="daily-btn" aria-label="${d.open?c.name:t('dailyFlip')}"><span class="halo"></span><span class="inner"><span class="face back">${BACK_SVG}</span><span class="face front">${cardSVG(d.id,LG())}</span></span></button>`;
$('#daily-text').innerHTML=d.open?`<p class="eyebrow">${t('dailyTitle')} · ${d.rev?t('reversed'):t('upright')}</p><h3 class="display">${c.name}</h3><p class="kw">${c.kw}</p><p class="scene">${c.scene}</p><p>${d.rev?c.rev:c.up}</p><p class="tip"><b>${t('advice')}</b>${c.advice}</p><p class="muted small">${t('dailyDone')}</p><button class="btn ghost" id="daily-more">${t('seeMore')}</button>`:`<p class="eyebrow">${t('dailyTitle')}</p><h3 class="display">${t('dailyFlip')}</h3><p>${t('dailyHint')}</p><button class="btn gold" id="daily-go">${t('dailyFlip')}</button>`;
const flip=()=>{if(d.open)return;d.open=true;store.set('mct-daily',d);revealCard($('#daily-btn'));setTimeout(renderDaily,1300);};
$('#daily-btn').onclick=()=>d.open?openDetail(d.id):flip();const g=$('#daily-go');if(g)g.onclick=flip;const m=$('#daily-more');if(m)m.onclick=()=>openDetail(d.id);}
function renderHome(){$('#hero-art').innerHTML=heroSVG();$('#cb-art').innerHTML=crystalSVG();renderDaily();}

function steps(){return `<ol class="steps">${['s1','s2','s3','s4','s5'].map((k,i)=>`<li class="${S.step===i+1?'on':S.step>i+1?'done':''}"><span>${i+1}</span>${t(k)}</li>`).join('')}</ol>`;}
function posLabels(){return positions().map(p=>POS[p][LG()]);}

const RM=()=>matchMedia('(prefers-reduced-motion: reduce)').matches;
function burst(x,y,n){if(RM())return;const c=document.createElement('div');c.className='burst';c.style.left=x+'px';c.style.top=y+'px';const cols=['#F5CF86','#FFB8C9','#FFFFFF','#A8E6CF'];let h='';for(let i=0;i<n;i++){const an=Math.random()*Math.PI*2,d=40+Math.random()*80,s=6+Math.random()*9;h+=`<i style="--dx:${(Math.cos(an)*d).toFixed(1)}px;--dy:${(Math.sin(an)*d).toFixed(1)}px;--s:${s.toFixed(1)}px;--d:${(Math.random()*.15).toFixed(2)}s;--c:${cols[i%4]}"></i>`;}c.innerHTML=h;document.body.appendChild(c);setTimeout(()=>c.remove(),1200);}
function revealCard(b){if(!b)return;b.classList.remove('ready');b.classList.add('flipped','pop');setTimeout(()=>{const r=b.getBoundingClientRect();burst(r.left+r.width/2,r.top+r.height/2,24);b.classList.add('shine');},430);}
function flyToSlot(b,i){const slot=$('#slot'+i),sc=slot.querySelector('.slot-card');const done=()=>{sc.innerHTML=BACK_SVG;slot.classList.add('filled','land');const s=sc.getBoundingClientRect();burst(s.left+s.width/2,s.top+s.height/2,12);};
if(RM()||!document.body.animate){done();return;}
const r=b.getBoundingClientRect(),w=b.offsetWidth,h=b.offsetHeight,cx=r.left+r.width/2,cy=r.top+r.height/2,an=S.rot+parseFloat(b.style.getPropertyValue('--a')||0);
const s=sc.getBoundingClientRect(),tx=s.left+s.width/2-cx,ty=s.top+s.height/2-cy,k=s.width/w,end=Math.round(an/360)*360;
const c=document.createElement('div');c.className='flyer';c.innerHTML=BACK_SVG;Object.assign(c.style,{width:w+'px',height:h+'px',left:(cx-w/2)+'px',top:(cy-h/2)+'px'});document.body.appendChild(c);burst(cx,cy,10);
c.animate([{transform:`translate(0,0) rotate(${an}deg) scale(1)`},{transform:`translate(0,-28px) rotate(${an}deg) scale(1.4)`,offset:.3},{transform:`translate(${tx}px,${ty}px) rotate(${end}deg) scale(${k})`}],{duration:850,easing:'cubic-bezier(.5,0,.2,1)'}).onfinish=()=>{c.remove();done();};}
function stopSpin(){if(S.raf){cancelAnimationFrame(S.raf);S.raf=0;}}
function renderReading(){stopSpin();const el=$('#v-reading');const sp=SPREADS[S.spread];
if(S.step===1){el.innerHTML=`<div class="wrap pad">${steps()}
<h1 class="display h1">${t('topicTitle')}</h1><p class="lede">${t('readSub')}</p>
<div class="topics" role="radiogroup" aria-label="${t('topicTitle')}">${Object.entries(TOPICS).map(([k,v])=>`<button class="topic ${S.topic===k?'on':''}" role="radio" aria-checked="${S.topic===k}" data-tp="${k}"><span class="ti ti-${k}">${ICON[k]}</span><b class="display">${v[LG()]}</b><span>${LG()==='zh'?v.dz:v.de}</span></button>`).join('')}</div>
<h2 class="display h3">${t('spreadTitle')}</h2>
<div class="spreads" role="radiogroup" aria-label="${t('spreadTitle')}">${Object.entries(SPREADS).map(([k,s])=>`<button class="spread ${S.spread===k?'on':''}" role="radio" aria-checked="${S.spread===k}" data-s="${k}"><span class="mini">${'<i></i>'.repeat(s.n)}</span><b class="display">${s[LG()]}</b><span>${LG()==='zh'?s.dz:s.de}</span><small>${s.pos(S.topic).map(p=>POS[p][LG()]).join(' · ')}</small></button>`).join('')}</div>
<div class="shuffle-zone"><p class="choice-line"><span class="ti ti-${S.topic}">${ICON[S.topic]}</span>${TOPICS[S.topic][LG()]} · ${SPREADS[S.spread][LG()]}</p><button class="shuffle-btn" id="go-shuffle"><span class="sb-ring"></span><span class="sb-ring r2"></span><span class="sb-cards">${[0,1,2].map(i=>`<span class="sbc sbc${i}">${BACK_SVG}</span>`).join('')}</span><span class="sb-label display">${t('shuffleBtn')}</span></button><p class="muted small">${t('qTip')}</p></div></div>`;
el.querySelectorAll('.topic').forEach(b=>b.onclick=()=>{S.topic=b.dataset.tp;renderReading();});
el.querySelectorAll('.spread').forEach(b=>b.onclick=()=>{S.spread=b.dataset.s;renderReading();});
$('#go-shuffle').onclick=()=>{S.deck=shuffled(CARDS.length);S.picks=[];S.step=2;renderReading();};return;}
if(S.step===2){el.innerHTML=`<div class="wrap pad center">${steps()}<div class="deck" aria-hidden="true">${[0,1,2,3,4].map(i=>`<div class="dk dk${i}">${BACK_SVG}</div>`).join('')}</div><h2 class="display h2">${t('shuffling')}</h2><p class="lede mid">${t('shuffleSub')}</p></div>`;
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;clearTimeout(S.tmr);S.tmr=setTimeout(()=>{if(S.step===2){S.step=3;renderReading();}},reduce?400:2200);return;}
if(S.step===3){el.innerHTML=`<div class="wrap pad center">${steps()}<h1 class="display h1">${t('cutTitle')}</h1><p class="lede mid">${t('cutSub')}</p>
<div class="piles">${[0,1,2].map(i=>`<button class="pile" data-p="${i}"><span class="stack">${[0,1,2].map(j=>`<span class="pc pc${j}">${BACK_SVG}</span>`).join('')}</span><span class="pl">${T.pile[LG()][i]}</span></button>`).join('')}</div></div>`;
el.querySelectorAll('.pile').forEach(b=>b.onclick=()=>{if(S.cutting)return;S.cutting=true;const p=+b.dataset.p;el.querySelectorAll('.pile').forEach(x=>x.classList.add(x===b?'chosen':'fade'));setTimeout(()=>{const r=b.querySelector('.stack').getBoundingClientRect();burst(r.left+r.width/2,r.top+r.height/2,20);},250);
const piles=[S.deck.slice(0,26),S.deck.slice(26,52),S.deck.slice(52)];S.deck=piles[p];
setTimeout(()=>{S.cutting=false;S.step=4;S.rot=0;S.dealt=false;renderReading();},matchMedia('(prefers-reduced-motion: reduce)').matches?200:1250);});return;}
if(S.step===4){const lbl=posLabels();el.innerHTML=`<div class="wrap pad">${steps()}<div class="center"><h1 class="display h1">${t('wheelTitle')}</h1><p class="lede mid">${t('wheelSub')}</p></div>
<div class="slots">${lbl.map((p,i)=>`<div class="slot ${S.picks[i]?'filled':''}" id="slot${i}"><div class="slot-card">${S.picks[i]?BACK_SVG:''}</div><span>${p}</span></div>`).join('')}</div>
<div class="wheel-wrap" id="ww"><div class="wheel ${S.dealt?'':'deal'}" id="wheel">${S.deck.map((id,k)=>`<button style="--i:${k}" class="wc ${S.picks.some(p=>p.k===k)?'taken':''}" data-k="${k}" ${S.picks.some(p=>p.k===k)?'disabled':''} aria-label="${LG()==='zh'?'第 '+(k+1)+' 张牌':'Card '+(k+1)}">${BACK_SVG}</button>`).join('')}</div>
</div><div class="fan-ctrl"><button class="rot" id="rotL" aria-label="${t('rotL')}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button><span class="count">${t('picked')} <b id="pc">${S.picks.length}</b> / ${sp.n}</span><button class="rot" id="rotR" aria-label="${t('rotR')}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button></div>
<p class="center full-hint" id="fullhint" ${S.picks.length<sp.n?'hidden':''}>${t('full')}</p>
</div>`;
layoutWheel();bindWheel();if(!S.dealt){S.dealt=true;setTimeout(()=>{const w=$('#wheel');if(w)w.classList.remove('deal')},S.deck.length*12+950);}return;}
renderResult(el);}

function layoutWheel(){const ww=$('#ww'),wh=$('#wheel');if(!ww||!wh)return;const Wd=Math.min(ww.parentElement.clientWidth,960),n=S.deck.length;
const cw=Math.max(44,Math.min(80,Wd*0.08)),ch=cw*1.5,R=Math.max(Wd*0.85,cw*12),step=(cw*0.6)/R,span=(n-1)*step;
const edge=Math.min(span/2+step,Math.asin(Math.min(1,(Wd/2-cw*0.3)/R))),top=30,cy=top+ch/2+R;
ww.style.width=Wd+'px';ww.style.height=(top+ch+R*(1-Math.cos(edge))+18)+'px';wh.style.left=(Wd/2)+'px';wh.style.top=cy+'px';
S.fanR=R;S.fanStep=step*180/Math.PI;S.fanLim=Math.max(0,(span/2-edge)*180/Math.PI+S.fanStep);
wh.querySelectorAll('.wc').forEach((b,i)=>{const an=(i-(n-1)/2)*S.fanStep;b.style.width=cw+'px';b.style.height=ch+'px';b.style.left=(-cw/2)+'px';b.style.top=(-ch/2)+'px';b.style.zIndex=i+1;b.style.setProperty('--a',an+'deg');b.style.setProperty('--r',-R+'px');});
S.rot=clampRot(S.rot);wh.style.transform=`rotate(${S.rot}deg)`;}
function clampRot(v){const l=S.fanLim||0;return Math.max(-l,Math.min(l,v));}
function setRot(v,ease){const wh=$('#wheel');if(!wh)return;S.rot=v;wh.classList.toggle('ease',!!ease);wh.style.transform=`rotate(${v}deg)`;}
function bindWheel(){const ww=$('#ww');const sp=SPREADS[S.spread];let drag=null,touched=false;
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const spin=()=>{if(touched||S.step!==4)return;setRot(S.rot+0.05);S.raf=requestAnimationFrame(spin);};
const ang=e=>{const b=ww.getBoundingClientRect();return Math.atan2(e.clientY-(b.top+b.height/2),e.clientX-(b.left+b.width/2))*180/Math.PI;};
const pick=b=>{if(!b||b.disabled||S.picks.length>=sp.n)return;const k=+b.dataset.k;if(S.picks.some(p=>p.k===k))return;S.picks.push({k,id:S.deck[k],rev:rnd(100)<35});b.disabled=true;const i=S.picks.length-1;flyToSlot(b,i);b.classList.add('taken');$('#pc').textContent=S.picks.length;if(S.picks.length>=sp.n){$('#fullhint').hidden=false;ww.classList.add('done');setTimeout(()=>{if(S.step===4){S.step=5;S.flipped=false;renderReading();window.scrollTo({top:0,behavior:RM()?'auto':'smooth'});}},RM()?300:1600);}};
ww.addEventListener('pointerdown',e=>{if(e.target.closest('.rot'))return;touched=true;stopSpin();drag={a:ang(e),r:S.rot,x:e.clientX,y:e.clientY,moved:false};try{ww.setPointerCapture(e.pointerId)}catch(_){};setRot(S.rot,false);});
ww.addEventListener('pointermove',e=>{if(!drag)return;if(Math.hypot(e.clientX-drag.x,e.clientY-drag.y)>6)drag.moved=true;if(drag.moved){setRot(clampRot(drag.r+(e.clientX-drag.x)/S.fanR*180/Math.PI),false);}});
const end=e=>{if(!drag)return;const wasDrag=drag.moved;drag=null;try{ww.releasePointerCapture(e.pointerId)}catch(_){};if(!wasDrag&&e.type==='pointerup'){const el=document.elementFromPoint(e.clientX,e.clientY);pick(el&&el.closest('.wc'));}};
ww.addEventListener('pointerup',end);ww.addEventListener('pointercancel',end);
ww.querySelectorAll('.wc').forEach(b=>b.addEventListener('click',e=>{if(e.detail===0)pick(b);}));
$('#rotL').onclick=()=>{setRot(clampRot(S.rot+S.fanStep*4),true);};$('#rotR').onclick=()=>{setRot(clampRot(S.rot-S.fanStep*4),true);};}
window.addEventListener('resize',()=>{if(S.view==='reading'&&S.step===4)layoutWheel();});

function detHTML(p,i,pos){const c=CARDS[p.id][LG()],P=POS[pos],tp=S.topic;const core=p.rev?c.rev:c.up;
return `<article class="det"><div class="det-card">${cardSVG(p.id,LG())}</div><div class="det-body"><p class="eyebrow">${P[LG()]}</p><h3 class="display">${c.name} <span class="badge ${p.rev?'r':''}">${p.rev?t('reversed'):t('upright')}</span></h3><p class="kw">${c.kw}</p>
<div class="blk"><b>${t('lScene')}</b><p class="scene">${c.scene}</p></div>
${tp!=='general'?`<div class="blk"><b>${t('lCore')}</b><p>${core}</p></div>`:''}
<div class="blk hl"><b>${P[LG()]} · ${TOPICS[tp][LG()]}</b><p>${LG()==='zh'?P.lz:P.le}${topicText(p.id,tp,p.rev)}</p></div>
<div class="blk"><b>${t('lAct')}</b><ul>${c.act[p.rev?1:0].map(a=>`<li>${a}</li>`).join('')}</ul></div></div></article>`;}

function renderResult(el){const sp=SPREADS[S.spread],pos=positions();
el.innerHTML=`<div class="wrap pad">${steps()}<div class="qbox"><span class="eyebrow">${t('youAsked')}</span><p class="display"><span class="ti ti-${S.topic}">${ICON[S.topic]}</span>${TOPICS[S.topic][LG()]} · ${sp[LG()]}</p></div>
<div class="result-cards">${S.picks.map((p,i)=>`<div class="rc ${sp.n===1?'solo':''}"><span class="eyebrow">${POS[pos[i]][LG()]}</span><button class="flip ${S.flipped?'flipped':''} ${p.rev?'rev':''}" data-id="${p.id}" aria-label="${name(p.id)}"><span class="halo"></span><span class="inner"><span class="face back">${BACK_SVG}</span><span class="face front">${cardSVG(p.id,LG())}</span></span></button><span class="badge ${p.rev?'r':''}">${p.rev?t('reversed'):t('upright')}</span></div>`).join('')}</div>
<div class="details">${S.picks.map((p,i)=>detHTML(p,i,pos[i])).join('')}</div>
<section class="summary"><h2 class="display h2">${t('summary')}</h2>${summaryHTML()}<p class="disc small">${t('disc')}</p></section>
<div class="actions"><button class="btn gold" id="again">${t('again')}</button><button class="btn ghost" id="change">${t('change')}</button><button class="btn ghost" id="copy">${t('copy')}</button></div><p class="muted small center">${t('shot')}</p></div>`;
el.querySelectorAll('.result-cards .flip').forEach(b=>b.onclick=()=>openDetail(+b.dataset.id));
if(!S.flipped){const fl=el.querySelectorAll('.result-cards .flip');fl.forEach(b=>b.classList.add('ready'));fl.forEach((b,i)=>setTimeout(()=>revealCard(b),700+i*750));S.flipped=true;}
$('#again').onclick=()=>{S.deck=shuffled(CARDS.length);S.picks=[];S.step=2;renderReading();window.scrollTo({top:0});};
$('#change').onclick=()=>{S.step=1;S.picks=[];renderReading();window.scrollTo({top:0});};
$('#copy').onclick=async()=>{const b=$('#copy');try{await navigator.clipboard.writeText(resultText());b.textContent=t('copied');}catch(e){b.textContent=t('copyFail');}setTimeout(()=>{b.textContent=t('copy')},2200);};}

function summaryHTML(){const ps=S.picks,n=ps.length,r=ps.filter(p=>p.rev).length,u=n-r,zh=LG()==='zh',pos=positions(),tp=TOPICS[S.topic][LG()];const out=[];
if(n===1){const p=ps[0];out.push(zh?`关于「${tp}」，团子猫给你的指引是${q(name(p.id))}${p.rev?'逆位':'正位'}。${p.rev?'现在可能有一点阻碍，放慢脚步、调整心态，事情会慢慢顺起来。':'现在的能量很顺，适合按照这张牌的方向去行动。'}`:`For ${tp.toLowerCase()}, your guidance card is ${name(p.id)}, ${p.rev?'reversed':'upright'}. ${p.rev?'There may be small blocks now. Slow down and adjust, and things will ease.':'The energy flows well now. Act in the spirit of this card.'}`);}
else{out.push(zh?`关于「${tp}」，你抽到了${ps.map(p=>q(name(p.id))).join('、')}，其中 ${u} 张正位、${r} 张逆位。`:`For ${tp.toLowerCase()}, you drew ${ps.map(p=>name(p.id)).join(', ')}: ${u} upright and ${r} reversed.`);
out.push(r===0?(zh?'整体能量很积极，事情正在往好的方向发展。':'The overall energy is very positive. Things are moving in a good direction.'):r<u?(zh?'整体偏积极，有一些小地方需要多留意。':'Mostly positive, with a few small points to watch.'):(zh?'目前可能有些阻碍，先调整心态和节奏，情况会慢慢好转。':'There may be some blocks right now. Adjust your mindset and pace, and things will improve.'));}
let html=out.map(x=>`<p>${x}</p>`).join('');
if(n>1){html+=`<div class="story"><b>${t('sStory')}</b><ol>${ps.map((p,i)=>`<li><span class="sp">${POS[pos[i]][LG()]}</span>${q(name(p.id))}${zh?'：':': '}${first(topicText(p.id,S.topic,p.rev))}</li>`).join('')}</ol></div>`;
if(S.spread==='choice'){const sa=ps[0].rev?0:1,sb=ps[1].rev?0:1;html+=`<p>${sa===sb?(zh?'两个选项的能量差不多，关键在于哪一个更符合你真正的心意。':'Both options feel similar. Choose the one that fits what you truly want.'):(zh?`从牌面看，${sa>sb?'选项 A':'选项 B'}的能量更顺，可以优先考虑。`:`The cards favor ${sa>sb?'Option A':'Option B'}. Consider it first.`)}</p>`;}
if(S.spread==='three'&&S.topic==='general'){const f=ps[2];html+=`<p>${zh?`从过去走到现在，未来的${q(name(f.id))}提示你：${CARDS[f.id].zh.advice}`:`Looking ahead, ${name(f.id)} suggests: ${CARDS[f.id].en.advice}`}</p>`;}}
const notes=[];ps.forEach(p=>{if(GOOD.includes(p.id)&&!p.rev)notes.push(zh?`你抽到了好运牌${q(name(p.id))}，好事值得期待。`:`${name(p.id)} is a lucky card. Good things are worth looking forward to.`);if(HARD.includes(p.id)&&!p.rev)notes.push(zh?`${q(name(p.id))}提醒你面对变化，它代表成长的机会，不必害怕。`:`${name(p.id)} asks you to face change. It is a chance to grow, not something to fear.`);});
html+=notes.map(x=>`<p>${x}</p>`).join('');
const todo=[...new Set(ps.map(p=>CARDS[p.id][LG()].act[p.rev?1:0][0]).concat(ps.map(p=>CARDS[p.id][LG()].act[p.rev?1:0][1])))].slice(0,3);
html+=`<div class="story"><b>${t('sTodo')}</b><ul>${todo.map(a=>`<li>${a}</li>`).join('')}</ul></div>`;
const last=CARDS[ps[ps.length-1].id][LG()];html+=`<p class="tip"><b>${t('sLine')}</b>${last.advice}</p>`;return html;}
function resultText(){const sp=SPREADS[S.spread],pos=positions(),zh=LG()==='zh';let s=`${t('brand')} · ${TOPICS[S.topic][LG()]} · ${sp[LG()]}\n\n`;S.picks.forEach((p,i)=>{const c=CARDS[p.id][LG()];s+=`${POS[pos[i]][LG()]}${zh?'：':': '}${c.name} (${p.rev?t('reversed'):t('upright')})\n${topicText(p.id,S.topic,p.rev)}\n\n`;});s+=`${t('sLine')}${zh?'：':': '}${CARDS[S.picks[S.picks.length-1].id][LG()].advice}`;return s;}

const SUITS=['major','wands','cups','swords','pent'],SUITL={major:'fMajor',wands:'fWands',cups:'fCups',swords:'fSwords',pent:'fPent'};
function suitOf(i){return i<22?'major':SUITS[1+Math.floor((i-22)/14)];}
function renderLibrary(){const el=$('#v-library');const f=S.libFilter;const chips=[['major','fMajor',22],['wands','fWands',14],['cups','fCups',14],['swords','fSwords',14],['pent','fPent',14]];
el.innerHTML=`<div class="wrap pad"><h1 class="display h1">${t('libTitle')}</h1><p class="lede">${t('libSub')}</p><div class="chips" role="tablist">${chips.map(([k,l,c])=>`<button class="chip ${f===k?'on':''}" role="tab" aria-selected="${f===k}" data-f="${k}">${t(l)} <small>${c}</small></button>`).join('')}</div>
<div class="lib">${CARDS.map((c,i)=>i).filter(i=>suitOf(i)===f).map(i=>`<button class="lc" data-id="${i}">${cardSVG(i,LG())}</button>`).join('')}</div></div>`;
el.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{S.libFilter=b.dataset.f;renderLibrary();});el.querySelectorAll('.lc').forEach(b=>b.onclick=()=>openDetail(+b.dataset.id));}

function renderGuide(){$('#v-guide').innerHTML=`<div class="wrap pad narrowcol"><h1 class="display h1">${t('guideTitle')}</h1><p class="lede">${t('guideSub')}</p>${GUIDE.map((g,i)=>`<section class="gs"><span class="gn">${String(i+1).padStart(2,'0')}</span><div><h2 class="display">${g.h[LG()]}</h2><p>${g.p[LG()]}</p></div></section>`).join('')}<p class="disc">${t('disc')}</p><button class="btn gold big" id="guide-go">${t('ctaRead')}</button></div>`;$('#guide-go').onclick=()=>{S.step=1;S.picks=[];renderReading();go('reading');};}

let lastFocus=null;
function openDetail(id){S.detail=id;lastFocus=document.activeElement;renderDetail();$('#modal').hidden=false;document.body.classList.add('lock');$('#m-close').focus();}
function renderDetail(){if(S.detail==null)return;const c=CARDS[S.detail][LG()];const two=(k,v)=>`<div><dt>${t(k)}</dt><dd><span class="badge">${t('upright')}</span> ${v[0]}</dd><dd><span class="badge r">${t('reversed')}</span> ${v[1]}</dd></div>`;
$('#m-body').innerHTML=`<div class="m-card">${cardSVG(S.detail,LG())}</div><div class="m-text"><p class="eyebrow">${CARDS[S.detail].n} · ${t(SUITL[suitOf(S.detail)])}</p><h2 class="display h2" id="m-title">${c.name}</h2><p class="kw">${c.kw}</p><p class="scene">${c.scene}</p>
<dl><div><dt>${t('mUp')}</dt><dd>${c.up}</dd></div><div><dt>${t('mRev')}</dt><dd>${c.rev}</dd></div>${two('mLove',c.love)}${two('mCareer',c.career)}${two('mMoney',c.money)}<div><dt>${t('lAct')}</dt><dd><ul>${c.act[0].map(a=>`<li>${a}</li>`).join('')}</ul></dd></div></dl><p class="tip"><b>${t('mAdvice')}</b>${c.advice}</p></div>`;$('#m-close').textContent=t('close');}
function closeDetail(){$('#modal').hidden=true;document.body.classList.remove('lock');S.detail=null;if(lastFocus)lastFocus.focus();}

function renderAll(){renderChrome();renderHome();renderReading();renderLibrary();renderGuide();if(S.detail!=null)renderDetail();}
function stars(){const box=$('#sky');const n=matchMedia('(max-width:640px)').matches?40:80;let h='';for(let i=0;i<n;i++){const s=Math.random()*2+1;h+=`<i style="left:${Math.random()*100}%;top:${Math.random()*100}%;width:${s}px;height:${s}px;animation-delay:${(Math.random()*4).toFixed(2)}s"></i>`;}box.innerHTML=h;}

document.addEventListener('DOMContentLoaded',()=>{
$('#logo').innerHTML=logoSVG();stars();
$('#lz').onclick=()=>setLang('zh');$('#le').onclick=()=>setLang('en');
document.querySelectorAll('.nav a').forEach(a=>a.onclick=e=>{e.preventDefault();go(a.dataset.v);});
$('#brand').onclick=e=>{e.preventDefault();go('home');};
document.querySelectorAll('#v-home [data-go]').forEach(b=>b.onclick=()=>{if(b.dataset.go==='reading'){S.step=1;S.picks=[];renderReading();}go(b.dataset.go);});
$('#m-close').onclick=closeDetail;$('#modal').onclick=e=>{if(e.target.id==='modal')closeDetail();};document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#modal').hidden)closeDetail();});
document.body.dataset.lang=LG();document.documentElement.lang=LG()==='zh'?'zh-CN':'en';
renderAll();const h=(location.hash||'').slice(1);go(['home','reading','library','guide'].includes(h)?h:'home');
});

</script>

</body>
</html>
