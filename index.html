`Have a meal and a real talk with someone dear/Say thank you to a partner/Reach out to someone you want to work with`,
`Share your true feelings in the relationship/Check if giving is balanced on both sides/Write down clear roles for teamwork`]);

// Three of Cups
C('3',[`圣杯三`,`友谊・庆祝・欢聚`,`和朋友一起庆祝吧。`,
`三只团子猫一起举杯欢呼，周围飘着彩色星星纸屑。这象征友谊、欢聚和值得庆祝的好事。`,
`这是一张开心的庆祝牌！朋友、家人和团队会给你温暖的支持。有好消息就大方分享，一起享受这份快乐。`,
`可能玩得太多而忽略了正事，或者朋友圈里有点小八卦和摩擦。保持适度，真诚待人就好。`,
`感情在欢乐的气氛里升温，适合和朋友一起出去玩、认识新的人。单身的人可能在聚会中遇到心动对象。`,
`小心第三者的干扰，或是朋友插手太多。两人的事要两人好好沟通。`,
`团队合作很愉快，适合庆祝阶段性的成果。多和同事交流，会带来好机会。`,
`团队里可能有小圈子或八卦，影响专注。把注意力放回工作本身。`,
`有值得庆祝的小收获。可以花点钱和朋友聚聚，但不要太铺张。`,
`聚会和娱乐的开销有点多，记得留意预算。`,
`约朋友一起吃饭或喝杯茶/为自己的小成就庆祝一下/给好久没联系的朋友发个消息`,
`减少一次不必要的聚会/远离让你不舒服的八卦/给这个月的娱乐开销设个上限`],
[`Three of Cups`,`Friendship · Celebration · Gathering`,`Celebrate with your friends.`,
`Three mochi cats raise their cups together in a cheerful toast, with confetti stars all around. It stands for friendship, gathering, and good things to celebrate.`,
`This is a happy card of celebration. Friends, family, and your team give you warm support. Share your good news and enjoy the joy together.`,
`You may be having too much fun and forgetting important things. Or there is some gossip and friction among friends. Keep balance and stay sincere.`,
`Love grows in a happy, fun mood. Go out with friends and meet new people. Singles may meet someone special at a party.`,
`Watch out for someone getting in the middle, or friends getting too involved. Talk things over just between the two of you.`,
`Teamwork feels great. Celebrate the progress you have made. Talking with coworkers brings good chances.`,
`Small groups or gossip at work may pull your focus. Bring your attention back to the work itself.`,
`You have a small win to celebrate. Spend a little on fun with friends, but don't go too big.`,
`Spending on parties and fun is getting high. Keep an eye on your budget.`,
`Meet a friend for a meal or tea/Celebrate one small win today/Message a friend you miss`,
`Skip one party you don't need/Stay away from gossip that feels bad/Set a limit for fun spending this month`]);

// Four of Cups
C('4',[`圣杯四`,`倦怠・沉思・错过机会`,`抬头看看新的礼物。`,
`团子猫坐在树下，抱着手臂、眼神困倦又无聊，面前放着三只杯子，而云里正递来第四只杯子。这象征对现状感到厌倦，却没注意到新的机会。`,
`你对现在的生活有点提不起劲，觉得什么都没意思。安静思考没有问题，但别错过身边正在出现的新机会。试着用新的眼光看看四周。`,
`你开始从倦怠中醒来，愿意重新接受新的事物。这是走出低潮、再次出发的好时机。`,
`感情可能有点平淡，或你对别人的好意没兴趣。试着用心看看对方的付出。`,
`你重新对感情打开心，愿意给新的人或关系一次机会。`,
`工作让你觉得无聊、没动力。别急着否定一切，也许有新的机会正在靠近。`,
`你重新找回动力，愿意接受新的任务或挑战。主动抓住机会吧。`,
`财务平稳但你没什么热情去规划。留意一些你可能忽略的小机会。`,
`你开始重新关注钱的事，适合重新整理预算和目标。`,
`列出你已经拥有的三件好事/对一个新邀请说「好」/去户外走走，换个心情`,
`试一件以前没做过的小事/主动回应一个你忽略的机会/为接下来一周定一个小目标`],
[`Four of Cups`,`Boredom · Reflection · Missed chance`,`Look up and see the new gift.`,
`The mochi cat sits under a tree with crossed paws and sleepy, bored eyes. Three cups sit in front of it, while a fourth cup is offered from a cloud. It stands for feeling bored and not noticing a new chance.`,
`You feel a little flat about life right now, and nothing seems exciting. Quiet thinking is fine, but don't miss the new chances around you. Try to look at things with fresh eyes.`,
`You are waking up from boredom and are ready for new things again. A good time to leave a low mood behind and start again.`,
`Love may feel a little dull, or you are not interested in someone's kindness. Try to really see what the other person gives.`,
`You open your heart again and are willing to give a new person or relationship a chance.`,
`Work feels boring and you lack motivation. Don't reject everything. A new chance may be coming close.`,
`Your motivation comes back. You are ready for new tasks or challenges. Go and take the chance.`,
`Your money is stable, but you don't feel like planning. Look for small chances you might be missing.`,
`You start caring about money again. A good time to redo your budget and goals.`,
`List three good things you already have/Say yes to one new invitation/Take a walk outside to change your mood`,
`Try one small thing you have never done/Answer a chance you ignored before/Set one small goal for next week`]);

// Five of Cups
C('5',[`圣杯五`,`失落・遗憾・仍有希望`,`转身看看还在的东西。`,
`团子猫难过地看着三只倒下的杯子，眼角挂着一滴小眼泪，还没注意到身后仍然立着的两只杯子。这象征失落之中，其实仍有希望。`,
`你可能正为某件事感到失望或遗憾，这种难过是很正常的。允许自己伤心一下，但也记得，你身边还有珍贵的东西在。慢慢转身，就会看到希望。`,
`你正在走出难过，开始接受过去、看向未来。原谅自己和别人，心会越来越轻松。`,
`感情里可能有失望或遗憾。难过之后，看看你们之间还有哪些美好值得珍惜。`,
`你开始放下旧伤，愿意重新相信爱。这是疗愈和重新出发的时候。`,
`工作上可能有不如意的结果。从中学到经验，你还有其他机会和资源。`,
`你从挫折中恢复，开始找到新的方向。把注意力放在你还能做的事上。`,
`可能有一点小损失，不要只盯着失去的部分。检查一下你还有哪些可以运用的资源。`,
`财务开始慢慢回稳，适合从过去的错误中学习、重新规划。`,
`允许自己难过一下，写下感受/列出你仍然拥有的好东西/找一个关心你的人聊聊`,
`对自己说一句「没关系」/从这次经验里写下一个收获/为接下来定一个新的小计划`],
[`Five of Cups`,`Loss · Regret · Hope remains`,`Turn around and see what remains.`,
`The mochi cat looks sadly at three spilled cups, with a small tear. It does not yet notice the two cups still standing behind it. It stands for sadness, but also hope that is still there.`,
`You may feel let down or sorry about something, and that sadness is normal. Let yourself feel it, but remember that good things are still with you. Turn around slowly and you will see hope.`,
`You are moving out of sadness. You start to accept the past and look to the future. Forgive yourself and others, and your heart will feel lighter.`,
`There may be some disappointment in love. After the sadness, look at the good things between you that are still worth keeping.`,
`You start to let go of old hurt and are ready to trust love again. A time for healing and a fresh start.`,
`A work result may not be what you hoped. Learn from it. You still have other chances and resources.`,
`You are recovering from a setback and finding a new direction. Focus on what you can still do.`,
`There may be a small loss. Don't only look at what is gone. Check what resources you still have.`,
`Your money slowly becomes stable again. Learn from past mistakes and make a new plan.`,
`Let yourself feel sad and write it down/List the good things you still have/Talk with someone who cares about you`,
`Tell yourself it is okay/Write down one lesson from this experience/Make a small new plan for what is next`]);

// Six of Cups
C('6',[`圣杯六`,`回忆・纯真・善意`,`用童心去爱。`,
`团子猫在小屋前，把一只插着小花的杯子递给一只小小猫。这象征纯真的善意、美好的回忆和单纯的快乐。`,
`这张牌带来温暖的回忆和纯真的心情。也许是老朋友出现、想起童年的快乐，或是简单地对别人好。用孩子般的心去看世界吧。`,
`你可能太沉浸在过去，或拿过去和现在比较。回忆很美，但生活在前方。带着过去的温暖，好好活在当下。`,
`感情甜蜜单纯，可能有旧识重逢或青梅竹马的缘分。小小的贴心举动最动人。`,
`别一直拿旧感情和现在比较。放下过去，才能好好珍惜眼前人。`,
`工作气氛友善，适合帮助新人或和老同事重新联系。过去的经验会帮上忙。`,
`不要一直停留在过去的做法。试着学习新方法，跟上变化。`,
`可能收到家人或朋友的小礼物或帮助。也可以用小小的方式回馈别人。`,
`别为了怀旧或面子乱花钱。用心意比用钱更重要。`,
`给老朋友或家人打个电话/送身边的人一个小礼物/做一件童年时喜欢的事`,
`收起一样让你停在过去的东西/试一个新的做事方法/写下现在生活里的三件好事`],
[`Six of Cups`,`Memories · Innocence · Kindness`,`Love with a child's heart.`,
`In front of a little cottage, the mochi cat hands a cup with a flower in it to a small kitten. It stands for pure kindness, sweet memories, and simple joy.`,
`This card brings warm memories and an innocent heart. An old friend may appear, you may remember happy childhood days, or you simply do something kind. Look at the world with a child's heart.`,
`You may be living too much in the past, or comparing it with now. Memories are sweet, but life is ahead of you. Keep the warmth of the past and live in the present.`,
`Love feels sweet and simple. You may meet an old friend again or a childhood sweetheart. Small kind acts mean the most.`,
`Don't keep comparing an old love with today. Let go of the past so you can value the person in front of you.`,
`The work mood is friendly. Help a newcomer or reconnect with old coworkers. Your past experience will help.`,
`Don't stay stuck in old ways. Try to learn new methods and keep up with change.`,
`You may get a small gift or help from family or friends. You can also give back in small ways.`,
`Don't spend money for old times or to look good. A kind heart matters more than money.`,
`Call an old friend or family member/Give someone a small gift/Do one thing you loved as a child`,
`Put away one thing that keeps you in the past/Try a new way of doing a task/Write down three good things in your life now`]);

// Seven of Cups
C('7',[`圣杯七`,`幻想・选择・梦想`,`选一个梦，认真去做。`,
`团子猫惊讶地抬头，看着七只杯子飘在云朵上，每只杯子里都是不同的梦想。这象征很多选择和想象，需要分清现实与幻想。`,
`你面前有好多选择和梦想，让人眼花缭乱。想象很美好，但不是每个都实际。冷静下来，选一个最重要的，脚踏实地去做。`,
`你开始看清现实，知道自己真正想要什么。这是做决定、把梦想变成计划的好时机。`,
`感情里可能有很多幻想，或同时被好几个人吸引。看清对方真实的样子，再决定。`,
`你从感情的幻想中醒来，更清楚自己要什么样的关系。`,
`工作上机会很多，但容易分心。挑一个最有潜力的方向，专心投入。`,
`你终于能专注下来，做出清楚的职业选择。按计划一步步走。`,
`不要被看起来很好赚的机会冲昏头。投资前先查清楚，必要时问专业人士。`,
`你开始更理性地看待金钱，适合做实际的财务计划。`,
`把所有想法写下来，圈出最重要的一个/为这个梦想定第一个小步骤/今天少滑一点手机，专心做一件事`,
`为你的选择定一个截止日期/把一个目标拆成三个步骤/和信任的人聊聊你的计划`],
[`Seven of Cups`,`Fantasy · Choices · Dreams`,`Pick one dream and work on it.`,
`The mochi cat looks up in surprise at seven cups floating on clouds. Each cup holds a different dream. It stands for many choices and dreams, and the need to tell real from fantasy.`,
`You have many choices and dreams in front of you, and it feels confusing. Dreams are lovely, but not all are practical. Calm down, pick the most important one, and take real steps.`,
`You begin to see clearly and know what you truly want. A good time to decide and turn a dream into a plan.`,
`There may be a lot of fantasy in love, or you like several people at once. See the person as they really are before you decide.`,
`You wake up from a love fantasy and know better what kind of relationship you want.`,
`There are many chances at work, but it's easy to lose focus. Choose the best one and give it your full effort.`,
`You can finally focus and make a clear career choice. Follow your plan step by step.`,
`Don't get carried away by easy money offers. Check the facts first, and ask a professional if needed.`,
`You think about money more clearly now. A good time for a practical money plan.`,
`Write all your ideas and circle the top one/Set a first small step for that dream/Use your phone less and focus on one task`,
`Give your choice a deadline/Break one goal into three steps/Talk about your plan with someone you trust`]);

// Eight of Cups
C('8',[`圣杯八`,`离开・寻找・内心成长`,`勇敢走向更好的自己。`,
`月光下，团子猫拄着小手杖走向远方的山，身后留下一叠八只杯子。这象征离开不再适合的地方，去寻找更深的意义。`,
`你可能感觉到，现在的状态已经不能满足你的心。离开不一定是失败，而是去寻找更适合自己的东西。勇敢跟随内心的声音吧。`,
`你可能犹豫要不要离开，或者害怕改变而一直停留。也可能你发现其实还有值得留下的理由。诚实问问自己真正的想法。`,
`你可能发现这段关系已经不能让你满足。认真想想自己需要什么，再温柔地做决定。`,
`你在去留之间犹豫不决。和对方坦诚谈谈，或给自己一点时间想清楚。`,
`现在的工作可能已经不能让你成长。可以开始思考新的方向或学习新技能。`,
`你想改变却迟迟没有行动，或者太冲动想离开。先做好准备再决定。`,
`你可能愿意为更有意义的生活放弃一些物质的东西。做改变前，先存好一笔安心的钱。`,
`别因为一时冲动做大的财务决定。慢慢想清楚再行动。`,
`安静独处一下，问问自己真正想要什么/写下现在让你不满足的地方/查一个你想学的新技能`,
`列出留下和离开的理由/先做一个小小的改变试试/和信任的人谈谈你的犹豫`],
[`Eight of Cups`,`Leaving · Searching · Inner growth`,`Walk bravely toward a better you.`,
`Under the moon, the mochi cat walks away with a walking stick toward the mountains. It leaves a stack of eight cups behind. It stands for leaving what no longer fits to look for deeper meaning.`,
`You may feel that your current life no longer fills your heart. Leaving is not failure. It is a way to find what fits you better. Bravely follow your inner voice.`,
`You may not be sure if you should leave, or you stay because you fear change. You may also find there are still good reasons to stay. Honestly ask yourself what you really want.`,
`You may find this relationship no longer makes you happy. Think about what you need, then decide gently.`,
`You are unsure whether to stay or go. Have an honest talk, or give yourself time to think.`,
`Your current job may no longer help you grow. Start thinking about a new direction or learning a new skill.`,
`You want change but don't act, or you want to leave too quickly. Prepare well before you decide.`,
`You may give up some things for a more meaningful life. Before a big change, save some money for peace of mind.`,
`Don't make big money choices on a sudden feeling. Think it through slowly first.`,
`Spend quiet time alone and ask what you want/Write down what feels empty in your life/Look up one new skill to learn`,
`List reasons to stay and reasons to go/Try one small change first/Talk to someone you trust about your doubts`]);

// Nine of Cups
C('9',[`圣杯九`,`满足・心愿成真・幸福`,`好好享受你的幸福。`,
`团子猫抱着手臂骄傲地坐着，脸上带着开心的笑，身后的架子上整齐排着九只杯子。这象征心愿成真、满足和幸福。`,
`这是著名的「心愿牌」！你想要的事情很可能会实现，你也会感到满足和开心。好好享受这份幸福，也别忘了感谢自己的努力。`,
`你可能太在意外在的东西，或者心愿暂时还没实现。想想什么才是真正让你快乐的事，满足感来自内心。`,
`感情幸福满足，心愿可能实现。单身的人也会对自己的状态感到很满意。`,
`你可能对感情要求太完美，或只关注表面。真心比条件更重要。`,
`工作顺利，目标达成，你会为自己感到骄傲。很适合展示成果。`,
`成功了却不太开心，或太骄傲而忽略他人。保持谦虚，找回工作的意义。`,
`财运很好，生活舒适满足。可以奖励自己一下。`,
`别为了面子或享受而花太多钱。量力而行，简单也是幸福。`,
`写下一个你的心愿，并想象它实现/奖励自己一件小小的喜欢的事/感谢一个帮助过你的人`,
`想一想什么真正让你快乐/减少一次只为面子的消费/真诚称赞身边的一个人`],
[`Nine of Cups`,`Satisfaction · Wishes come true · Happiness`,`Enjoy your happiness.`,
`The mochi cat sits proudly with crossed paws and a happy smile. Nine cups are lined up on shelves behind it. It stands for wishes coming true, satisfaction, and happiness.`,
`This is the famous wish card. What you want is likely to come true, and you will feel happy and satisfied. Enjoy this joy, and thank yourself for your hard work.`,
`You may care too much about outside things, or your wish is not here yet. Think about what truly makes you happy. Real satisfaction comes from inside.`,
`Love feels happy and full, and a wish may come true. Singles also feel good about their life.`,
`You may want love to be perfect, or only look at the surface. A true heart matters more than a checklist.`,
`Work goes well and you reach your goals. You can feel proud. A great time to show your results.`,
`You are successful but not happy, or too proud to see others. Stay humble and find meaning in your work again.`,
`Money luck is good and life feels comfortable. You can reward yourself a little.`,
`Don't spend too much to look good or to treat yourself. Live within your means. Simple can be happy too.`,
`Write down one wish and picture it coming true/Give yourself a small treat you love/Thank someone who helped you`,
`Think about what truly makes you happy/Skip one buy that is only for show/Give someone near you a real compliment`]);

// Ten of Cups
C('10',[`圣杯十`,`家庭・和谐・圆满`,`珍惜身边的爱。`,
`两只团子猫和一只小小猫在由十只杯子组成的彩虹下一起欢呼。这象征家庭和谐、关系圆满和长久的幸福。`,
`这是一张非常幸福的牌！家庭和睦、关系和谐，你被爱包围着。好好珍惜身边的人，一起分享这份温暖。`,
`家里或关系中可能有些小摩擦，或你心中的「完美画面」和现实不太一样。多一点理解和沟通，幸福就在身边。`,
`感情稳定美满，可能谈到长久的未来，例如同居、结婚或组建家庭。`,
`关系里有一些期待落差。别追求完美，多看看彼此的好。`,
`工作环境和谐，团队像家人一样互相支持。你的付出也让家人感到骄傲。`,
`工作和家庭可能难以平衡。试着为家人留出一些时间。`,
`家庭财务稳定，适合为家人做长期规划。一家人一起努力会很顺利。`,
`家里在钱的看法上可能有分歧。坐下来一起讨论，找到共同的目标。`,
`和家人一起吃顿饭、好好聊聊/对家人说一句「我爱你」/一起计划一次小小的家庭活动`,
`放下对完美的要求，看看彼此的好/每天留一点时间给家人/和家人一起讨论钱的计划`],
[`Ten of Cups`,`Family · Harmony · Fulfillment`,`Treasure the love around you.`,
`Two mochi cats and a kitten cheer together under a rainbow made of ten cups. It stands for a happy family, warm relationships, and lasting joy.`,
`This is a very happy card. Your family is peaceful, your relationships are warm, and you are surrounded by love. Treasure the people around you and share this warmth.`,
`There may be small conflicts at home or in a relationship. Or your perfect picture is a bit different from real life. More understanding and talking will bring happiness back.`,
`Love is steady and happy. You may talk about a long future, like moving in, marriage, or starting a family.`,
`Expectations in the relationship don't quite match. Don't chase perfect. Look at the good in each other.`,
`Your workplace feels warm, and the team supports each other like family. Your family is proud of you too.`,
`Work and family may be hard to balance. Try to save some time for your family.`,
`Family money is stable. A good time to make long-term plans for your family.`,
`Your family may see money in different ways. Sit down together and find shared goals.`,
`Have a meal and a good talk with family/Tell a family member you love them/Plan a small family activity together`,
`Let go of perfect and see the good in each other/Save a little time each day for family/Talk about a money plan with your family`]);

// Page of Cups
C('Page',[`圣杯侍从`,`好奇・灵感・温柔讯息`,`对小惊喜保持好奇。`,
`戴着蓝色贝雷帽的团子猫拿着一只杯子，惊讶地看着一条小鱼从杯里跳出来，身后是海浪。这象征意想不到的灵感、温柔的讯息和充满想象力的心。`,
`有一个可爱的小惊喜或新消息要来了。你的心很柔软，充满创意和想象力。相信你的直觉，用好奇心去迎接新的感受吧。`,
`你可能情绪有点孩子气，或者想法很多却没有行动。也可能把心事藏起来不敢说。勇敢表达，同时也要脚踏实地。`,
`可能收到甜蜜的告白或暧昧的小讯息。感情纯真可爱，适合大胆示好。`,
`可能有点情绪化或不够成熟。别只做梦，用行动表达你的心意。`,
`适合发挥创意，尝试新的想法或艺术相关的工作。可能有新机会的好消息。`,
`灵感很多但缺少执行。挑一个点子，认真做出来。`,
`可能有小小的意外之财或好消息。适合学习一点理财的基础知识。`,
`别因为一时开心就冲动消费。花钱前想一想。`,
`把今天冒出的一个灵感记下来/给喜欢的人发一条温暖的消息/尝试一项小小的创作`,
`选一个点子，今天就动手做一点/把心事用文字写下来/冷静一下再回应别人的消息`],
[`Page of Cups`,`Curiosity · Inspiration · Gentle message`,`Stay curious about small surprises.`,
`The mochi cat in a blue beret holds a cup and looks surprised as a little fish pops out of it. Sea waves roll behind. It stands for surprise ideas, gentle news, and a creative heart.`,
`A cute little surprise or new message is coming. Your heart is soft and full of creative ideas. Trust your feelings and meet new things with curiosity.`,
`Your feelings may be a bit childish, or you have many ideas but take no action. You may also hide your feelings. Speak up bravely, and stay down to earth.`,
`You may get a sweet confession or a cute flirty message. Love feels innocent and fun. Be brave and show you care.`,
`You may be moody or not quite mature. Don't just dream. Show your feelings with action.`,
`A good time to use your creativity and try new ideas or art-related work. Good news about a chance may come.`,
`You have many ideas but little action. Pick one and really make it happen.`,
`A small surprise gain or good news may come. A good time to learn money basics.`,
`Don't spend on impulse just because you feel happy. Think before you buy.`,
`Write down one idea that comes to you today/Send a warm message to someone you like/Try one small creative project`,
`Pick one idea and start on it today/Write your feelings down in words/Calm down before you reply to messages`]);

// Knight of Cups
C('Knight',[`圣杯骑士`,`浪漫・邀请・追随内心`,`温柔地追随你的心。`,
`团子猫骑着木马慢慢地、优雅地前进，小心捧着一只杯子，身后留下一串小爱心。这象征浪漫的邀请、温柔的心意和跟随内心的脚步。`,
`一份浪漫的邀请或美好的提议可能正在路上。你用温柔和真心去行动，充满魅力。跟随内心，但也记得看清现实。`,
`你可能太理想化，或者情绪起伏很大。也可能有人说得很好听却没有行动。看行动，不只听承诺。`,
`可能有人带着真心来追求你，或你想浪漫地表达心意。很适合约会和告白。`,
`小心只会说甜言蜜语却不负责任的人。也别让情绪左右你的判断。`,
`可能收到一个有吸引力的工作邀请或提案。适合做有创意、有热情的事。`,
`计划很美但不太实际，或者做事拖拖拉拉。把想法落实到行动上。`,
`可能有不错的机会出现，但要确认是否实际可行。别只凭感觉做决定。`,
`小心听起来太美好的赚钱机会。查清楚再说，必要时问专业人士。`,
`主动发出一个温暖的邀请/用一个浪漫的小举动表达心意/做一件让你心动的创意小事`,
`看对方的行动，不只听承诺/把一个美好的想法变成具体计划/心情起伏时，先等一等再做决定`],
[`Knight of Cups`,`Romance · Invitation · Follow your heart`,`Follow your heart gently.`,
`The mochi cat rides a wooden rocking horse slowly and gracefully, holding a cup with care. Little hearts trail behind. It stands for a romantic offer, a gentle heart, and following your feelings.`,
`A romantic invitation or a lovely offer may be on its way. You act with kindness and a true heart, and people find you charming. Follow your heart, but also see things clearly.`,
`You may be too dreamy, or your moods go up and down. Someone may say sweet words but not follow through. Watch actions, not only promises.`,
`Someone may come to win your heart with true feelings, or you want to show love in a romantic way. A great time for dates and confessions.`,
`Be careful of someone with sweet words but no follow-through. Don't let moods decide for you.`,
`You may get an attractive job offer or proposal. A good time for creative work you love.`,
`Your plans are lovely but not very practical, or you are slow to act. Turn your ideas into action.`,
`A nice chance may appear, but check if it is realistic. Don't decide on feelings alone.`,
`Be careful of money offers that sound too good. Check first, and ask a professional if needed.`,
`Send someone a warm invitation/Show your feelings with a small romantic act/Do one creative thing that excites you`,
`Watch what people do, not only what they say/Turn one nice idea into a real plan/Wait a bit before deciding when moody`]);

// Queen of Cups
C('Queen',[`圣杯王后`,`温柔・同理心・直觉`,`温柔地照顾心灵。`,
`团子猫戴着皇冠，坐在海边的宝座上，用两只爪子温柔地捧着一只杯子。这象征温柔、同理心和深深的直觉。`,
`你温柔又有同理心，能感受别人的情绪，也懂得照顾人。相信你的直觉，它会带你走对方向。也别忘了用同样的温柔照顾自己。`,
`你可能太在意别人的情绪，忘了照顾自己，或者情绪有点不稳定。先给自己的心一点空间，再去照顾别人。`,
`你在感情里温柔体贴，能给对方很大的安全感。真诚分享心事，关系会更深。`,
`可能付出太多而觉得累，或太敏感容易受伤。好好表达你的需要。`,
`你很会倾听和关心同事，适合需要同理心或创意的工作。相信直觉做判断。`,
`别把别人的情绪全扛在自己身上。设立界限，才能做得更长久。`,
`财务上凭直觉也能做出不错的选择，但别心太软借钱给人。可以把钱花在照顾自己上。`,
`可能因为心软或情绪而乱花钱。花钱前先冷静一下。`,
`安静地听一个朋友说心事/为自己安排一次放松的泡澡或散步/相信直觉做一个小决定`,
`今天先照顾好自己的情绪/学着温柔地说「不」/写下自己真正的需要`],
[`Queen of Cups`,`Gentleness · Empathy · Intuition`,`Gently care for your heart.`,
`The mochi cat wears a crown and sits on a throne by the sea, holding a cup gently with both paws. It stands for kindness, empathy, and deep intuition.`,
`You are gentle and caring. You can feel what others feel and know how to look after people. Trust your intuition, it will guide you well. Remember to treat yourself with the same kindness.`,
`You may care too much about others' feelings and forget yourself, or your mood is a bit unsteady. Give your own heart some space first, then care for others.`,
`You are kind and caring in love, and you make your partner feel safe. Share your feelings honestly and you will grow closer.`,
`You may give too much and feel tired, or be too sensitive and easily hurt. Clearly say what you need.`,
`You are good at listening to and caring for coworkers. Great for work that needs empathy or creativity. Trust your gut.`,
`Don't carry everyone's feelings on your own shoulders. Set limits so you can keep going.`,
`Your intuition can help you make good money choices, but don't lend money just because you feel sorry. Spend some on self-care.`,
`You may spend because of a soft heart or a mood. Calm down before you pay.`,
`Quietly listen to a friend's worries/Plan a relaxing bath or walk for yourself/Trust your gut on one small choice`,
`Take care of your own feelings first today/Practice saying no kindly/Write down what you really need`]);

// King of Cups
C('King',[`圣杯国王`,`平静・成熟・情绪智慧`,`平静中自有力量。`,
`团子猫戴着皇冠，平静地坐在漂浮于海上的宝座上，手里拿着一只杯子，旁边有一条鱼跳出水面。这象征在情绪起伏中仍能保持平静与成熟。`,
`你能在情绪起伏中保持冷静，又不失温柔，这是很成熟的力量。你懂得理解别人，也能做出明智的决定。用平静和善意去面对生活吧。`,
`你可能把情绪压在心里，表面平静却内心不安，或者情绪突然爆发。试着健康地表达感受，不要一个人硬撑。`,
`你在感情里成熟稳重，给对方温暖和安全感。用包容和耐心经营关系。`,
`可能有人情感上比较冷淡，或心事不说出来。多一点坦诚，关系会更亲近。`,
`你在工作中冷静可靠，适合当领导者或帮大家化解矛盾。处理压力的能力会被看见。`,
`工作压力可能让你情绪紧绷。找时间放松，也别把所有事都自己扛。`,
`你理财冷静稳健，不容易被情绪带着走。适合做长期、稳定的规划。`,
`别因为情绪做财务决定。遇到不确定的事，先冷静或询问专业人士。`,
`遇到烦心事先深呼吸三次再回应/耐心倾听一个人的烦恼/为长期目标做一个稳定的计划`,
`把压在心里的感受说给信任的人听/给自己安排一段放松时间/重要决定先缓一缓再做`],
[`King of Cups`,`Calm · Maturity · Emotional wisdom`,`There is strength in calm.`,
`The mochi cat wears a crown and sits calmly on a throne floating on the sea, holding a cup. A fish jumps nearby. It stands for staying calm and mature even when feelings move like waves.`,
`You stay calm when feelings run high, and you are still kind. This is a mature kind of strength. You understand others and can make wise choices. Face life with calm and kindness.`,
`You may be holding feelings inside, calm on the outside but restless inside. Or your feelings may suddenly burst out. Try to share your feelings in a healthy way, and don't carry it all alone.`,
`You are steady and mature in love, and you give warmth and safety. Care for the relationship with patience and understanding.`,
`Someone may seem cold, or keep feelings hidden. A little more honesty will bring you closer.`,
`You are calm and reliable at work. You are a good leader and can help solve conflicts. People will notice how well you handle stress.`,
`Work stress may make you tense. Find time to relax, and don't carry everything alone.`,
`You handle money calmly and wisely, and feelings don't push you around. A good time for steady, long-term plans.`,
`Don't make money choices based on feelings. When unsure, calm down first or ask a professional.`,
`Take three deep breaths before you reply/Listen patiently to someone's worries/Make a steady plan for a long-term goal`,
`Share hidden feelings with someone you trust/Plan some time to relax/Wait a little before a big decision`]);

// Swords (宝剑)
C('Ace',[`宝剑王牌`,`清晰・真相・突破`,`看清，就能前进。`,
`团子猫高高举起一把闪亮的小宝剑，剑尖上戴着一顶金色小王冠，身后的云朵慢慢散开。象征头脑变清晰，真相露出来。`,
`你的思路突然清晰了！一个新想法或一个真相出现，帮你看清局面。现在适合做决定、把话说清楚。`,
`脑子里想法太多，有点乱，暂时看不清方向。先别急着下结论，把事情一件一件理清楚就好。`,
`坦诚的沟通能让关系更清楚。勇敢说出真实的感受，对方会更懂你。`,
`说话可能有点急，或者误会还没解开。慢慢说、好好听，误会会散开的。`,
`新的点子或方案很有力量。适合提出想法、解决难题。`,
`计划还不够清楚，容易卡住。先把目标写下来，再一步步推进。`,
`适合认真看清自己的财务状况，做出清楚的规划。`,
`对钱的事有点糊涂。先整理收支，不清楚的地方可以请教专业人士。`,
`把脑中的想法写在纸上/说出一句一直想说的真话/为一件事做出清楚的决定`,
`列出让你困惑的三件事/今天先只处理一个问题/找信任的人聊聊理清思路`],
[`Ace of Swords`,`Clarity · Truth · Breakthrough`,`See clearly, then move forward.`,
`The mochi cat holds up one shining sword with a tiny golden crown at its tip, and the clouds part behind it. It shows a clear mind and the truth coming to light.`,
`Your thinking suddenly becomes clear. A new idea or a truth appears and helps you see the whole picture. This is a good time to decide and to speak clearly.`,
`Too many thoughts make your mind a little messy, so the way forward is hard to see. Don't rush to a conclusion. Sort things out one at a time.`,
`Honest talk makes love clearer. Share your true feelings with courage, and your partner will understand you better.`,
`Words may come out too fast, or a misunderstanding is still there. Speak slowly and listen well, and it will clear up.`,
`New ideas and plans are strong now. A good time to share ideas and solve problems.`,
`Your plan is not clear enough yet, so you may get stuck. Write down your goal first, then go step by step.`,
`A good time to look clearly at your money and make a clear plan.`,
`You feel a bit confused about money. Track what comes in and goes out, and ask a professional if needed.`,
`Write your thoughts down on paper/Say one true thing you have held back/Make one clear decision today`,
`List three things that confuse you/Handle just one problem today/Talk it through with someone you trust`]);

C('2',[`宝剑二`,`抉择・僵局・平衡`,`摘下眼罩，看看心里。`,
`团子猫戴着软软的眼罩，把两把交叉的小宝剑抱在胸前，头顶是弯弯的月亮，身后是平静的大海。象征面对选择时，暂时把心关起来。`,
`你正站在两个选择之间，有点不想面对。暂时保持平静没关系，但事情不会自己消失。试着打开心，听听自己真正想要什么。`,
`拖了很久的决定开始有压力了，也可能新的信息让你看清了一些事。这是做选择的好时机，不用追求完美答案。`,
`你可能在两个人或两种想法之间犹豫，或者在逃避一个话题。温柔地面对它，比一直回避更轻松。`,
`压在心里的话终于想说出来了。坦诚一点，关系反而会更轻松。`,
`工作上遇到两难的选择，或者和别人僵持不下。先收集更多信息，再做决定。`,
`拖延让事情越积越多。给自己定一个期限，勇敢选一个方向。`,
`在两个花钱或理财的选项之间犹豫。列出利弊，会更容易选择。`,
`一直不想看的账单或财务问题该处理了。早点面对，压力会更小。`,
`把两个选择的优缺点写下来/安静地问自己真正想要什么/给这个决定定一个期限`,
`今天就做一个小决定/把逃避的话题说出来/向信任的人要一点建议`],
[`Two of Swords`,`Choice · Stalemate · Balance`,`Take off the blindfold and look inside.`,
`The mochi cat wears a soft blindfold and holds two crossed swords against its chest, under a crescent moon by a calm sea. It shows closing your heart for a while when a choice feels hard.`,
`You are standing between two choices and don't really want to face them. Staying calm for now is fine, but the problem won't go away by itself. Open your heart and listen to what you really want.`,
`A decision you have put off is starting to feel heavy, or new information helps you see more. This is a good time to choose. You don't need a perfect answer.`,
`You may be unsure between two people or two ideas, or you may be avoiding a topic. Facing it gently is easier than avoiding it forever.`,
`You are finally ready to say what has been on your mind. Being honest will make the relationship lighter.`,
`You face a hard choice at work, or you and someone else are stuck. Gather more information, then decide.`,
`Putting things off makes them pile up. Give yourself a deadline and bravely choose a direction.`,
`You are unsure between two ways to spend or save. Listing the pros and cons will help.`,
`It is time to look at the bills or money problems you have avoided. Facing them early means less stress.`,
`Write the pros and cons of both choices/Quietly ask yourself what you really want/Set a deadline for this decision`,
`Make one small decision today/Bring up the topic you avoided/Ask someone you trust for advice`]);

C('3',[`宝剑三`,`心痛・失落・释放`,`允许自己难过一下。`,
`一朵小雨云在一颗大大的粉色爱心上飘着细雨，爱心后面有三把小宝剑，下面的团子猫眼角挂着一颗小眼泪。象征心里受伤，但雨总会停。`,
`你可能经历了一些让人难过的事，比如失望、分开或伤人的话。难过是正常的，眼泪能帮你把心里的痛慢慢释放。雨下完了，天会放晴。`,
`伤口正在慢慢愈合，你开始放下过去的痛。也可能你还在压着情绪，试着温柔地让它流出来。`,
`感情里可能有伤心或误会。给自己时间难过，也给彼此空间好好说开。`,
`心里的伤正在好转。原谅和放下，会让你轻松很多。`,
`工作上可能听到让人难受的话，或者结果不如预期。先照顾好心情，再想下一步。`,
`失望的感觉在慢慢过去。从这次经验中学到东西，你会更强大。`,
`可能有一点小损失或失望。别太自责，重新规划就好。`,
`财务上的压力在慢慢减轻。一步一步来，会越来越好。`,
`允许自己好好哭一场/写下让你难过的事/找一个温暖的朋友聊聊`,
`为自己做一件温柔的小事/试着原谅一点点/出门散散步换换心情`],
[`Three of Swords`,`Heartache · Loss · Release`,`It's okay to feel sad.`,
`A rain cloud drizzles over a big pink heart with three little swords behind it, and the mochi cat below has a small tear. It shows a hurt heart, but every rain stops.`,
`You may be going through something sad, like disappointment, a breakup, or hurtful words. Feeling sad is normal, and tears help the pain leave slowly. After the rain, the sky clears.`,
`Your heart is healing, and you are starting to let go of old pain. Or you may still be holding your feelings in. Gently let them out.`,
`There may be sadness or a misunderstanding in love. Give yourself time to feel it, and give each other space to talk it out.`,
`The hurt in your heart is getting better. Forgiving and letting go will make you feel much lighter.`,
`You may hear hard words at work, or results are not what you hoped. Take care of your feelings first, then think about the next step.`,
`The disappointment is slowly passing. Learn from this, and you will grow stronger.`,
`There may be a small loss or disappointment. Don't blame yourself too much. Just make a new plan.`,
`Money stress is slowly getting lighter. Go step by step, and things will improve.`,
`Let yourself have a good cry/Write down what made you sad/Talk with a warm, kind friend`,
`Do one gentle thing for yourself/Try to forgive just a little/Take a walk to refresh your mood`]);

C('4',[`宝剑四`,`休息・恢复・安静`,`先好好休息吧。`,
`团子猫在长椅上安安静静地睡午觉，头上飘着「zz」，墙上挂着三把小宝剑，还有一把放在长椅下面。象征放下烦恼，让身心充电。`,
`现在最需要的是休息。暂时放下烦恼，让身体和心都充充电。安静下来，答案会自己慢慢浮现。`,
`你休息得不够，开始觉得累或烦躁。也可能你已经休息好了，准备重新出发。听听身体的声音。`,
`感情需要一点安静的空间。彼此不用一直说话，陪伴就很好。`,
`一直不休息会让你对感情失去耐心。先照顾好自己，再好好相处。`,
`工作太累了，适合短暂休息或放慢节奏。充好电，你会做得更好。`,
`可能有点过劳，或者休息够了想回去工作。慢慢恢复节奏就好。`,
`财务上暂时不用做大动作，保持稳定就好。`,
`别因为疲惫而冲动花钱。休息好再做财务决定。`,
`今晚早点睡觉/关掉手机安静半小时/给自己安排一个休息日`,
`留意身体发出的疲累信号/慢慢回到日常节奏/把待办事项减少一点`],
[`Four of Swords`,`Rest · Recovery · Quiet`,`Rest well first.`,
`The mochi cat naps peacefully on a bench with "zz" floating up, three swords hung on the wall and one resting under the bench. It shows putting worries down and letting your body and mind recharge.`,
`What you need most now is rest. Put your worries down for a while and let your body and mind recharge. When you are quiet, answers will slowly come.`,
`You are not resting enough, so you feel tired or restless. Or you have rested well and are ready to start again. Listen to your body.`,
`Love needs some quiet space. You don't need to talk all the time. Just being together is enough.`,
`Never resting can make you lose patience in love. Take care of yourself first, then you can enjoy time together.`,
`Work has been tiring. A short break or a slower pace will help. Once you recharge, you will do even better.`,
`You may be overworked, or you have rested and want to get back to work. Return to your rhythm slowly.`,
`No big money moves are needed now. Keeping things steady is enough.`,
`Don't spend on impulse because you feel tired. Rest first, then make money decisions.`,
`Go to bed early tonight/Turn off your phone for 30 minutes/Plan a full day of rest`,
`Notice when your body feels tired/Ease back into your daily routine/Cut your to-do list a little`]);

C('5',[`宝剑五`,`争执・输赢・放下`,`赢了道理，别输了心。`,
`团子猫抱着三把小宝剑，露出一点小得意的笑，另外两把宝剑掉在地上，头上飘着一朵刮风的小云。象征争赢了，却可能失去更重要的东西。`,
`你可能刚经历一场争执，赢了却不太开心。想想这场输赢是不是真的值得。有时候放下比赢更重要。`,
`紧张的气氛在慢慢缓和，你开始想和好或放下过去的争执。这是修复关系的好机会。`,
`吵架时别只想着谁对谁错。多关心对方的感受，关系才会更暖。`,
`你们开始想要和好了。先说一句「对不起」或「谢谢」，会很有帮助。`,
`工作上可能有竞争或冲突。公平做事，别为了小输赢伤了合作关系。`,
`冲突正在平息。主动沟通，可以把关系修复回来。`,
`钱的事上可能有小争执。说清楚、算清楚，比争输赢更重要。`,
`和钱有关的矛盾在缓和。可以心平气和地重新谈一谈。`,
`想想这场争执值不值得/先听完对方的想法/主动退一步让气氛缓和`,
`给对方发一句和好的话/放下一件过去的不愉快/找时间心平气和地聊聊`],
[`Five of Swords`,`Conflict · Winning · Letting go`,`Win the point, keep the heart.`,
`The mochi cat holds three swords with a sly little smile, while two swords lie on the ground under a windy cloud. It shows winning a fight but maybe losing something more important.`,
`You may have just had an argument and won, but you don't feel happy. Ask yourself if this win was really worth it. Sometimes letting go matters more than winning.`,
`The tension is easing, and you start to want peace or to let go of an old fight. This is a good chance to repair things.`,
`In an argument, don't only think about who is right. Care about your partner's feelings, and love will feel warmer.`,
`You both want to make up. A simple "sorry" or "thank you" can help a lot.`,
`There may be competition or conflict at work. Be fair, and don't hurt teamwork over small wins.`,
`The conflict is calming down. Reach out and talk, and you can repair the relationship.`,
`There may be a small fight about money. Being clear and fair matters more than winning.`,
`A money conflict is easing. You can calmly talk about it again.`,
`Ask if this fight is worth it/Listen fully before you reply/Take one step back to calm things`,
`Send a kind message to make peace/Let go of one old hurt/Find time for a calm talk`]);

C('6',[`宝剑六`,`过渡・离开・平静`,`慢慢驶向平静的水面。`,
`团子猫坐在一艘小船里，船上立着六把小宝剑，正慢慢滑过平静的水面。象征离开难过的地方，驶向更好的未来。`,
`你正在离开一段困难的时期，慢慢走向更平静的地方。也许还带着一点旧的烦恼，但方向是对的。前面会越来越好。`,
`你可能还放不下过去，或者有些事还没处理完。别着急，先把手上的事处理好，再继续出发。`,
`关系正在走出低谷，变得更平静。也可能你在慢慢放下一段旧感情。`,
`旧的情绪还在影响你。好好告别过去，才能真正向前走。`,
`工作上可能有转变，比如换环境或换方向。这个变化会带你去更好的地方。`,
`想改变却还没准备好，或者有旧的问题还没解决。先处理好再往前走。`,
`财务状况正在慢慢好转，走出最难的时候了。`,
`过去的财务问题还需要收尾。一件件整理清楚，就能轻松前进。`,
`想想你想去的方向/放下一件让你累的事/为新的阶段做一个小计划`,
`列出还没处理完的事/对过去说一句温柔的再见/找人帮你一起整理`],
[`Six of Swords`,`Transition · Moving on · Calm`,`Glide toward calmer water.`,
`The mochi cat sits in a small boat with six swords standing in it, gliding across calm water. It shows leaving a hard place and moving toward a better future.`,
`You are leaving a hard time and slowly moving to a calmer place. You may still carry a few old worries, but you are going the right way. Things ahead will keep getting better.`,
`You may still be holding on to the past, or something is not finished yet. Don't rush. Finish what is in your hands, then keep going.`,
`The relationship is coming out of a low point and getting calmer. Or you are slowly letting go of an old love.`,
`Old feelings still affect you. Say a proper goodbye to the past so you can truly move on.`,
`There may be a change at work, like a new place or a new direction. This change will take you somewhere better.`,
`You want to change but are not ready yet, or an old problem is not solved. Deal with it first, then move on.`,
`Your money situation is slowly getting better. The hardest part is behind you.`,
`Old money issues still need to be closed out. Sort them out one by one, and you can move forward lightly.`,
`Think about where you want to go/Let go of one thing that tires you/Make a small plan for your new chapter`,
`List the things still unfinished/Say a gentle goodbye to the past/Ask someone to help you sort things`]);

C('7',[`宝剑七`,`策略・隐瞒・小聪明`,`真诚才是最好的策略。`,
`团子猫踮着脚、带着狡猾的小笑容，抱着五把小宝剑悄悄溜走，在帐篷旁边留下两把。象征耍小聪明或有事瞒着，也提醒你用对策略。`,
`有人可能没有完全说实话，也可能是你自己想走捷径。聪明的策略很好，但别失去真诚。做事光明正大，心里才会踏实。`,
`藏着的事情可能会被说出来，或者你决定坦白。说出真相会让你轻松很多，这是重新开始的机会。`,
`感情里可能有没说出口的话或小秘密。坦诚相待，比猜来猜去更好。`,
`有些事终于说开了。虽然有点尴尬，但关系会变得更真实。`,
`工作上要聪明做事，但别走捷径或耍手段。也留意合同和细节，保护好自己。`,
`你可能想坦白一个错误，或者真相被发现了。诚实面对，事情会变好。`,
`留意财务上的小陷阱，交易前看清楚条款。`,
`之前没处理好的钱的问题该面对了。说清楚、改过来就好。`,
`签字前把细节再看一遍/想想有没有更光明的办法/保护好重要的资料和密码`,
`勇敢承认一个小错误/把藏着的话说出来/重新诚实地规划一次`],
[`Seven of Swords`,`Strategy · Secrets · Sneakiness`,`Honesty is the best strategy.`,
`The mochi cat tiptoes away with a sneaky grin, carrying five swords, leaving two behind near a tent. It shows sneaky moves or hidden things, and reminds you to use the right strategy.`,
`Someone may not be telling the full truth, or you may want to take a shortcut. Smart plans are good, but don't lose honesty. When you act openly, you feel at peace.`,
`Something hidden may come out, or you decide to tell the truth. Telling the truth will make you feel much lighter. This is a chance to start fresh.`,
`There may be unspoken words or small secrets in love. Being honest is better than guessing.`,
`Something is finally out in the open. It may feel awkward, but the relationship will become more real.`,
`Work smart, but don't take shortcuts or play tricks. Check contracts and details to protect yourself.`,
`You may want to admit a mistake, or the truth has come out. Face it honestly, and things will get better.`,
`Watch for small money traps. Read the terms carefully before any deal.`,
`It is time to face a money issue you didn't handle well. Be clear and fix it.`,
`Check the details again before signing/Look for a more open way to do it/Protect your important files and passwords`,
`Bravely admit one small mistake/Say what you have been hiding/Make an honest new plan`]);

C('8',[`宝剑八`,`受困・自我限制・找出口`,`绳子其实是松的。`,
`团子猫戴着眼罩，身上松松地绕着一条丝带，周围立着八把小宝剑。丝带是松的，只要轻轻一动就能出来。象征困住你的，常常是自己的想法。`,
`你可能觉得被困住了，好像没有出路。其实很多限制来自担心和想法，并没有那么牢固。摘下眼罩看一看，出口就在附近。`,
`你开始挣脱束缚，看见新的可能。也可能你又被担心拉回去了，提醒自己：你比想象中更自由。`,
`你可能觉得在感情里很被动，不知道怎么办。试着说出需要，局面会改变。`,
`你开始看清感情里的问题，也有了改变的勇气。一步一步来就好。`,
`工作上觉得被限制或没有选择。换个角度想，可能还有你没看到的路。`,
`你开始走出困境，找到新的方法。继续相信自己的能力。`,
`可能觉得钱的事让你动弹不得。先从一个小小的改变开始。`,
`财务压力正在松开，你找到了一些解决办法。`,
`写下一个困住你的想法/问自己「真的没有别的路吗？」/向别人求助一次`,
`为自己的小进步鼓掌/尝试一个新的做法/提醒自己「我可以选择」`],
[`Eight of Swords`,`Stuck · Self-limits · Finding a way out`,`The ribbon is actually loose.`,
`The mochi cat wears a blindfold and is loosely wrapped in a ribbon, with eight swords standing around it. The ribbon is loose, so it can get free. It shows that what traps you is often your own thoughts.`,
`You may feel stuck, like there is no way out. But many limits come from worry and thoughts, and they are not that strong. Take off the blindfold and look. The way out is close.`,
`You are starting to break free and see new chances. Or worry is pulling you back again. Remind yourself that you are freer than you think.`,
`You may feel helpless in love and not know what to do. Try saying what you need, and things will change.`,
`You are starting to see the problem in love clearly, and you have the courage to change. Go one step at a time.`,
`You feel limited at work, like you have no choice. Look from another angle. There may be a path you haven't seen.`,
`You are getting out of a hard spot and finding new ways. Keep trusting your skills.`,
`You may feel stuck about money. Start with one small change.`,
`Money pressure is loosening, and you are finding some solutions.`,
`Write down one thought that traps you/Ask yourself, "Is there really no other way?"/Ask someone for help once`,
`Cheer for your small progress/Try one new way of doing things/Remind yourself, "I can choose"`]);

C('9',[`宝剑九`,`焦虑・失眠・担心`,`担心不等于事实。`,
`夜里，团子猫坐在床上，睁着担心的大眼睛，身后的墙上一排排挂着九把小宝剑。象征夜里想太多，担心被放大了。`,
`你可能最近很焦虑，晚上想太多睡不好。很多担心在夜里会被放大，其实事情没有那么糟。说出来、写下来，心会轻一点。`,
`担心正在慢慢减少，你开始看到希望。也可能你把烦恼藏得太深，试着和信任的人说一说。`,
`你可能对感情有很多担心，想太多。和对方聊一聊，很多烦恼就会消失。`,
`感情上的担心在慢慢放下。你发现事情比想象中好。`,
`工作压力让你担心睡不好。把问题列出来，一个一个解决。`,
`压力正在减轻，你找到了应对的方法。如果一直很焦虑，可以和专业人士聊聊。`,
`可能对钱的事很担心。先算清楚实际情况，往往没有想象中那么糟。`,
`财务上的担心在减少，你开始有了一些安全感。`,
`睡前把担心写在纸上/睡前一小时放下手机/和信任的人说说你的烦恼`,
`留意一件今天顺利的小事/需要时找专业人士聊聊/给自己一个温暖的拥抱`],
[`Nine of Swords`,`Anxiety · Sleepless nights · Worry`,`Worry is not the same as fact.`,
`At night, the mochi cat sits up in bed with wide, worried eyes, and nine swords hang in rows on the wall behind it. It shows thinking too much at night and worries getting bigger.`,
`You may feel anxious lately and can't sleep well because you think too much. Worries feel bigger at night, but things are not as bad as they seem. Talk about them or write them down, and your heart will feel lighter.`,
`Your worries are slowly getting smaller, and you start to see hope. Or you are hiding your worries too deeply. Try talking with someone you trust.`,
`You may worry a lot about love and overthink. Talk with your partner, and many worries will fade.`,
`You are slowly letting go of worries in love. Things are better than you thought.`,
`Work stress keeps you up at night. List the problems and solve them one by one.`,
`Stress is easing, and you are finding ways to cope. If you feel anxious for a long time, talk with a professional.`,
`You may worry about money. Look at the real numbers first. It is often not as bad as you think.`,
`Money worries are getting smaller, and you start to feel safer.`,
`Write your worries on paper before bed/Put your phone away an hour before sleep/Share your worries with someone you trust`,
`Notice one small thing that went well today/Talk with a professional if needed/Give yourself a warm hug`]);

C('10',[`宝剑十`,`结束・最低点・重新开始`,`最难的已经过去了。`,
`十把小宝剑在地平线上排成一排，团子猫累得躺下来休息，身后的太阳正在升起。象征一段辛苦的事情结束了，最难的部分已经过去。`,
`一段辛苦的经历走到了终点，你可能觉得很累。但这也意味着最难的时候已经过去，接下来只会越来越好。好好休息，新的一天正在开始。`,
`你正在从低谷中慢慢站起来。也可能你还不想接受结束，放手之后，你会发现轻松很多。`,
`一段关系或旧模式可能结束了。难过之后，你会迎来更适合你的感情。`,
`你正在从感情的伤痛中走出来，心慢慢恢复了。`,
`工作上一件辛苦的事结束了，或者到了需要改变的时候。休息一下，再重新出发。`,
`你正在慢慢恢复，重新找回力量。一步一步来就好。`,
`财务可能到了最低点，但也是重新规划的开始。需要时可以请专业人士帮忙。`,
`财务正在慢慢恢复，继续保持好的习惯。`,
`今天好好休息一下/写下这段经历教会你的事/为新的开始定一个小目标`,
`接受结束，轻轻放手/每天为自己做一件小事/向身边的人寻求支持`],
[`Ten of Swords`,`Ending · Lowest point · New start`,`The hardest part is over.`,
`Ten swords stand in a row on the horizon, and the mochi cat lies down tired, while the sun rises behind them. It shows a hard time ending, and the hardest part is over.`,
`A hard experience has come to an end, and you may feel very tired. But this also means the worst is behind you, and things can only get better. Rest well. A new day is starting.`,
`You are slowly getting up from a low point. Or you don't want to accept the ending yet. Once you let go, you will feel much lighter.`,
`A relationship or an old pattern may be ending. After the sadness, a love that fits you better will come.`,
`You are healing from a love hurt, and your heart is slowly recovering.`,
`A hard project at work has ended, or it is time for a change. Rest a little, then start again.`,
`You are slowly recovering and finding your strength again. Go step by step.`,
`Your money may be at a low point, but it is also a fresh start for planning. Ask a professional for help if needed.`,
`Your finances are slowly recovering. Keep up your good habits.`,
`Take a good rest today/Write down what this taught you/Set one small goal for a new start`,
`Accept the ending and gently let go/Do one small kind thing daily/Ask the people around you for support`]);

C('Page',[`宝剑侍从`,`好奇・敏锐・新想法`,`保持好奇，多问一句。`,
`团子猫戴着灰蓝色的贝雷帽，举起一把小宝剑，警觉又好奇，风吹着树叶在身边打转。象征头脑灵活，对新知识充满好奇。`,
`你的头脑很活跃，对新事物充满好奇。适合学习、提问和收集信息。保持敏锐，但说话前想一想。`,
`可能有点说话太快，或者听到了一些八卦。先确认事实，再说出口。也别想太多却不行动。`,
`你对对方很好奇，想多了解。真诚地聊天，比猜测更有用。`,
`可能有小误会或话说得太直。说话温柔一点，关系会更好。`,
`适合学习新技能、提出新想法。多问问题，会让你进步很快。`,
`计划想得多做得少，或者消息传得太快。先确认信息，再行动。`,
`适合学习理财知识，多做功课再决定。`,
`别听信小道消息做财务决定，先查清楚再说。`,
`学一个新知识或新技能/大胆问一个好问题/记下今天的一个新想法`,
`说话前先停三秒/先确认消息再转发/把一个想法真正做一点`],
[`Page of Swords`,`Curiosity · Alertness · New ideas`,`Stay curious and ask more.`,
`The mochi cat in a gray-blue beret holds up a sword, alert and curious, as the wind blows leaves around. It shows a quick mind that is curious about new things.`,
`Your mind is active and curious about new things. A good time to learn, ask questions, and gather information. Stay sharp, but think before you speak.`,
`You may talk too fast, or hear some gossip. Check the facts before you say anything. Also, don't think too much without acting.`,
`You are curious about someone and want to know them better. Honest talk is better than guessing.`,
`There may be a small misunderstanding, or words that are too direct. Speak more gently, and things will go better.`,
`A good time to learn new skills and share new ideas. Asking questions will help you grow fast.`,
`You plan a lot but do little, or news spreads too fast. Check the facts, then act.`,
`A good time to learn about money. Do your homework before you decide.`,
`Don't make money choices based on rumors. Check the facts first.`,
`Learn one new thing or skill/Ask one good question bravely/Write down one new idea today`,
`Pause three seconds before speaking/Check news before you share it/Take one real step on an idea`]);

C('Knight',[`宝剑骑士`,`行动・果断・冲劲`,`快，但要看清方向。`,
`团子猫骑着一匹木头摇摇马全速冲刺，小宝剑指向前方，身后拉出长长的速度线。象征想法一出现就马上行动的冲劲。`,
`你充满干劲，想快速前进、马上行动。这股果断很有力量，能帮你突破难关。只要记得看清方向，别伤到别人。`,
`可能太急了，冲得太快而忽略细节或别人的感受。放慢一点，先想清楚再出发。`,
`你可能很直接地表达感情，很有魅力。但也要照顾对方的节奏。`,
`说话太冲或太急，容易引起争执。慢下来，好好沟通。`,
`适合果断推进计划，快速解决问题。你的行动力会被看见。`,
`太急于求成，容易出错。先检查计划，再加速。`,
`有想法就行动，但大额支出前要先想清楚。`,
`别冲动消费或匆忙做财务决定，先冷静一下。`,
`今天就开始做一件拖着的事/把想法清楚地说出来/为目标定一个快速的小步骤`,
`做决定前先深呼吸/听完别人的意见再出发/检查一遍细节再行动`],
[`Knight of Swords`,`Action · Decisiveness · Drive`,`Go fast, but watch your direction.`,
`The mochi cat rides a wooden rocking horse at full speed, sword pointed forward, with speed lines behind. It shows the drive to act as soon as an idea comes.`,
`You are full of energy and want to move fast and act now. This strong drive can help you break through hard things. Just remember to check your direction and not hurt others.`,
`You may be in too much of a hurry and miss details or other people's feelings. Slow down a little. Think it through before you go.`,
`You may share your feelings very directly, which is attractive. But also respect your partner's pace.`,
`Words that are too sharp or too fast can start a fight. Slow down and talk well.`,
`A good time to push plans forward and solve problems fast. People will notice how much you get done.`,
`Rushing for results can lead to mistakes. Check your plan first, then speed up.`,
`Act on your ideas, but think carefully before big spending.`,
`Don't shop on impulse or rush money choices. Calm down first.`,
`Start one task you have put off today/Say your idea clearly/Set one quick small step for your goal`,
`Take a deep breath before deciding/Hear others out before you go/Check the details once before acting`]);

C('Queen',[`宝剑王后`,`清醒・独立・坦诚`,`温柔地说真话。`,
`团子猫戴着王冠，一只爪子竖直举着小宝剑，另一只爪子坦然张开，身边飞着小蝴蝶。象征头脑清醒、界线清楚，同时心是开放的。`,
`你头脑清醒，懂得看清事实，也能坦诚表达。你有清楚的界线，不轻易被情绪左右。用智慧和温柔说真话，会让人信服。`,
`可能说话太直接、太冷淡，或者把心关起来了。清醒很好，也记得留一点温度给自己和别人。`,
`你知道自己想要什么，也能清楚表达。坦诚又温柔的沟通，会让感情更健康。`,
`可能太挑剔或把心关起来了。试着放下防备，表达一点柔软。`,
`你判断清楚、做事有条理，是可靠的人。适合沟通、谈判和做决定。`,
`说话可能太尖锐，让人觉得冷。多一点理解，合作会更顺利。`,
`理性管理钱，看清每一笔开支，很适合做预算。`,
`别因为太谨慎而错过需要的东西，平衡就好。`,
`清楚地说出你的一个需要/为自己设定一条健康的界线/理性地整理一件复杂的事`,
`说话时多加一点温柔/试着说出自己的感受/对别人多一点理解`],
[`Queen of Swords`,`Clear mind · Independence · Honesty`,`Speak the truth gently.`,
`The mochi cat wears a crown and holds a sword upright in one paw, the other paw raised openly, with little butterflies nearby. It shows a clear mind and clear boundaries, with an open heart.`,
`Your mind is clear. You can see the facts and speak honestly. You have clear boundaries and are not easily moved by emotions. Speaking the truth with wisdom and kindness makes people trust you.`,
`You may speak too directly or coldly, or close your heart. A clear mind is good, but keep some warmth for yourself and others.`,
`You know what you want and can say it clearly. Honest and gentle talk makes love healthier.`,
`You may be too picky or closed off. Try to lower your guard and show a softer side.`,
`You see clearly and work in an organized way. People can count on you. A good time to talk, negotiate, and decide.`,
`Your words may be too sharp and feel cold. A little more understanding will make teamwork smoother.`,
`Manage money with a clear head and check every cost. A great time to make a budget.`,
`Don't be so careful that you miss what you need. Find a balance.`,
`Clearly say one thing you need/Set one healthy boundary for yourself/Calmly sort out one messy matter`,
`Add more kindness to your words/Try sharing how you feel/Show others a bit more understanding`]);

C('King',[`宝剑国王`,`理性・公正・权威`,`冷静思考，公平决定。`,
`团子猫戴着王冠，坐在酷酷的灰蓝色王座上，竖直握着小宝剑，表情冷静又认真。象征用理性和公正做判断。`,
`你冷静、理性，能看清事情的本质。适合做重要的决定，用公平和清楚的规则处理问题。你的判断值得信任。`,
`可能太固执或太严格，只讲道理不讲感受。也可能有人在用权力压人。保持公正，也要多一点同理心。`,
`你在感情里成熟、可靠，懂得讲道理。也别忘了表达你的爱和温柔。`,
`可能太冷静或太爱控制，让对方有距离感。多听听对方的心声。`,
`适合担任领导、制定规则或做专业判断。你的清晰思路会带领大家。`,
`可能太死板或不听意见。试着打开心，听听不同的声音。`,
`理性规划财务，很适合做长期计划。需要时可以请专业人士给建议。`,
`别太固执于一种做法，财务计划也可以灵活调整。`,
`为一个重要决定列出事实/用公平的方式处理一件事/请教一位有经验的专业人士`,
`多听一个不同的意见/在讲道理时也说说感受/放下一点控制，试着信任别人`],
[`King of Swords`,`Logic · Fairness · Authority`,`Think calmly, decide fairly.`,
`The mochi cat wears a crown and sits on a cool gray-blue throne, holding a sword upright with a calm, serious face. It shows making judgments with logic and fairness.`,
`You are calm and logical, and you can see the heart of the matter. A good time for big decisions and for handling problems with fair, clear rules. Your judgment can be trusted.`,
`You may be too stubborn or too strict, using only logic and ignoring feelings. Or someone may be using power over others. Stay fair, and add more kindness.`,
`You are mature and dependable in love, and you think things through. Don't forget to show your love and warmth too.`,
`You may be too cool or too controlling, which makes your partner feel distant. Listen more to their heart.`,
`A good time to lead, set rules, or give expert advice. Your clear thinking will guide the team.`,
`You may be too rigid or not open to ideas. Open your mind and listen to different voices.`,
`Plan your money with logic. A great time for long-term plans. Ask a professional for advice if needed.`,
`Don't hold too tightly to one way. Your money plan can change when needed.`,
`List the facts for one big decision/Handle one matter in a fair way/Ask an experienced professional for advice`,
`Listen to one different opinion/Share feelings along with your reasons/Let go of some control and trust others`]);

// Pentacles (星币)
C('Ace',[`星币王牌`,`机会・财富・踏实开始`,`抓住眼前的好机会。`,
`团子猫捧着一枚大大的金色星币，身后是开满鲜花的绿色花园拱门。象征一个实实在在的新机会，正等你走进去。`,
`一个看得见、摸得着的新开始来了！可能是新工作、新收入，或一个好计划的种子。只要踏实行动，它就能慢慢长大。`,
`机会还在，只是你可能没注意到，或者计划还不够落地。先把基础打好，再慢慢开始，也完全来得及。`,
`感情有稳定、踏实的新开始，适合认真经营一段关系。`,
`感情需要更多实际的行动，而不只是说说。从小小的关心做起吧。`,
`新的工作机会或项目出现，很值得认真把握。`,
`机会可能来得慢一点，或者计划还需要更具体。先做好准备。`,
`财运有好的开始，可能有新的收入来源。`,
`花钱前多想一想，先把预算规划清楚。`,
`写下一个想实现的小目标/认真看看身边的新机会/为未来存下一笔小钱`,
`检查一下计划是否够具体/先打好基础再开始/列一份简单的花费清单`],
[`Ace of Pentacles`,`Opportunity · Wealth · Solid start`,`Take the good chance in front of you.`,
`The mochi cat holds one big golden star coin in front of a green garden arch full of flowers. It shows a real new chance, waiting for you to walk in.`,
`A real, practical new start is here. It may be a new job, new income, or the seed of a good plan. If you take steady action, it will slowly grow.`,
`The chance is still here, but you may not see it, or your plan is not practical yet. Build a strong base first. It is not too late to start slowly.`,
`Love has a steady, solid new start. A good time to build a relationship with care.`,
`Love needs more real action, not just words. Start with small acts of care.`,
`A new job or project appears. It is worth taking seriously.`,
`A chance may come a little slowly, or your plan needs more detail. Get ready first.`,
`Money has a good start, maybe with a new source of income.`,
`Think before you spend, and make a clear budget first.`,
`Write down one small goal/Look closely at new chances around you/Save a little money for the future`,
`Check if your plan is clear enough/Build a strong base before starting/Make a simple list of your spending`]);

C('2',[`星币二`,`平衡・灵活・多任务`,`轻松保持平衡。`,
`团子猫开心地抛接两枚星币，星币之间连着一条绿色的无限丝带，身后是起伏的波浪和小船。象征在变化中灵活地保持平衡。`,
`你同时在处理好几件事，但你做得比自己想的更好！保持轻松和灵活，就能在变化中找到平衡。`,
`事情有点多，节奏开始乱了。这是一个提醒：放下一些不重要的事，先照顾最重要的。`,
`感情和生活需要好好平衡。留一点时间给对方，关系会更稳。`,
`太忙让感情被冷落了。试着重新安排时间，陪陪对方。`,
`多项任务同时进行，你有能力灵活应对。`,
`工作太多太杂，容易出错。先排好优先顺序。`,
`收入和支出需要平衡，灵活调整预算就没问题。`,
`钱的进出有点乱，花点时间整理一下账目。`,
`列出今天最重要的三件事/给自己留一点休息时间/整理一下本月的收支`,
`放下一件不重要的任务/请别人帮忙分担一些事/把账单和日程整理清楚`],
[`Two of Pentacles`,`Balance · Flexibility · Multitasking`,`Stay balanced and light.`,
`The mochi cat happily juggles two coins joined by a green infinity ribbon, with waves and little boats behind. It shows staying balanced and flexible while things change.`,
`You are handling many things at once, and you are doing better than you think. Stay light and flexible, and you will find balance in the middle of change.`,
`There is a lot going on, and your rhythm feels messy. This is a reminder to drop some small things and take care of the most important ones first.`,
`Love and daily life need good balance. Save some time for your partner, and the relationship will feel steady.`,
`Being too busy leaves love feeling ignored. Try to plan your time again and be there for each other.`,
`You are working on many tasks, and you can handle them with flexibility.`,
`Too much work at once can cause mistakes. Decide what comes first.`,
`Income and spending need balance. Small changes to your budget will help.`,
`Money in and money out feels messy. Take some time to sort out your accounts.`,
`List your three most important tasks today/Give yourself some rest time/Review your income and spending this month`,
`Drop one task that is not important/Ask someone to share the work/Organize your bills and schedule`]);

C('3',[`星币三`,`合作・技能・团队`,`一起把事情做好。`,
`两只团子猫在刻着三枚星币的石拱门下合作，一只拿着锤子，一只拿着计划图。象征团队合作，大家各自发挥所长。`,
`团队合作的力量正在发挥作用！每个人都贡献自己的技能，事情就能做得又好又扎实。你的能力也会被别人看见。`,
`合作有点不顺，可能是沟通不够或分工不清。停下来对齐一下目标，就能重新顺利起来。`,
`两个人一起为共同目标努力，关系越来越扎实。`,
`彼此的想法不太一致。坐下来好好聊聊你们想要的未来。`,
`团队合作顺利，你的专业能力受到认可。`,
`分工不清或沟通不畅。主动说明自己的想法和需要。`,
`通过合作或专业技能，可以带来稳定的收入。`,
`合作中的钱要讲清楚，避免误会。`,
`和同事或伙伴开一次小会/主动分享你的专业想法/请教一位有经验的人`,
`把分工和目标写清楚/认真听听队友的意见/把合作中的金钱约定讲明白`],
[`Three of Pentacles`,`Teamwork · Skill · Collaboration`,`Do good work together.`,
`Two mochi cats work together under a stone arch with three coins on it. One holds a hammer and one holds a plan. It shows teamwork, where everyone uses their own strengths.`,
`The power of teamwork is working for you. When everyone brings their skills, the work becomes strong and good. Others will also see what you can do.`,
`Working together feels a bit hard. Maybe there is not enough talking, or the roles are not clear. Stop and agree on the goal again, and things will flow better.`,
`You two work toward a shared goal, and the relationship grows stronger.`,
`Your ideas are not quite the same. Sit down and talk about the future you both want.`,
`Teamwork goes well, and people value your skills.`,
`Roles are unclear or communication is weak. Share your ideas and needs clearly.`,
`Teamwork or your special skills can bring steady income.`,
`Be clear about money when you work with others, so there are no misunderstandings.`,
`Have a short meeting with your team/Share your expert ideas/Ask an experienced person for advice`,
`Write down clear roles and goals/Listen carefully to your teammates/Make money agreements clear with partners`]);

C('4',[`星币四`,`稳定・守护・控制`,`守住，但别抓太紧。`,
`团子猫紧紧抱着一枚星币，头上顶着一枚，脚下踩着两枚，身后是一座小镇。象征想要守住安全感，也提醒别抓得太紧。`,
`你很重视安全感，努力守住自己拥有的东西。这份稳定很珍贵，但也要留意，别因为害怕失去而把自己关起来。`,
`你可能抓得太紧，或者花钱太随意。这是一个调整的机会：找到守护和放松之间的平衡点。`,
`你很想守护这段关系，但太多控制会让对方有压力。试着多一点信任。`,
`感情里有些放不下的担心。慢慢打开心，关系会更轻松。`,
`工作稳定，你很会守住自己的位置和成果。`,
`太怕改变可能让你错过机会。试着接受一点新东西。`,
`存钱能力很好，财务状况稳定。`,
`太省或太乱花都不好。找到适合自己的平衡。`,
`看看你的存款，给自己一点安心/为自己花一笔小小的钱/写下你真正在乎的东西`,
`试着放下一件让你紧张的事/和信任的人聊聊你的担心/检查一下最近的花费习惯`],
[`Four of Pentacles`,`Stability · Security · Control`,`Hold on, but not too tight.`,
`The mochi cat hugs a coin tightly, with another coin on its head and two coins under its feet, in front of a small town. It shows the wish to keep things safe, and a reminder not to hold too tight.`,
`You care a lot about feeling safe, and you work hard to keep what you have. This stability is precious. Just be careful not to close yourself off because you fear losing it.`,
`You may be holding on too tight, or spending too freely. This is a chance to adjust and find the balance between keeping safe and relaxing.`,
`You want to protect this relationship, but too much control can feel like pressure. Try to trust a little more.`,
`There are some worries in love you can't let go of. Open your heart slowly, and love will feel lighter.`,
`Your work is stable, and you are good at keeping your place and results.`,
`Fear of change may make you miss chances. Try to accept something new.`,
`You are good at saving, and your finances are stable.`,
`Being too careful or too careless with money are both unhelpful. Find a balance that fits you.`,
`Look at your savings and feel calm/Spend a little money on yourself/Write down what you truly care about`,
`Let go of one thing that makes you tense/Talk about your worries with someone you trust/Check your recent spending habits`]);

C('5',[`星币五`,`困难・匮乏・寻求帮助`,`帮助就在身边。`,
`两只团子猫难过地走在雪地里，经过一扇温暖发光、映着五枚星币的窗户。象征暂时的困难，也提醒你帮助其实就在附近。`,
`现在可能有点辛苦，觉得缺钱、缺支持，或者有点孤单。但这只是暂时的，温暖的帮助就在身边，只要你愿意抬头去找。`,
`最难的时候正在过去，事情慢慢好转。别害怕开口求助，接受帮助也是一种勇气。`,
`感情里有些失落或距离感。主动表达需要，对方可能比你想的更愿意靠近。`,
`冷淡的时期正在结束，彼此开始重新靠近。`,
`工作上遇到一些困难，别一个人扛着，可以向身边的人求助。`,
`情况正在慢慢好转，新的支持和机会会出现。`,
`财务有点紧张，先照顾好基本需要，必要时可以找专业人士聊聊。`,
`财务压力在减轻，一步一步重新站稳。`,
`向一位朋友说说你的困难/列出身边可以求助的资源/今天做一件温暖自己的小事`,
`接受一个别人给的帮助/为好转的小事说声谢谢/制定一个简单的重建计划`],
[`Five of Pentacles`,`Hardship · Lack · Seeking help`,`Help is close by.`,
`Two mochi cats walk sadly through the snow past a warm, glowing window that shows five coins. It shows a hard time that will pass, and a reminder that help is close by.`,
`Things may feel hard right now. You may feel short of money, short of support, or a bit alone. But this is only for now. Warm help is close by if you look up and reach out.`,
`The hardest part is passing, and things are slowly getting better. Don't be afraid to ask for help. Accepting help takes courage too.`,
`Love may feel a little lonely or distant. Share what you need, and your partner may come closer than you think.`,
`The cold time is ending, and you are slowly coming close again.`,
`Work feels hard right now. Don't carry it alone. Ask the people around you for help.`,
`Things are slowly getting better, and new support and chances will appear.`,
`Money feels tight. Take care of basic needs first, and talk to a professional if you need to.`,
`Money stress is easing, and you are finding your feet step by step.`,
`Tell a friend about your trouble/List the people and places that can help you/Do one small warm thing for yourself today`,
`Accept help someone offers you/Say thank you for small good changes/Make a simple plan to rebuild`]);

C('6',[`星币六`,`给予・分享・互惠`,`温暖地给予与接受。`,
`团子猫一手拿着天平，一边把星币放给开心的小猫咪。象征公平的给予与分享，善意在彼此之间流动。`,
`给予和接受都在发生，善意正在流动！你可能帮助别人，也可能得到别人的帮助。保持公平和感恩，好运会继续循环。`,
`给予和接受有点失衡，可能你付出太多，或者帮助带着条件。这是一个提醒：让关系回到公平和真诚。`,
`彼此愿意付出和照顾，感情温暖又平衡。`,
`一方付出太多，感觉不太公平。说出你的感受，一起调整。`,
`可能得到前辈的帮助，或者你有机会帮助新人。`,
`工作中的付出和回报不太平衡，可以温和地争取应得的东西。`,
`财务有进有出，适合适度分享或接受资助。`,
`借钱或给钱要量力而行，先照顾好自己。`,
`帮助一位需要帮忙的人/真心感谢曾经帮过你的人/为喜欢的公益小事出一份力`,
`检查付出和回报是否平衡/学会温柔地说「不」/借钱前先想清楚自己的能力`],
[`Six of Pentacles`,`Giving · Sharing · Fair exchange`,`Give and receive with warmth.`,
`The mochi cat holds a balance scale and drops coins to a happy little kitten. It shows fair giving and sharing, with kindness moving between people.`,
`Giving and receiving are both happening, and kindness is flowing. You may help someone, or someone may help you. Stay fair and thankful, and good luck will keep going around.`,
`Giving and receiving feel out of balance. Maybe you give too much, or help comes with strings attached. This is a reminder to bring things back to fair and honest.`,
`You both give and care for each other. Love feels warm and balanced.`,
`One person gives too much, and it feels unfair. Share your feelings and adjust together.`,
`You may get help from someone more experienced, or you may help someone new.`,
`Your effort and rewards at work feel unequal. Gently ask for what you deserve.`,
`Money comes and goes. A good time to share a little or accept support.`,
`Only lend or give what you can afford. Take care of yourself first.`,
`Help someone who needs it/Thank someone who helped you before/Give a little to a cause you like`,
`Check if your giving and getting are balanced/Learn to say no kindly/Think about what you can afford before lending money`]);

C('7',[`星币七`,`耐心・投资・等待收获`,`耐心等待成长。`,
`团子猫靠着锄头，耐心地看着一丛长出七枚星币的灌木。象征努力已经种下，需要时间慢慢收获。`,
`你已经付出了很多努力，现在是停下来看看成果的时候。有些东西需要时间才能长大，耐心一点，收获会来。`,
`你可能有点着急，觉得付出没有回报。这是一个提醒：检查一下方向对不对，需要的话调整方法，再继续坚持。`,
`感情需要时间慢慢培养，耐心等待会有好结果。`,
`对感情的进展有点着急。想想你们要的是否一样，再决定下一步。`,
`长期的努力正在慢慢见效，适合回顾进度、调整计划。`,
`付出很多但进展慢。检查方法是否需要改变。`,
`长期的储蓄和规划正在慢慢累积，继续保持。`,
`别因为一时没回报就急着改变，先冷静评估，必要时请教专业人士。`,
`回顾一下最近的努力和成果/给长期目标定一个检查点/做一件需要耐心的小事`,
`想想哪些努力值得继续/调整一个没有效果的方法/对自己的进步多一点耐心`],
[`Seven of Pentacles`,`Patience · Investment · Waiting for harvest`,`Be patient and let it grow.`,
`The mochi cat leans on a garden hoe and looks patiently at a bush growing seven coins. It shows that the work is planted, and the harvest needs time.`,
`You have put in a lot of work, and now it is time to stop and look at your results. Some things need time to grow. Be patient, and the harvest will come.`,
`You may feel impatient, like your work brings nothing back. This is a reminder to check your direction. Change your method if needed, then keep going.`,
`Love needs time to grow. Patience will bring good results.`,
`You feel impatient about where love is going. Think about whether you want the same things, then decide your next step.`,
`Your long-term work is slowly paying off. A good time to review progress and adjust plans.`,
`You work hard but progress is slow. Check if your method needs to change.`,
`Long-term saving and planning are slowly building up. Keep going.`,
`Don't rush to change things just because results are slow. Think calmly, and ask a professional if needed.`,
`Review your recent work and results/Set a checkpoint for a long-term goal/Do one small thing that needs patience`,
`Think about which efforts are worth keeping/Change one method that is not working/Be more patient with your own progress`]);

C('8',[`星币八`,`专注・技艺・勤奋`,`一点一点做好它。`,
`团子猫在工作台前拿着锤子，认真地打造一枚星币，墙上挂着七枚已经完成的星币。象征专注练习，让技艺越来越好。`,
`现在是认真学习和练习的好时候！每天一点一点地进步，你的技能会越来越扎实。专注和用心，就是最好的投资。`,
`你可能有点分心，或者一直重复却没有进步。这是一个提醒：换个方法，或者给自己一点休息，再重新专注。`,
`用心经营感情，从每天的小事做起，关系会越来越好。`,
`太忙于工作而忽略了感情。留一点时间给对方吧。`,
`专注工作，提升技能，你的努力会被看见。适合学习新技能。`,
`工作有点重复无聊，或者太追求完美。找回做事的乐趣。`,
`通过努力工作和提升技能，收入会稳定增加。`,
`别只顾着埋头苦干，也要看看钱花在哪里。`,
`今天专心练习一项技能三十分钟/报名一门想学的小课程/把一件小事做到最好`,
`换一种新方法来学习/给自己一个小小的休息/别追求完美，先完成再说`],
[`Eight of Pentacles`,`Focus · Craft · Hard work`,`Make it better, bit by bit.`,
`The mochi cat works at a workbench with a hammer, carefully making a coin, with seven finished coins on the wall. It shows focused practice that makes your skills better and better.`,
`This is a great time to learn and practice. Grow a little every day, and your skills will become strong. Focus and care are the best investments.`,
`You may feel distracted, or you keep repeating things without getting better. This is a reminder to try a new method, or rest a little, then focus again.`,
`Care for love through small daily actions, and the relationship will keep getting better.`,
`You are so busy with work that love feels left out. Save some time for your partner.`,
`Focus on your work and build your skills. People will see your effort. A good time to learn something new.`,
`Work feels repetitive or boring, or you want everything perfect. Find the joy in your work again.`,
`Hard work and better skills will grow your income steadily.`,
`Don't only work hard. Also check where your money goes.`,
`Practice one skill for thirty minutes today/Sign up for a small class you like/Do one small task really well`,
`Try a new way to learn/Give yourself a short break/Finish first and stop chasing perfect`]);

C('9',[`星币九`,`独立・富足・享受`,`好好享受你的成果。`,
`团子猫戴着花冠，站在长满九枚星币的葡萄藤花园里，一只小鸟停在它的爪子上。象征靠自己努力得到的富足与优雅。`,
`你的努力开花结果了！你靠自己创造了舒适和富足的生活。好好享受这份成果，你值得。`,
`你可能太依赖别人，或者为了外表而花太多钱。这是一个提醒：回到自己的节奏，真正的富足来自内心的安稳。`,
`你很享受自己的生活，也能在感情中保持独立和自信。`,
`太独立让对方难以靠近，或者太依赖对方。找到平衡。`,
`你的能力让你独立又成功，工作成果令人满意。`,
`工作很好，但别忘了生活。也注意别过度依赖别人的认可。`,
`财务独立又富足，可以犒劳一下自己。`,
`注意别为了面子或享受而过度花钱。`,
`为自己准备一份小小的奖励/在大自然里散散步/写下你感谢自己的三件事`,
`想想哪些花费是真正需要的/找回让你安心的生活节奏/试着靠自己完成一件小事`],
[`Nine of Pentacles`,`Independence · Abundance · Enjoyment`,`Enjoy what you have earned.`,
`The mochi cat wears a flower crown in a garden of vines growing nine coins, with a little bird resting on its paw. It shows the comfort and grace you earn through your own work.`,
`Your hard work is blooming. You have built a comfortable, rich life on your own. Enjoy these results. You deserve it.`,
`You may depend on others too much, or spend too much to look good. This is a reminder to return to your own pace. True abundance comes from a calm heart.`,
`You enjoy your own life, and you stay independent and confident in love.`,
`Being too independent can keep your partner away, or you may depend on them too much. Find a balance.`,
`Your skills make you independent and successful. Your work results feel great.`,
`Work is good, but don't forget your life. Also try not to depend too much on praise from others.`,
`Your finances are independent and rich. Treat yourself a little.`,
`Be careful not to overspend just to look good or have fun.`,
`Give yourself a small reward/Take a walk in nature/Write three things you thank yourself for`,
`Think about which spending you truly need/Find your calm daily rhythm again/Try to do one small thing on your own`]);

C('10',[`星币十`,`家庭・传承・长久富足`,`珍惜身边的家人。`,
`两只团子猫和一只小猫咪站在一起，头顶的拱门上装饰着十枚星币，排列得像一棵树。象征家庭的温暖与长久的稳定。`,
`这是一张关于长久幸福的牌！家庭和睦、生活稳定，你建立的东西可以传承下去。珍惜身边的人，这就是最大的财富。`,
`家庭或长期计划中可能有一些小摩擦。这是一个提醒：多沟通、多包容，一起重新找到共同的方向。`,
`感情稳定长久，可能考虑成家或更深的承诺。`,
`家人的意见或长期规划让感情有点压力。一起好好聊聊。`,
`工作稳定，有长期发展的机会，适合做长远规划。`,
`长期规划需要调整，或者工作和家庭有冲突。重新排一下优先顺序。`,
`财务稳定，适合为家庭和未来做长期规划。`,
`家庭财务需要好好沟通，必要时可以请专业人士帮忙规划。`,
`和家人一起吃一顿饭/给长辈打个电话/为家庭写一个长期小目标`,
`和家人坦诚聊聊一件心事/重新看看你的长期计划/把家里的财务安排讲清楚`],
[`Ten of Pentacles`,`Family · Legacy · Lasting wealth`,`Cherish the family around you.`,
`Two mochi cats and a kitten stand together under an arch decorated with ten coins arranged like a tree. It shows warm family bonds and lasting stability.`,
`This card is about long-lasting happiness. Family is close, life is stable, and what you build can be passed on. Cherish the people around you. They are your greatest wealth.`,
`There may be small conflicts in your family or long-term plans. This is a reminder to talk more, be more understanding, and find a shared direction again.`,
`Love is stable and lasting. You may think about building a family or a deeper promise.`,
`Family opinions or long-term plans put some pressure on love. Talk it through together.`,
`Work is stable, with long-term growth. A good time for big-picture planning.`,
`Long-term plans need some changes, or work and family feel in conflict. Decide what comes first again.`,
`Money is stable. A good time to plan for your family and future.`,
`Talk openly about family money. Ask a professional for help with planning if needed.`,
`Have a meal with your family/Call an older family member/Write one long-term goal for your family`,
`Have an honest talk with family about one worry/Look at your long-term plans again/Make family money plans clear`]);

C('Page',[`星币侍从`,`学习・好奇・新计划`,`认真学，慢慢来。`,
`戴着绿色贝雷帽的团子猫在花田里举起一枚星币，睁大好奇的眼睛仔细研究。象征对学习和新机会的好奇心。`,
`你对新事物充满好奇，想认真学习和尝试。这是一个开始新计划、学新技能的好时机。一步一步来，就会有收获。`,
`你可能想得多、做得少，或者有点分心。这是一个提醒：选一件事，从最小的一步开始做起。`,
`感情有认真、踏实的开始，彼此慢慢了解。`,
`有好感但行动太慢。勇敢一点，迈出第一步。`,
`适合学习新技能、开始新项目，也可能有实习或培训的机会。`,
`计划很多但没有执行。定一个小目标，马上开始。`,
